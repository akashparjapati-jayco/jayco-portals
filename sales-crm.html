<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jayco Sales — Leads & Quotations</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF1F4; --panel:#fff; --panel2:#F6F7F9; --line:#DCE0E7; --line-soft:#E9ECF1;
  --txt:#12141A; --txt2:#59606C; --txt3:#8A919E;
  --brand:#E30016; --brand2:#FF3348; --brand-soft:rgba(227,0,22,.10);
  --ok:#1F9D6B; --ok-soft:rgba(53,179,126,.14); --warn:#B97708; --warn-soft:rgba(240,169,59,.18);
  --crit:#D8352B; --crit-soft:rgba(255,107,91,.16); --info:#2F6FED; --info-soft:rgba(47,111,237,.12);
  --shadow:0 8px 24px rgba(16,20,28,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Barlow Condensed','IBM Plex Sans',sans-serif;margin:0;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

/* sidebar rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-head{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.rail-head img{width:132px;display:block}
.rail-sub{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);font-weight:600;margin-top:8px}
.back{display:inline-flex;gap:5px;align-items:center;color:var(--txt2);font-size:10.5px;font-weight:600;margin-top:10px;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.back:hover{background:var(--panel2);color:var(--txt)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;color:var(--txt2);cursor:pointer;font-weight:500;font-size:13.5px;position:relative;border:0;background:none;width:100%;text-align:left}
.nav-i:hover{background:var(--panel2);color:var(--txt)}
.nav-i.on{background:var(--brand-soft);color:var(--txt);font-weight:600}
.nav-i.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-i .ic{width:18px;text-align:center}
.nav-i .cnt{margin-left:auto;background:var(--crit-soft);color:var(--crit);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:'IBM Plex Mono',monospace}
.rail-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:11.5px;color:var(--txt3)}
.rail-foot b{color:var(--txt);display:block;font-size:12.5px;word-break:break-all}
.role{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.role.admin{background:var(--brand-soft);border-color:transparent;color:var(--brand)}

/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(239,241,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:700;line-height:1.1}
.top .sub{color:var(--txt3);font-size:12px}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{padding:20px 24px 70px;display:flex;flex-direction:column;gap:18px}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:#C9CFD9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.gh{background:none}
.btn.dang{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:18px;font-weight:700}
.card-h .sp{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.card-b{padding:16px}
.hint{font-size:12px;color:var(--txt3)}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--panel2);color:var(--txt2);border:1px solid var(--line)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;border-top:3px solid var(--c,#C9CFD9);cursor:pointer}
.stat:hover{box-shadow:0 8px 20px -12px rgba(16,20,28,.3)}
.stat .k{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1.1}
.stat .n{font-size:12px;color:var(--txt3)}
.stat{min-height:112px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--panel2);text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#6E7683;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:nth-child(even){background:rgba(12,16,24,.022)}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--txt3)}
tfoot td{padding:9px 12px;font-weight:700;background:var(--panel2)}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.w2{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld label{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt2);font-weight:700}
.fld label .req{color:var(--brand)}
input,select,textarea{background:#fff;border:1px solid #C9CFD9;border-radius:7px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:70px;resize:vertical}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--crit);background:#fff7f6}
.fld .err{display:none;color:var(--crit);font-size:12px;font-weight:600}.fld.bad .err{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2)}
.chip:hover{border-color:var(--brand2);color:var(--brand)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 13px;font-weight:600;cursor:pointer;color:var(--txt2);font-size:13px}
.seg button.on{background:var(--brand);color:#fff}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:240px}
.col-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;border-top:3px solid var(--c)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{outline:2px dashed var(--brand)}
.lc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;border-left:3px solid var(--c,#C9CFD9)}
.lc:hover{box-shadow:0 6px 16px -10px rgba(16,20,28,.4)}
.lc b{display:block}.lc small{color:var(--txt3)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.tl-i:last-child{border-bottom:0}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.tl-t{font-size:12px;color:var(--txt3)}

/* modal / toast */
.ovl{position:fixed;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:640px;margin:auto 0}
.modal.wide{max-width:980px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:20px}.modal-h .x{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;color:var(--txt3);cursor:pointer}
.modal-b{padding:18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--panel2);border-radius:0 0 12px 12px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px}
.toast.err{border-left-color:var(--crit)}.toast.warn{border-left-color:var(--warn)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--txt2)}
.note.w{border-left-color:var(--warn)}.note.c{border-left-color:var(--crit)}.note b{color:var(--txt)}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--brand)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}.kv:last-child{border:0}
.kv span:first-child{color:var(--txt2)}.kv span:last-child{font-weight:600;text-align:right}
.totals{margin-left:auto;width:340px;max-width:100%}
.totals .kv.big{font-size:16px;border-top:2px solid var(--txt);border-bottom:0;padding-top:9px;margin-top:4px}
.line-tbl input,.line-tbl select{padding:6px 8px}
.line-tbl td{padding:6px 6px}
.step{display:flex;gap:6px;flex-wrap:wrap}
.step .s{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--txt3)}
.step .s.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}.step .s.cur{background:var(--brand);color:#fff;border-color:transparent}
#login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center}
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;width:360px;max-width:92vw;box-shadow:var(--shadow)}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:relative;height:auto}.grid2,.grid3{grid-template-columns:1fr}.view{padding:14px}.fld.w2{grid-column:auto}}
</style>
</head>

const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const inrK = v => { v = Number(v||0); return v >= 1e7 ? '₹'+(v/1e7).toFixed(2)+' Cr' : v >= 1e5 ? '₹'+(v/1e5).toFixed(2)+' L' : inr(v,0); };

function inrWords(n){
  n = Math.round(n); if(!n) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? ' '+a[x%10] : '');
  const three = x => (x > 99 ? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100 ? two(x%100) : '');
  let out=''; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out += three(cr)+' Crore '; if(lk) out += two(lk)+' Lakh '; if(th) out += two(th)+' Thousand '; if(n) out += three(n);
  return out.trim();
}

let db = null, USER = null;
const DB = {
  async all(c){ const s = await db.collection(c).get(); return s.docs.map(d => ({id:d.id, ...d.data()})); },
  async add(c, data){ const r = await db.collection(c).add(data); return r.id; },
  async set(c, id, data){ await db.collection(c).doc(id).set(data, {merge:true}); },
  async update(c, id, data){ await db.collection(c).doc(id).update(data); },
  async remove(c, id){ await db.collection(c).doc(id).delete(); },
  async next(key){
    const ref = db.collection('crm_counters').doc(key);
    return db.runTransaction(async t => {
      const d = await t.get(ref); const n = ((d.exists ? d.data().n : 0) || 0) + 1;
      t.set(ref, {n}); return n;
    });
  }
};

function boot(){

      try{

        $('#conn').textContent = '● Connected'; $('#conn').style.color = 'var(--ok)';
        $('#who').textContent = u.email; const r = $('#roleTag'); r.textContent = isAdmin() ? 'admin' : 'sales'; r.className = 'role ' + (isAdmin() ? 'admin' : '');
        buildNav(); route(location.hash || '#dashboard');

      }catch(err){ console.error(err); $('#lgErr').textContent = 'Could not load data: ' + err.message; $('#lgErr').hidden = false; $('#login').hidden = false; }
    });

function doLogin(){

  if(!email || !pwd){ err.textContent = 'Enter email and password.'; err.hidden = false; return; }
  err.hidden = true; $('#lgBtn').disabled = true;
  firebase.auth().signInWithEmailAndPassword(email, pwd).then(() => localStorage.setItem('crm_email', email))
    .catch(e => { err.textContent = /password|credential|user-not-found/.test(e.code||e.message) ? 'Incorrect email or password.' : e.message; err.hidden = false; })

async function addLeadActivity(lead, type, text, extra={}){

}
async function addQuoteActivity(q, text, extra={}){

}
function customerFor(l){

   EMAIL INBOX SYNC (Apps Script backend)
   ============================================================ */
async function syncInbox(silent){
  if(!SET.scriptUrl || !SET.scriptKey){ if(!silent) toast('Connect the email backend first — Settings & Setup', 'warn'); return 0; }
  const r = await fetch(SET.scriptUrl + '?action=pull&key=' + encodeURIComponent(SET.scriptKey)); const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Backend error');
  let n = 0; const ids = [];
  for(const m of (j.leads || [])){
    ids.push(m.id);
    if(LEADS.some(l => l.sourceRef === m.id)) continue;
    const lead = {leadNo: await newLeadNo(), createdAt: m.receivedAt || nowISO(), source: m.source || 'Email', sourceRef: m.id,
      name: m.name || m.company || (m.email || '').split('@')[0], company: m.company || '', email: m.email || '', phone: m.phone || '', city: m.city || '', state: '',
      requirement: [m.product && ('Product: ' + m.product), m.qty && ('Quantity: ' + m.qty)].filter(Boolean).join('\n') || (m.body || '').slice(0, 300),
      emailSubject: m.subject || '', emailBody: m.body || '', attachments: m.attachments || '', stage: 'New', owner: '', priority: 'Warm', value: 0,
      nextFollowUp: todayISO(), items: [], quoteIds: [], activities: [{ts: nowISO(), by: 'system', type: 'System', text: 'Captured from ' + (m.source || 'email') + ': ' + (m.subject || '')}]};
    const cust = customerFor(lead); if(cust){ lead.customerId = cust.id; if(!lead.company) lead.company = cust.name; }
    lead.id = await DB.add('crm_leads', lead); LEADS.push(lead); n++;
  }
  if(ids.length) await fetch(SET.scriptUrl, {method:'POST', body: JSON.stringify({key: SET.scriptKey, action:'ack', data:{ids}})});
  pushFollowups().catch(() => {});
  if(n){ toast(n + ' new lead' + (n > 1 ? 's' : '') + ' from email'); updateBadges(); if(['','#dashboard','#leads'].includes(location.hash)) rerender(); }
  else if(!silent) toast('Inbox is up to date');
  return n;
}
ACT.sync = async el => { el.disabled = true; try{ await syncInbox(false); } finally{ el.disabled = false; } };
async function pushFollowups(){
  if(!SET.scriptUrl || !SET.scriptKey) return;
  const t = todayISO();
  const due = LEADS.filter(l => !['Won','Lost'].includes(l.stage) && l.nextFollowUp && l.nextFollowUp <= t).map(l => ({leadNo: l.leadNo, company: l.company || l.name, stage: l.stage, owner: (l.owner || '').split('@')[0], nextFollowUp: l.nextFollowUp, overdue: l.nextFollowUp < t}));
  const quotes = QUOTES.filter(q => q.status === 'Sent' && q.sentAt && daysBetween(q.sentAt.slice(0,10), t) >= num(SET.followUpDays)).map(q => ({quoteNo: q.quoteNo, customer: q.customerName, total: inr(q.total, 0), days: daysBetween(q.sentAt.slice(0,10), t)}));
  await fetch(SET.scriptUrl, {method:'POST', body: JSON.stringify({key: SET.scriptKey, action:'followups', data:{due, quotes, digestTo: SET.digestTo}})});
}

/* ============================================================
   QUOTATIONS — calculation
   ============================================================ */
function calcQuote(q){
  const co = (SET.company.state || 'Gujarat').toLowerCase();
  const intra = (q.state || SET.company.state || '').toLowerCase() === co;
  let sub = 0, gst = 0;
  const lines = (q.items || []).map(it => {
    const rate = r2(num(it.listRate) * (1 - num(it.discPct) / 100)), amt = r2(num(it.qty) * rate), g = r2(amt * num(it.gstPct) / 100);
    sub += amt; gst += g; return {rate, amt, g};
  });
  const fr = num(q.freight), frg = r2(fr * num(SET.freightGst) / 100);
  const taxable = r2(sub + fr), tax = r2(gst + frg);
  const cgst = intra ? r2(tax / 2) : 0, sgst = intra ? r2(tax - cgst) : 0, igst = intra ? 0 : tax;
  const raw = taxable + tax, total = Math.round(raw);
  return {lines, sub: r2(sub), freight: fr, taxable, tax, cgst, sgst, igst, roundOff: r2(total - raw), total, intra};
}
const lookupRate = code => { const c = String(code || '').trim().toLowerCase(); return RATES.find(r => String(r.itemCode).toLowerCase() === c); };
const lookupItem = code => { const c = String(code || '').trim().toLowerCase(); return ITEMS.find(r => String(r.itemCode).toLowerCase() === c); };

const blankLine = () => ({id: uid(), itemCode:'', description:'', hsn:'', unit:'Nos', qty:'', listRate:'', discPct:0, gstPct: SET.defaultGst});
const normPhone = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? '91' + d : d; };

/* push QD values into the existing line inputs without rebuilding them (keeps focus and typing) */
function syncLines(){
  $$('#qLines tr').forEach((tr, i) => { const it = QD.items[i]; if(!it) return;
    $$('[data-f]', tr).forEach(inp => { const v = it[inp.dataset.f]; if(v !== undefined && String(inp.value) !== String(v)) inp.value = v; }); });
  refreshAmounts();
}
function refreshAmounts(){ const c = calcQuote(QD); $$('#qLines tr').forEach((tr, i) => { const el = $('[data-amt]', tr); if(el) el.textContent = c.lines[i] ? inr(c.lines[i].amt) : '—'; }); }
function drawTotals(){
  const c = calcQuote(QD); QD._calc = c;
  $('#qTotals').innerHTML = `<div class="kv"><span>Items total</span><span>${inr(c.sub)}</span></div>${c.freight ? `<div class="kv"><span>Freight / packing</span><span>${inr(c.freight)}</span></div>` : ''}

    <div class="kv"><span>Round off</span><span>${inr(c.roundOff)}</span></div><div class="kv big"><span>Grand total</span><span>${inr(c.total)}</span></div>

function onQInput(e){
  if(ROUTING || !QD) return;
  const tr = e.target.closest('#qLines tr'), f = e.target.dataset.f; if(!tr || !f) return;
  const it = QD.items[+tr.dataset.i]; it[f] = e.target.value; refreshAmounts(); drawTotals();
}
let QCHANGING = false;
function onQChange(e){
  if(ROUTING || QCHANGING || !QD) return;
  const tr = e.target.closest('#qLines tr'), f = e.target.dataset.f; if(!tr || f !== 'itemCode') return;
  QCHANGING = true; try{ applyItemCode(tr, e.target); } finally { QCHANGING = false; }
}
function applyItemCode(tr, input){
  const e = {target: input};
  const it = QD.items[+tr.dataset.i], code = e.target.value.trim(); it.itemCode = code;
  const r = lookupRate(code), m = lookupItem(code), cust = customerByName($('#qd_cust').value);
  if(r){ Object.assign(it, {description: r.description || it.description, hsn: r.hsn || '', unit: r.unit || 'Nos', listRate: r.rate, gstPct: r.gstPct != null && r.gstPct !== '' ? r.gstPct : SET.defaultGst});
    if(!num(it.discPct) && cust && num(cust.discountPct)) it.discPct = num(cust.discountPct); if(!num(r.rate)) toast(code + ' has no rate in the Price List — enter one', 'warn'); }
  else if(m){ it.description = m.description || it.description; toast(code + ' is not in the Price List yet — enter the rate', 'warn'); }
  else if(code) toast(code + ' is a new item — enter details and the rate', 'warn');
  syncLines(); drawTotals();
}
ACT.addLine = () => { readHeader(); QD.items.push(blankLine()); drawLines(); drawTotals(); };
ACT.rmLine = el => { if(QD.items.length === 1) return; QD.items.splice(+el.dataset.i, 1); drawLines(); drawTotals(); };

async function ensureCustomer(q){
  let c = customerByName(q.customerName);
  const info = {contact: q.contactName, email: q.email, phone: q.phone, gstin: q.gstin, state: q.state, address: q.address};
  if(!c){ c = {name: q.customerName.trim(), isExclusive: false, ...info, createdAt: nowISO()}; c.id = await DB.add('customers', c); CUSTOMERS.push(c); }
  else { const patch = {}; Object.keys(info).forEach(k => { if(info[k] && !c[k]) patch[k] = info[k]; }); if(Object.keys(patch).length){ await DB.update('customers', c.id, patch); Object.assign(c, patch); } }
  return c;
}
ACT.saveQuote = async el => {
  readHeader(); const submit = el.dataset.submit === '1', q = QD;
  $('#fQCust').classList.toggle('bad', !q.customerName);
  if(!q.customerName){ toast('Customer is required', 'err'); return; }
  const lines = q.items.filter(i => i.itemCode.trim() || num(i.qty));
  if(!lines.length || lines.some(i => !i.itemCode.trim() || num(i.qty) <= 0)){ toast('Every line needs an item code and a quantity above zero', 'err'); return; }
  if(lines.some(i => num(i.listRate) <= 0) && submit && !confirm('Some items have no rate. Submit anyway?')) return;
  if(q.validUntil < q.date){ toast('"Valid until" cannot be before the quotation date', 'err'); return; }
  q.items = lines; const c = calcQuote(q);
  const cust = await ensureCustomer(q); q.customerId = cust.id;
  const data = {...q, subtotal: c.sub, taxable: c.taxable, tax: c.tax, cgst: c.cgst, sgst: c.sgst, igst: c.igst, roundOff: c.roundOff, total: c.total, updatedAt: nowISO()}; delete data._calc; delete data.id;
  let rec;
  if(q.id){ rec = quoteById(q.id); await DB.update('crm_quotes', q.id, data); Object.assign(rec, data); }
  else {
    const fy = fyOf(q.date), n = await DB.next('quote-' + fy);
    Object.assign(data, {quoteNo: 'JAY/QT/' + fy + '/' + String(n).padStart(4, '0'), baseNo: 'JAY/QT/' + fy + '/' + String(n).padStart(4, '0'), rev: 0, preparedBy: me(), createdAt: nowISO(), status: 'Draft',
      activities: [{ts: nowISO(), by: me(), text: 'Quotation created'}]});
    rec = {...data}; rec.id = await DB.add('crm_quotes', data); QUOTES.push(rec);
    const lead = q.leadId && leadById(q.leadId);
    if(lead){ await DB.update('crm_leads', lead.id, {quoteIds: [...(lead.quoteIds || []), rec.id], customerId: cust.id}); lead.quoteIds = [...(lead.quoteIds || []), rec.id];
      if(['New','Contacted'].includes(lead.stage)) await changeStage(lead, 'Quoted', rec.quoteNo); else await addLeadActivity(lead, 'Quote', 'Quotation ' + rec.quoteNo + ' prepared'); }
  }
  QD = null;
  if(submit) await submitQuote(rec); else toast('Draft saved');
  location.hash = '#quote/' + rec.id;
};
async function submitQuote(q){
  const limit = num(SET.approvalLimit);
  if(limit > 0 && q.total <= limit){
    await addQuoteActivity(q, 'Auto-approved (total within ' + inr(limit, 0) + ' limit)', {status:'Approved', approval:{by:'auto', at: nowISO(), comment:''}}); toast('Approved automatically — within your limit');
  } else { await addQuoteActivity(q, 'Submitted for approval', {status:'Pending approval', approval:{}}); toast('Submitted for approval'); }
  updateBadges();
}

ACT.doSend = async el => {
  const q = quoteById(el.dataset.id), to = $('#sdTo').value.trim(); $('#fSdTo').classList.toggle('bad', !to); if(!to) return;
  const sub = $('#sdSub').value, msg = $('#sdMsg').value, cc = $('#sdCc').value.trim();
  el.disabled = true;
  try{
    if(SET.scriptUrl && SET.scriptKey){
      const pdf = buildQuotePdf(q).output('datauristring').split(',')[1];
      const r = await fetch(SET.scriptUrl, {method:'POST', body: JSON.stringify({key: SET.scriptKey, action:'send', data:{to, cc, subject: sub, text: msg, replyTo: SET.company.email || '', attachments:[{name: q.quoteNo.replace(/[^A-Za-z0-9-]+/g, '_') + '.pdf', base64: pdf, mime:'application/pdf'}]}})});
      const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Email failed');

function pdfHeader(doc, title, rightLines){

  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text(co.name, M, y + 28);

  (rightLines || []).forEach((l, i) => doc.text(l, rx, y - 12 + i * 11, {align:'right'}));
  return Math.max(y + 8, y - 12 + ((rightLines || []).length - 1) * 11 + 12);
}
function pdfBlocks(doc, y, left, right){
  const W = doc.internal.pageSize.getWidth(), M = 36, cw = (W - M * 2 - 12) / 2, LINE = [220,224,231], MUT = [128,133,138], INK = [18,20,26];
  const draw = (x, head, lines) => {
    doc.setDrawColor(...LINE); doc.roundedRect(x, y, cw, 84, 3, 3);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(...MUT); doc.text(head, x + 10, y + 13);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(doc.splitTextToSize(String(lines[0] || ''), cw - 20)[0], x + 10, y + 27);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(60,64,72);
    doc.text(lines.slice(1).filter(Boolean).flatMap(l => doc.splitTextToSize(String(l), cw - 20)).slice(0, 6), x + 10, y + 39, {lineHeightFactor: 1.35});
  };
  draw(M, left[0], left.slice(1)); draw(M + cw + 12, right[0], right.slice(1));

}
const pf = n => Number(n || 0).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});

  return doc;

let POD = null;
ACT.acceptQ = el => {
  const q = quoteById(el.dataset.id), c = calcQuote(q);
  POD = {id: q.id, remarkAuto: true, lines: q.items.map((it, i) => ({itemCode: it.itemCode, description: it.description, qQty: num(it.qty), qRate: c.lines[i].rate, qty: num(it.qty), rate: c.lines[i].rate, material: (lookupRate(it.itemCode) || lookupItem(it.itemCode) || {}).material || ''}))};
  openModal(`${modalHead('Customer accepted — create purchase order')}<div class="modal-b">
    <div class="note" style="margin-bottom:14px">Enter the customer's PO details. The quantities and rates are checked against <b>${esc(q.quoteNo)}</b>, then the PO is created in <b>PO Management</b>.</div>
    <div class="form">
      ${fld('Customer PO number', '<input id="poNo" placeholder="e.g. VKS/2025-26/014">', {req:true, id:'fPoNo', err:'PO number is required'})}
      ${fld('Customer PO date', `<input id="poDt" type="date" value="${todayISO()}">`, {req:true, id:'fPoDt', err:'PO date is required'})}
      ${fld('Delivery date', `<input id="poDel" type="date" min="${todayISO()}">`, {req:true, id:'fPoDel', err:'Pick the delivery date'})}
      ${fld('Delivery remark', '<input id="poRem" maxlength="200" placeholder="Fills from the date — or type your own">', {req:true, id:'fPoRem', err:'Delivery remark is compulsory', cls:'w2'})}
      ${fld('PO copy link (optional)', '<input id="poLink" placeholder="OneDrive / Drive link to the customer PO">', {cls:'w2'})}
      ${fld('📌 Special note (optional)', '<textarea id="poNote" style="min-height:54px" placeholder="Packing, inspection, test certificate…"></textarea>', {cls:'full'})}
    </div>
    <div class="tw" style="margin-top:14px"><table class="line-tbl"><thead><tr><th>Item</th><th class="num">Quoted qty</th><th class="num">Quoted rate</th><th class="num" style="width:100px">PO qty</th><th class="num" style="width:120px">PO rate</th><th>Check</th></tr></thead><tbody id="poLines"></tbody></table></div>
    <div class="hint" style="margin-top:6px">Set a PO quantity to 0 to leave an item out of the PO.</div></div>
    <div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn ok" data-act="confirmPO" data-id="${q.id}">Create PO in PO Management</button></div>`, true);
  drawPoLines();
  $('#poDel').addEventListener('change', () => { const d = $('#poDel').value; if(d && ($('#poRem').value.trim() === '' || POD.remarkAuto)){ $('#poRem').value = 'Delivery by ' + fmtDate(d); POD.remarkAuto = true; } ['fPoDel','fPoRem'].forEach(id => $('#' + id).classList.remove('bad')); });
  $('#poRem').addEventListener('input', () => { POD.remarkAuto = false; });
  $('#poLines').addEventListener('input', e => { const i = +e.target.closest('tr').dataset.i, f = e.target.dataset.f; POD.lines[i][f] = num(e.target.value); drawPoChecks(); });
};
function poLineState(l){ const qtyDiff = num(l.qty) !== num(l.qQty), rateDiff = Math.abs(num(l.rate) - num(l.qRate)) > 0.009; return {qtyDiff, rateDiff, ok: !qtyDiff && !rateDiff}; }
function drawPoLines(){
  $('#poLines').innerHTML = POD.lines.map((l, i) => `<tr data-i="${i}"><td><b>${esc(l.itemCode)}</b><div class="hint">${esc(l.description)}</div></td><td class="num">${l.qQty}</td><td class="num">${inr(l.qRate)}</td>
    <td><input data-f="qty" type="number" min="0" value="${l.qty}" style="text-align:right"></td><td><input data-f="rate" type="number" min="0" step="0.01" value="${l.rate}" style="text-align:right"></td><td data-chk></td></tr>`).join('');
  drawPoChecks();
}
function drawPoChecks(){
  $$('#poLines tr').forEach((tr, i) => { const s = poLineState(POD.lines[i]);
    $('[data-chk]', tr).innerHTML = s.ok ? '<span class="pill ok">✓ matches</span>' : `${s.qtyDiff ? `<span class="pill crit">qty ${num(POD.lines[i].qty) - POD.lines[i].qQty > 0 ? '+' : ''}${num(POD.lines[i].qty) - POD.lines[i].qQty}</span> ` : ''}${s.rateDiff ? `<span class="pill warn">rate ${num(POD.lines[i].rate) > POD.lines[i].qRate ? '↑' : '↓'} ${inr(Math.abs(num(POD.lines[i].rate) - POD.lines[i].qRate))}</span>` : ''}`; });
}
ACT.confirmPO = async el => {
  const q = quoteById(el.dataset.id), g = id => $('#' + id).value.trim();
  const checks = [['fPoNo', g('poNo')], ['fPoDt', g('poDt')], ['fPoDel', g('poDel')], ['fPoRem', g('poRem').length >= 3 ? g('poRem') : '']];
  checks.forEach(([id, v]) => $('#' + id).classList.toggle('bad', !v));
  if(checks.some(c => !c[1])){ toast('Fill the highlighted fields', 'err'); return; }
  const lines = POD.lines.filter(l => num(l.qty) > 0);
  if(!lines.length){ toast('At least one item needs a PO quantity', 'err'); return; }
  const mism = POD.lines.filter(l => !poLineState(l).ok).length;
  if(mism && !confirm(mism + ' line(s) differ from the quotation (quantity or rate).\n\nCreate the PO with the customer\'s figures anyway?')) return;
  el.disabled = true;
  try{
    const existing = await DB.all('purchaseOrders');
    if(existing.some(p => String(p.poNo).trim().toLowerCase() === g('poNo').toLowerCase() && String(p.customerName).toLowerCase() === q.customerName.toLowerCase())) throw new Error('PO ' + g('poNo') + ' already exists for ' + q.customerName + ' in PO Management.');
    const cust = await ensureCustomer(q), TS = firebase.firestore.Timestamp, poDate = TS.fromDate(new Date(g('poDt'))), deliveryDate = TS.fromDate(new Date(g('poDel')));
    const header = {poNo: g('poNo'), poDate, customerId: cust.id, customerName: cust.name, isExclusive: !!cust.isExclusive, deliveryRemark: g('poRem'), deliveryDate, specialNote: g('poNote'),
      attachments: g('poLink') ? [{description: 'Customer PO copy', url: g('poLink')}] : [], sourceQuote: q.quoteNo, createdAt: firebase.firestore.FieldValue.serverTimestamp()};
    const poId = await DB.add('purchaseOrders', header);
    for(const l of lines){
      await DB.add('poItems', {poId, poNo: header.poNo, poDate, customerId: cust.id, customerName: cust.name, isExclusive: !!cust.isExclusive, itemCode: l.itemCode, itemDescription: l.description || '', material: l.material || '',
        deliveryRemark: header.deliveryRemark, deliveryDate, specialNote: header.specialNote, orderedQty: num(l.qty), despatchedQty: 0, pendingQty: num(l.qty), status: 'Pending', rate: num(l.rate), sourceQuote: q.quoteNo, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    }
    const cp = {no: header.poNo, date: g('poDt'), deliveryDate: g('poDel'), remark: header.deliveryRemark, specialNote: header.specialNote, link: g('poLink'), mismatches: mism,
      lines: lines.map(l => ({itemCode: l.itemCode, description: l.description, qty: num(l.qty), rate: num(l.rate)}))};
    await addQuoteActivity(q, 'Accepted — PO ' + header.poNo + ' created in PO Management' + (mism ? ' (' + mism + ' difference(s) from quotation)' : ''), {status:'Accepted', responseAt: nowISO(), poNo: header.poNo, poId, customerPo: cp});
    const lead = q.leadId && leadById(q.leadId);
    if(lead){ await changeStage(lead, 'Won', 'PO ' + header.poNo); await DB.update('crm_leads', lead.id, {nextFollowUp: ''}); lead.nextFollowUp = ''; }
    closeModal(); toast('PO ' + header.poNo + ' created in PO Management', 'ok'); rerender();
  } finally { el.disabled = false; }
};

ACT.saveRate = async el => {

ACT.delRate = async el => { if(!confirm('Delete this item from the price list?')) return; await DB.remove('crm_rates', el.dataset.id); RATES = RATES.filter(r => r.id !== el.dataset.id); closeModal(); viewRates(); };
ACT.rateFromMaster = async () => {
  let n = 0; for(const m of ITEMS){ if(!m.itemCode || lookupRate(m.itemCode)) continue; const d = {itemCode: m.itemCode, description: m.description || '', material: m.material || '', hsn: '', unit: 'Nos', rate: 0, gstPct: SET.defaultGst}; d.id = await DB.add('crm_rates', d); RATES.push(d); n++; }
  toast(n ? n + ' items added — now set their rates' : 'Every PO master item is already in the Price List'); viewRates();
};
ACT.rateIncrease = () => openModal(`${modalHead('Revise all rates')}<div class="modal-b">${fld('Change every list rate by (%)', '<input id="rvPct" type="number" step="0.1" placeholder="e.g. 5 for +5%, -3 for -3%">', {req:true})}<div class="hint" style="margin-top:8px">Affects all ${RATES.length} items with a rate. Existing quotations are not changed.</div></div><div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="doIncrease">Apply</button></div>`);
ACT.doIncrease = async () => {
  const p = num($('#rvPct').value); if(!p){ toast('Enter a percentage', 'warn'); return; } if(!confirm('Change all rates by ' + p + '%?')) return;
  for(const r of RATES){ if(!num(r.rate)) continue; const nr = r2(num(r.rate) * (1 + p / 100)); await DB.update('crm_rates', r.id, {rate: nr}); r.rate = nr; }
  closeModal(); toast('Rates revised by ' + p + '%'); viewRates();
};
ACT.rateExport = () => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(RATES.map(r => ({'Item Code': r.itemCode, Description: r.description, Material: r.material, HSN: r.hsn, Unit: r.unit, Rate: r.rate, 'GST %': r.gstPct}))), 'Price List'); XLSX.writeFile(wb, 'Jayco_Price_List_' + todayISO() + '.xlsx'); };
async function importRates(e){
  const f = e.target.files[0]; if(!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}), sheet = wb.Sheets['Price List'] || wb.Sheets[wb.SheetNames.find(n => !/about|check/i.test(n)) || wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  const pick = (r, ...ks) => { for(const k of Object.keys(r)){ if(ks.includes(k.toLowerCase().replace(/[\s._%()\/]+/g, ''))) return r[k]; } return ''; };
  const ops = [], seen = new Set(); let skipped = 0;
  for(const r of rows){
    const code = String(pick(r, 'itemcode', 'code', 'item')).trim(); if(!code || seen.has(code.toLowerCase())){ if(code) skipped++; continue; } seen.add(code.toLowerCase());
    const gstRaw = pick(r, 'gst', 'gstpct', 'gstrate');
    const data = {itemCode: code, description: String(pick(r, 'description', 'desc', 'itemdescription')).trim(), hsn: String(pick(r, 'hsn', 'hsncode')).trim(), unit: String(pick(r, 'unit', 'uom')).trim() || 'Nos',
      rate: num(pick(r, 'rate', 'price', 'listrate', 'mrp')), gstPct: gstRaw === '' ? num(SET.defaultGst) : num(gstRaw), material: String(pick(r, 'material')).trim()};
    const series = String(pick(r, 'series')).trim(), dia = pick(r, 'shaftboremm', 'shaftdia', 'bore'), wt = pick(r, 'weightkg', 'weight');
    if(series) data.series = series; if(dia !== '') data.dia = num(dia); if(wt !== '') data.weight = num(wt);
    ops.push(data);
  }
  if(!ops.length){ toast('No item rows found in that file', 'err'); return; }
  if(!confirm(`Import ${ops.length} items from "${f.name}"?\n\nExisting item codes are updated; new ones are added.`)) { e.target.value = ''; return; }
  let add = 0, upd = 0, done = 0; const t0 = toastProgress('Importing price list… 0 / ' + ops.length);
  for(let i = 0; i < ops.length; i += 25){
    await Promise.all(ops.slice(i, i + 25).map(async data => {
      const ex = lookupRate(data.itemCode);
      if(ex){ await DB.update('crm_rates', ex.id, data); Object.assign(ex, data); upd++; }
      else { const id = await DB.add('crm_rates', data); RATES.push({...data, id}); add++; }
    }));
    done = Math.min(i + 25, ops.length); t0.textContent = 'Importing price list… ' + done + ' / ' + ops.length;
  }
  t0.remove(); e.target.value = '';
  toast(`Imported ${ops.length} items: ${add} added, ${upd} updated` + (skipped ? ` · ${skipped} duplicate code(s) skipped` : '') + (ops.some(o => !o.rate) ? ` · ${ops.filter(o => !o.rate).length} without a rate` : ''), 'ok'); viewRates();
}
function toastProgress(msg){ const t = document.createElement('div'); t.className = 'toast warn'; t.textContent = msg; $('#toasts').appendChild(t); return t; }

let RFY = '';
function viewReports(){
  setTitle('Reports', 'Where leads come from, what converts and why we lose');
  const t = todayISO(); if(!RFY) RFY = fyOf(t);
  const fys = [...new Set([fyOf(t), ...LEADS.map(l => fyOf((l.createdAt || t).slice(0,10))), ...QUOTES.map(q => fyOf((q.date || t).slice(0,10)))])].sort().reverse();
  $('#topr').innerHTML = `<select id="rfy" style="width:auto">${fys.map(f => `<option ${f===RFY?'selected':''}>${f}</option>`).join('')}</select>`;
  const L = LEADS.filter(l => fyOf((l.createdAt || t).slice(0,10)) === RFY), Q = QUOTES.filter(q => fyOf((q.date || t).slice(0,10)) === RFY && q.status !== 'Revised');
  const won = l => l.stage === 'Won', lost = l => l.stage === 'Lost';
  const wonValueOf = l => QUOTES.filter(q => q.leadId === l.id && q.status === 'Accepted').reduce((a, q) => a + num(q.total), 0);
  const bySource = SOURCES.map(s => { const ls = L.filter(l => l.source === s); return {s, n: ls.length, quoted: ls.filter(l => (l.quoteIds || []).length).length, won: ls.filter(won).length, lost: ls.filter(lost).length, val: ls.reduce((a, l) => a + wonValueOf(l), 0)}; }).filter(x => x.n);
  const owners = [...new Set(L.map(l => l.owner || 'Unassigned'))].map(o => { const ls = L.filter(l => (l.owner || 'Unassigned') === o); return {o, n: ls.length, won: ls.filter(won).length, val: ls.reduce((a, l) => a + wonValueOf(l), 0)}; });
  const reasons = LOST_REASONS.map(r => ({r, n: L.filter(l => lost(l) && l.lostReason === r).length})).filter(x => x.n);
  const months = []; { const [y0] = RFY.split('-').map(Number); for(let i = 0; i < 12; i++){ const m = (3 + i) % 12, y = y0 + (3 + i >= 12 ? 1 : 0); months.push(y + '-' + String(m + 1).padStart(2, '0')); } }
  const mq = months.map(m => ({m, quoted: Q.filter(q => q.date.slice(0,7) === m).reduce((a, q) => a + num(q.total), 0), won: Q.filter(q => q.status === 'Accepted' && (q.responseAt || q.date).slice(0,7) === m).reduce((a, q) => a + num(q.total), 0)}));
  const mx = Math.max(1, ...mq.map(x => x.quoted)); const cnt = s => L.filter(l => l.stage === s).length; const total = Math.max(1, L.length);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  $('#view').innerHTML = `
  <div class="stats">
    <div class="stat" style="--c:#2F6FED"><div class="k">Leads (FY ${RFY})</div><div class="v">${L.length}</div><div class="n">${L.filter(l => (l.quoteIds || []).length).length} quoted</div></div>
    <div class="stat" style="--c:#8B5CF6"><div class="k">Quotations</div><div class="v">${Q.length}</div><div class="n">${inrK(Q.reduce((a, q) => a + num(q.total), 0))} quoted</div></div>
    <div class="stat" style="--c:#1F9D6B"><div class="k">Orders won</div><div class="v">${Q.filter(q => q.status === 'Accepted').length}</div><div class="n">${inrK(Q.filter(q => q.status === 'Accepted').reduce((a, q) => a + num(q.total), 0))}</div></div>
    <div class="stat" style="--c:#EA7A12"><div class="k">Quote → order</div><div class="v">${pct(Q.filter(q => q.status === 'Accepted').length, Q.filter(q => ['Sent','Accepted','Rejected','Expired'].includes(q.status)).length)}</div><div class="n">of quotes sent</div></div></div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h3>Funnel</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:9px">${STAGES.map(s => `<div><div style="display:flex;justify-content:space-between"><span>${s}</span><b>${cnt(s)} <span class="hint">${pct(cnt(s), L.length)}</span></b></div><div class="bar"><i style="width:${cnt(s) / total * 100}%;background:${STAGE_COLOR[s]}"></i></div></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h3>Why we lose</h3></div><div class="tw"><table><thead><tr><th>Reason</th><th class="num">Leads</th></tr></thead><tbody>${reasons.map(x => `<tr><td>${esc(x.r)}</td><td class="num">${x.n}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No lost leads in this year.</td></tr>'}</tbody></table></div></div></div>
  <div class="card"><div class="card-h"><h3>Lead source performance</h3></div><div class="tw"><table><thead><tr><th>Source</th><th class="num">Leads</th><th class="num">Quoted</th><th class="num">Won</th><th class="num">Lost</th><th class="num">Win %</th><th class="num">Won value</th></tr></thead><tbody>
    ${bySource.map(x => `<tr><td><b>${esc(x.s)}</b></td><td class="num">${x.n}</td><td class="num">${x.quoted}</td><td class="num">${x.won}</td><td class="num">${x.lost}</td><td class="num">${pct(x.won, x.won + x.lost)}</td><td class="num">${inr(x.val, 0)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No leads in this year.</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>Monthly quotation value</h3><span class="hint">quoted vs accepted</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:7px">
    ${mq.map(x => `<div style="display:grid;grid-template-columns:70px 1fr 150px;gap:10px;align-items:center;font-size:12.5px"><span class="mono">${x.m}</span><div style="position:relative;height:18px;background:var(--panel2);border-radius:4px;overflow:hidden"><i style="position:absolute;inset:0 auto 0 0;width:${x.quoted / mx * 100}%;background:#C9CFD9"></i><i style="position:absolute;inset:0 auto 0 0;width:${x.won / mx * 100}%;background:var(--ok)"></i></div><span class="mono">${inrK(x.quoted)} / ${inrK(x.won)}</span></div>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h3>By owner</h3></div><div class="tw"><table><thead><tr><th>Owner</th><th class="num">Leads</th><th class="num">Won</th><th class="num">Won value</th></tr></thead><tbody>${owners.map(x => `<tr><td>${esc(x.o.split('@')[0])}</td><td class="num">${x.n}</td><td class="num">${x.won}</td><td class="num">${inr(x.val, 0)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">—</td></tr>'}</tbody></table></div></div>`;
  $('#rfy').onchange = e => { RFY = e.target.value; viewReports(); };
}

    ${fld('Freight GST %', `<input id="s_fgst" type="number" step="0.1" value="${SET.freightGst}">`)}${fld('Follow up unanswered quotes after (days)', `<input id="s_fu" type="number" value="${SET.followUpDays}">`)}
    ${fld('Payment terms', `<input id="s_pay" value="${esc(SET.paymentTerms)}">`, {cls:'full'})}${fld('Delivery terms', `<input id="s_del" value="${esc(SET.deliveryTerms)}">`, {cls:'full'})}
    ${fld('Terms & conditions (one per line)', `<textarea id="s_terms" style="min-height:140px">${esc(SET.terms.join('\n'))}</textarea>`, {cls:'full'})}</div></div></div>
  <div class="card"><div class="card-h"><h3>Approvals & team</h3></div><div class="card-b"><div class="form" style="grid-template-columns:1fr">
    ${fld('Admin emails (can approve quotations & change settings)', `<textarea id="s_admins" placeholder="one email per line">${esc(SET.admins.join('\n'))}</textarea>`)}
    ${fld('Auto-approve quotes up to (₹) — 0 means every quote needs approval', `<input id="s_limit" type="number" min="0" value="${SET.approvalLimit}">`)}
    ${fld('Daily digest email (8 AM follow-ups)', `<input id="s_digest" type="email" value="${esc(SET.digestTo)}" placeholder="you@company.com">`)}</div>
    <div class="note" style="margin-top:12px">Give each salesperson their own login (Firebase Console → Authentication → Add user). The role is decided by the email used to sign in.</div></div></div></div>
  <div class="card"><div class="card-h"><h3>Email & lead backend</h3><div class="sp"><button class="btn sm" data-act="testBackend">Test connection</button></div></div><div class="card-b"><div class="form">
    ${fld('Web app URL (Apps Script /exec)', `<input id="s_url" value="${esc(SET.scriptUrl)}" placeholder="https://script.google.com/macros/s/…/exec">`, {cls:'full'})}
    ${fld('Backend key', `<input id="s_key" type="password" value="${esc(SET.scriptKey)}" autocomplete="off">`)}${fld('Website form key', `<input id="s_wkey" value="${esc(SET.webformKey)}">`)}</div></div></div>
  <div class="card"><div class="card-h"><h3>Setup guide — connect Gmail, IndiaMART and your website (10 minutes, once)</h3></div><div class="card-b" style="line-height:1.7">
    <ol style="margin:0;padding-left:20px">
      <li>Open <b>script.new</b> signed in as the sales Gmail, name the project <i>Jayco Lead Intake</i>, and paste the whole of <code>lead-intake.gs</code> from this repository.</li>
      <li>Select the function <b>setup</b> and press Run. Approve the permissions. Open <b>Execution log</b> and copy the <b>KEY</b> and the <b>WEBSITE FORM KEY</b>.</li>
      <li><b>Deploy → New deployment → Web app</b>. Execute as <b>Me</b>, who has access: <b>Anyone</b>. Copy the <b>/exec URL</b>.</li>
      <li>Paste the URL, key and website form key above, press <b>Save all settings</b>, then <b>Test connection</b>.</li>
      <li>In Gmail: <b>Settings → Filters</b> — create a filter for your sales address (e.g. <i>to:sales@…</i>) that applies the label <b>JAYCO-Enquiry</b>. Emails from IndiaMART / TradeIndia are picked up automatically.</li>
      <li>Every 10 minutes the script captures new enquiries. The portal pulls them whenever it is open (and on <b>Sync emails</b>). Staff can also forward an enquiry to the sales address — the original sender is detected.</li>
      <li><b>Website enquiry form</b>: paste this on <i>jaycohousing.com</i>:<pre style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;margin:8px 0">${esc(snippet)}</pre></li>
      <li><b>Security (recommended)</b>: in Firebase Console → Firestore → Rules, allow the <code>crm_*</code> collections only for signed-in users.</li>
    </ol></div></div>`;
  if(!a) $$('#view input, #view textarea, #view select').forEach(x => x.disabled = true);
}
ACT.saveSettings = async () => {
  const g = id => $('#' + id).value.trim(), list = id => g(id).split(/\n+/).map(x => x.trim()).filter(Boolean);
  const data = {company: {name: g('s_name'), tagline: g('s_tag'), addr1: g('s_a1'), addr2: g('s_a2'), addr3: g('s_a3'), gstin: g('s_gstin'), pan: g('s_pan'), state: g('s_state'), phone: g('s_phone'), email: g('s_email'), web: g('s_web'), bank: ''},
    validityDays: num(g('s_valid')) || 30, defaultGst: num(g('s_gst')), freightGst: num(g('s_fgst')), followUpDays: num(g('s_fu')) || 7, paymentTerms: g('s_pay'), deliveryTerms: g('s_del'), terms: list('s_terms'),
    admins: list('s_admins').map(x => x.toLowerCase()), approvalLimit: num(g('s_limit')), digestTo: g('s_digest'), scriptUrl: g('s_url'), scriptKey: g('s_key'), webformKey: g('s_wkey')};
  if(data.admins.length && !data.admins.includes((me() || '').toLowerCase()) && !confirm('You are not in the admin list — you will lose admin access after saving. Continue?')) return;
  await DB.set('crm_settings', 'main', data); SET = {...DEFAULT_SETTINGS, ...data, company: {...DEFAULT_SETTINGS.company, ...data.company}, terms: data.terms.length ? data.terms : DEFAULT_TERMS};
  toast('Settings saved'); const r = $('#roleTag'); r.textContent = isAdmin() ? 'admin' : 'sales'; r.className = 'role ' + (isAdmin() ? 'admin' : ''); viewSettings();
};
ACT.testBackend = async () => {
  const url = $('#s_url').value.trim(); if(!url){ toast('Enter the Web app URL first', 'warn'); return; }
  try{ const j = await (await fetch(url + '?action=ping')).json(); if(j.ok) toast('Backend is live ✔', 'ok'); else throw new Error(j.error); }
  catch(e){ toast('Backend not reachable: ' + e.message, 'err'); }
};

boot();
