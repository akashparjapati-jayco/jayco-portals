<script>

    var root = document.getElementById('root');

        '\n\nThis usually means a script did not load (check your internet connection) or one of the CDN links is blocked.\nOpen DevTools (F12) > Console tab for full details.</div>';

</script>

// ============================================================
// Shared-password gate. NOT real security — the password lives
// in this file's source, so a technical visitor could read it.
// It just keeps casual/accidental access out. For real access
// control, switch to Firebase Authentication instead.
// ============================================================
const BOARD_PASSWORD = "P@2026";
const UNLOCK_KEY = "jaycoDispatchBoardUnlocked";

function Gate({ children }) {
  const [unlocked, setUnlocked] = useState(() => {
    try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; }
  });
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(false);

  if (unlocked) return children;

  const tryUnlock = () => {
    if (pw === BOARD_PASSWORD) {
      try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
      setUnlocked(true);
    } else {
      setErr(true);
    }
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)", fontFamily:"'Inter','Helvetica Neue',Arial,sans-serif" }}>
      <div style={{ background:"var(--panel)", border:"1px solid var(--line)", padding:"32px", width:"320px", boxShadow:"0 4px 14px rgba(16,24,40,0.08)" }}>
        <div style={{ fontWeight:800, fontSize:"18px", marginBottom:"6px", color:"var(--text)" }}>JAYCO Dispatch Board</div>
        <div style={{ fontSize:"13px", color:"var(--text-dim)", marginBottom:"18px" }}>Enter password to continue</div>
        <input
          type="password"
          autoFocus
          value={pw}
          onChange={e => { setPw(e.target.value); setErr(false); }}
          onKeyDown={e => { if (e.key === "Enter") tryUnlock(); }}
          placeholder="Password"
          style={{ width:"100%", padding:"10px 12px", border:`1px solid ${err ? "#dc2626" : "var(--line)"}`, marginBottom:"10px", fontSize:"14px", boxSizing:"border-box" }}
        />
        {err && <div style={{ color:"#dc2626", fontSize:"12px", marginBottom:"10px" }}>Incorrect password.</div>}
        <button onClick={tryUnlock} style={{ width:"100%", padding:"10px", background:"var(--red)", color:"#fff", border:"none", fontWeight:600, fontSize:"14px", cursor:"pointer" }}>
          Unlock
        </button>
      </div>
    </div>
  );
}

    const unsub = DOC_REF().onSnapshot(
      (snap) => {
        if (snap.exists) {
          setData(snap.data());
        } else {
          DOC_REF().set(SEED).catch(() => {});
          setData(SEED);
        }
        setConnMode("live");
      },
      (err) => {

        setData((prev) => prev || SEED);
      }
    );
    return () => unsub();
  }, []);

    let nextStock = baseStock;
    items.forEach(row => {
      if (row.paintType !== "New Paint") return;
      const idx = nextStock.findIndex(s => s.item.trim().toLowerCase() === row.item.trim().toLowerCase());
      if (idx >= 0) {
        nextStock = nextStock.map((s, i) => i === idx ? { ...s, qty: s.qty + row.qty } : s);
      } else {
        nextStock = [{ id:uid(), category:"Plummer Block", item:row.item, qty:row.qty, unit:"Nos", location:"", reorder:0 }, ...nextStock];
      }
    });
    return nextStock;
  };

  const reverseStockForItems = (items, baseStock) => {
    let nextStock = baseStock;
    items.forEach(row => {
      if (row.paintType !== "New Paint") return;
      const idx = nextStock.findIndex(s => s.item.trim().toLowerCase() === row.item.trim().toLowerCase());
      if (idx >= 0) {
        nextStock = nextStock.map((s, i) => i === idx ? { ...s, qty: Math.max(0, s.qty - row.qty) } : s);
      }
    });
    return nextStock;
  };

  const exportToExcel = () => {

  const importStockExcel = (file) => {

    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "binary" });
        const sheetName = wb.SheetNames.find(n => /stock/i.test(n)) || wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
        const newStock = rows.map(r => ({
          id: uid(),
          category: String(r["Category"] ?? "").trim() || "Plummer Block",
          item: String(r["Item"] ?? "").trim(),
          qty: Number(r["Qty"] ?? 0),
          unit: String(r["Unit"] ?? "Nos").trim() || "Nos",
          location: String(r["Location"] ?? "").trim(),
          reorder: Number(r["Reorder @"] ?? 0),
        })).filter(r => r.item);
        if (newStock.length === 0) {
          setImportMsg("No valid rows found — check columns: Category, Item, Qty, Unit, Location, Reorder @");
          return;
        }
        persist({ ...data, stock: [...newStock, ...stock] });
        setImportMsg(`Imported ${newStock.length} stock row${newStock.length === 1 ? "" : "s"}.`);
        setTimeout(() => setImportMsg(""), 4000);
      } catch (e) {
        setImportMsg("Import failed — make sure this is a valid .xlsx file.");
        console.error(e);
      }
    };
    reader.readAsBinaryString(file);
  };

  const computeSlipTotals = (items) => {

    const totalBoxes = items.filter(r => r.packingStyle === "Corrugated Box" || r.packingStyle === "Wooden Box").reduce((a, r) => a + Number(r.boxQty || 0), 0);
    const totalGunny = items.filter(r => r.packingStyle === "Gunny Bag").reduce((a, r) => a + Number(r.gunnyQty || 0), 0);
    return { totalQty, totalBoxes, totalGunny };
  };

  const saveDispatchSlip = () => {

    const totals = computeSlipTotals(dispatchDraft.items);
    const slip = { id:uid(), date:dispatchDraft.date || today(), invoiceNo:dispatchDraft.invoiceNo, transportName:dispatchDraft.transportName,
      lrNo:dispatchDraft.lrNo, driverName:dispatchDraft.driverName, dest:dispatchDraft.dest, items:dispatchDraft.items, ...totals };
    persist({ ...data, dispatchSlips: [slip, ...dispatchSlips] });

    setDispatchRowForm({ item:"", qty:"", packingStyle:"Corrugated Box", boxSize:DEFAULT_CORRUGATED_BOX_SIZES[0], boxQty:"" });
  };

  const generateDispatchPdf = (slip) => {
    const doc = new jspdf.jsPDF();
    const pageW = 210;
    const marginX = 12;
    const contentW = pageW - marginX * 2;
    const red = [196, 30, 42];
    const grayLine = [200, 200, 200];
    const darkText = [30, 30, 30];
    const dimText = [110, 110, 110];
    let y = 12;

    // ---- Header band with logo + company info ----
    try { doc.addImage("data:image/jpeg;base64," + COMPANY_LOGO_B64, "JPEG", marginX, y, 42, 8); } catch (e) {}
    doc.setFontSize(15);
    doc.setFont(undefined, "bold");
    doc.setTextColor(...darkText);
    doc.text("PACKING / DISPATCH SLIP", pageW - marginX, y + 6, { align: "right" });
    y += 14;

    doc.setDrawColor(...red);
    doc.setLineWidth(0.8);
    doc.line(marginX, y, pageW - marginX, y);
    y += 5;

    doc.setFont(undefined, "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(...dimText);
    doc.text("JAYCO Engineering India | Plot 18-20, Dharti Industrial Park, Ahmedabad-Indore Highway,", marginX, y);
    y += 4;
    doc.text("PO Mirjapur, Dist. Kheda, Gujarat 387610", marginX, y);
    y += 4;
    doc.text("Email: office@jaycohousing.com / info@jaycohousing.com", marginX, y);
    y += 8;

    // ---- Slip header info grid ----
    const headerFields = [
      ["Invoice No", slip.invoiceNo || "—"], ["Date", fmtDate(slip.date)],
      ["Transport Name", slip.transportName || "—"], ["LR No", slip.lrNo || "—"],
      ["Driver Name", slip.driverName || "—"], ["Destination", slip.dest || "—"],
    ];
    const colW = contentW / 2;
    const rowH = 7;
    doc.setDrawColor(...grayLine);
    doc.setLineWidth(0.2);
    doc.rect(marginX, y, contentW, rowH * 3);
    doc.line(marginX + colW, y, marginX + colW, y + rowH * 3);
    for (let i = 1; i < 3; i++) doc.line(marginX, y + rowH * i, marginX + contentW, y + rowH * i);
    headerFields.forEach((f, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const cx = marginX + col * colW + 3;
      const cy = y + row * rowH + 4.8;
      doc.setFont(undefined, "bold"); doc.setFontSize(8); doc.setTextColor(...dimText);
      doc.text(f[0] + ":", cx, cy);
      doc.setFont(undefined, "normal"); doc.setTextColor(...darkText);
      doc.text(String(f[1]), cx + doc.getTextWidth(f[0] + ":  "), cy);
    });
    y += rowH * 3 + 8;

    // ---- Items table ----
    const cols = [
      { label: "Item", w: 0.32 }, { label: "Qty", w: 0.12 }, { label: "Packing Style", w: 0.20 },
      { label: "Box Size", w: 0.24 }, { label: "Box/Bag Qty", w: 0.12 },
    ];
    const colWidths = cols.map(c => c.w * contentW);
    const colX = [marginX];
    colWidths.forEach(w => colX.push(colX[colX.length - 1] + w));

    const headH = 8;
    doc.setFillColor(...red);
    doc.rect(marginX, y, contentW, headH, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont(undefined, "bold");
    doc.setFontSize(8.5);
    cols.forEach((c, i) => doc.text(c.label, colX[i] + 2, y + 5.5));
    y += headH;

    const bodyRowH = 7;
    doc.setFont(undefined, "normal");
    doc.setFontSize(8.5);
    slip.items.forEach((row, idx) => {
      if (y + bodyRowH > 275) {
        doc.addPage();
        y = 16;
        doc.setFillColor(...red);
        doc.rect(marginX, y, contentW, headH, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont(undefined, "bold");
        cols.forEach((c, i) => doc.text(c.label, colX[i] + 2, y + 5.5));
        doc.setFont(undefined, "normal");
        y += headH;
      }
      if (idx % 2 === 1) { doc.setFillColor(246, 246, 246); doc.rect(marginX, y, contentW, bodyRowH, "F"); }
      doc.setTextColor(...darkText);
      const values = [String(row.item), String(row.qty), String(row.packingStyle), String(row.boxSize || "—"), String(row.boxQty || row.gunnyQty || "—")];
      values.forEach((v, i) => doc.text(v, colX[i] + 2, y + 4.8));
      y += bodyRowH;
    });

    doc.setDrawColor(...grayLine);
    doc.rect(marginX, y - slip.items.length * bodyRowH - headH, contentW, slip.items.length * bodyRowH + headH);
    colX.slice(1, -1).forEach(x => doc.line(x, y - slip.items.length * bodyRowH - headH, x, y));
    for (let i = 0; i <= slip.items.length; i++) {
      doc.line(marginX, y - i * bodyRowH, marginX + contentW, y - i * bodyRowH);
    }
    y += 8;

    // ---- Totals box ----
    const totalsW = 70;
    const totalsX = pageW - marginX - totalsW;
    doc.setDrawColor(...red);
    doc.setLineWidth(0.4);
    doc.rect(totalsX, y, totalsW, 20);
    doc.setFontSize(8.5);
    doc.setFont(undefined, "bold");
    doc.setTextColor(...darkText);
    doc.text(`Total Qty:`, totalsX + 3, y + 6);
    doc.text(`Total Boxes:`, totalsX + 3, y + 12);
    doc.text(`Total Gunny Bags:`, totalsX + 3, y + 18);
    doc.setFont(undefined, "normal");
    doc.text(String(slip.totalQty), totalsX + totalsW - 5, y + 6, { align: "right" });
    doc.text(String(slip.totalBoxes), totalsX + totalsW - 5, y + 12, { align: "right" });
    doc.text(String(slip.totalGunny), totalsX + totalsW - 5, y + 18, { align: "right" });
    y += 34;

    // ---- Signature footer ----
    if (y > 260) { doc.addPage(); y = 240; }
    else y = Math.max(y, 250);
    doc.setDrawColor(...grayLine);
    doc.setLineWidth(0.2);
    doc.line(marginX, y, marginX + 60, y);
    doc.line(pageW - marginX - 60, y, pageW - marginX, y);
    doc.setFontSize(8);
    doc.setTextColor(...dimText);
    doc.text("Driver Signature", marginX, y + 5);
    doc.text("Authorized Signatory — JAYCO Engineering India", pageW - marginX - 60, y + 5);

    doc.save(`dispatch-slip-${slip.invoiceNo || slip.id}.pdf`);

            <input ref={dispatchItemRef} placeholder="Item / SKU" value={dispatchRowForm.item} onChange={e => setDispatchRowForm({...dispatchRowForm, item:e.target.value})} onKeyDown={e => { if (e.key === "Enter") addDispatchRow(); }} style={inputStyle} list="dispatch-item-options" />
            <datalist id="dispatch-item-options">
              {[...PLUMMER_SERIES, ...PILLOW_BLOCKS, ...ADAPTER_SLEEVES, ...LOCATING_RINGS, ...BEARINGS, ...SEAL_TYPES].map(o => <option key={o} value={o} />)}
            </datalist>
            <input placeholder="Qty" type="number" value={dispatchRowForm.qty} onChange={e => setDispatchRowForm({...dispatchRowForm, qty:e.target.value})} onKeyDown={e => { if (e.key === "Enter") addDispatchRow(); }} style={inputStyle} />
            <select value={dispatchRowForm.packingStyle} onChange={e => setDispatchRowForm({...dispatchRowForm, packingStyle:e.target.value, boxSize: e.target.value === "Corrugated Box" ? masters.corrugatedBoxSizes[0] : e.target.value === "Wooden Box" ? masters.woodenBoxSizes[0] : ""})} style={inputStyle}>
              <option>Corrugated Box</option>
              <option>Wooden Box</option>
              <option>Loose</option>
              <option>Gunny Bag</option>
            </select>
            {(dispatchRowForm.packingStyle === "Corrugated Box" || dispatchRowForm.packingStyle === "Wooden Box") ? (
              <select value={dispatchRowForm.boxSize} onChange={e => setDispatchRowForm({...dispatchRowForm, boxSize:e.target.value})} style={inputStyle}>
                {(dispatchRowForm.packingStyle === "Corrugated Box" ? masters.corrugatedBoxSizes : masters.woodenBoxSizes).map(s => <option key={s}>{s}</option>)}
              </select>
            ) : <div />}
            {(dispatchRowForm.packingStyle === "Corrugated Box" || dispatchRowForm.packingStyle === "Wooden Box" || dispatchRowForm.packingStyle === "Gunny Bag") ? (
              <input placeholder={dispatchRowForm.packingStyle === "Gunny Bag" ? "Bag Qty" : "Box Qty"} type="number" value={dispatchRowForm.boxQty} onChange={e => setDispatchRowForm({...dispatchRowForm, boxQty:e.target.value})} onKeyDown={e => { if (e.key === "Enter") addDispatchRow(); }} style={inputStyle} />
            ) : <div />}
            <button onClick={addDispatchRow} style={btnPrimary}>+ Row</button>
          </div>

          {dispatchDraft.items.length > 0 && <div style={{marginBottom:"12px"}}>
            <TableBlock headers={["Item","Qty","Packing","Box Size","Box/Bag Qty",""]} emptyText=""
              rows={dispatchDraft.items.map(row => [
                row.item, row.qty, row.packingStyle, row.boxSize || "—", row.boxQty || row.gunnyQty || "—",
                <button className="row-btn" onClick={() => removeDispatchRow(row.id)} style={iconBtn}>✕</button>,
              ])} />
          </div>}

          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button onClick={saveDispatchSlip} style={{...btnPrimary, opacity: dispatchDraft.items.length ? 1 : 0.5}} disabled={!dispatchDraft.items.length}>
              Save Dispatch Slip ({dispatchDraft.items.length} item{dispatchDraft.items.length === 1 ? "" : "s"})
            </button>
          </div>
        </div>

        {dispatchSlips.map(d => (
          <div key={d.id} style={{background:"var(--panel)",border:"1px solid var(--line)",padding:"16px",marginBottom:"14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
              <div>
                <div style={{fontWeight:700,fontSize:"14px"}}>{d.invoiceNo || "—"} <span style={{fontWeight:400,color:"var(--text-dim)",fontSize:"12px"}}>· {fmtDate(d.date)}</span></div>
                <div className="mono" style={{fontSize:"11px",color:"var(--text-dim)",marginTop:"2px"}}>
                  {d.transportName || "—"} · LR {d.lrNo || "—"} · Driver {d.driverName || "—"} {d.dest && <>· → {d.dest}</>}
                </div>
              </div>
              <div style={{display:"flex",gap:"8px"}}>
                <button className="row-btn" onClick={() => generateDispatchPdf(d)} style={{...iconBtn,fontWeight:600}}>⭳ PDF for WhatsApp</button>
                <button className="row-btn" onClick={() => delDispatchSlip(d.id)} style={iconBtn}>✕ Delete Slip</button>
              </div>
            </div>
            <TableBlock headers={["Item","Qty","Packing","Box Size","Box/Bag Qty"]} emptyText="No items."
              rows={d.items.map(row => [row.item, row.qty, row.packingStyle, row.boxSize || "—", row.boxQty || row.gunnyQty || "—"])} />
            <div style={{display:"flex",gap:"20px",marginTop:"10px",fontSize:"12px"}}>
              <span><span style={{color:"var(--text-dim)"}}>Total Qty:</span> <strong>{d.totalQty}</strong></span>
              <span><span style={{color:"var(--text-dim)"}}>Total Boxes:</span> <strong>{d.totalBoxes}</strong></span>
              <span><span style={{color:"var(--text-dim)"}}>Total Gunny Bags:</span> <strong>{d.totalGunny}</strong></span>
            </div>
          </div>
        ))}
      </div>}

      {tab === "boxes" && <div>
        <div style={{background:"var(--panel)",border:"1px solid var(--line)",padding:"16px",marginBottom:"20px"}}>
          <div style={{fontWeight:600,fontSize:"13px",marginBottom:"12px",letterSpacing:"0.5px"}}>Log Box Movement</div>
          <div style={{display:"grid",gridTemplateColumns:"0.9fr 0.9fr 1.2fr 1.3fr 0.7fr 1.5fr auto",gap:"8px"}}>
            <input type="date" value={bForm.date} onChange={e => setBForm({...bForm, date:e.target.value})} style={inputStyle} />
            <select value={bForm.direction} onChange={e => setBForm({...bForm, direction:e.target.value})} style={inputStyle}>
              <option value="in">Inward</option><option value="out">Outward</option>
            </select>
            <select value={bForm.type} onChange={e => setBForm({...bForm, type:e.target.value, size:BOX_TYPES.find(b=>b.type===e.target.value).sizes[0]})} style={inputStyle}>
              {BOX_TYPES.map(b => <option key={b.type}>{b.type}</option>)}
            </select>
            <select value={bForm.size} onChange={e => setBForm({...bForm, size:e.target.value})} style={inputStyle}>
              {BOX_TYPES.find(b=>b.type===bForm.type).sizes.map(s => <option key={s}>{s}</option>)}
            </select>
            <input placeholder="Qty" type="number" value={bForm.qty} onChange={e => setBForm({...bForm, qty:e.target.value})} style={inputStyle} />
            <input placeholder={bForm.direction==="in" ? "Supplier" : "Dispatch / Order ref"} value={bForm.party} onChange={e => setBForm({...bForm, party:e.target.value})} style={inputStyle} />
            <button onClick={addBox} style={btnPrimary}>+</button>
          </div>
        </div>
        <TableBlock headers={["Date","Direction","Box Type","Size","Qty","Party / Ref",""]} emptyText="No box movement recorded."
          rows={boxLog.map(b => [
            fmtDate(b.date),
            <span style={{color: b.direction==="in"?"var(--green)":"var(--yellow)"}}>{b.direction==="in" ? "↓ Inward" : "↑ Outward"}</span>,
            b.type, b.size,
            <span className="mono">{b.qty}</span>,
            b.party || "—",
            <button className="row-btn" onClick={() => delBox(b.id)} style={iconBtn}>✕</button>,
          ])} />
      </div>}

      {tab === "masters" && <div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))",gap:"16px"}}>
          {Object.entries(MASTER_KEYS).map(([key, label]) => (
            <div key={key} style={{background:"var(--panel)",border:"1px solid var(--line)",padding:"16px"}}>
              <div style={{fontWeight:600,fontSize:"13px",marginBottom:"12px"}}>{label}</div>
              <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
                <input placeholder={`Add new ${label.toLowerCase()}`} value={masterForms[key]}
                  onChange={e => setMasterForms({ ...masterForms, [key]: e.target.value })}
                  onKeyDown={e => { if (e.key === "Enter") { addMasterItem(key, masterForms[key]); setMasterForms({ ...masterForms, [key]: "" }); } }}
                  style={inputStyle} />
                <button onClick={() => { addMasterItem(key, masterForms[key]); setMasterForms({ ...masterForms, [key]: "" }); }} style={btnPrimary}>+</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"6px",maxHeight:"260px",overflowY:"auto"}}>
                {masters[key].length === 0 && <div style={{fontSize:"12px",color:"var(--text-dim)"}}>No items yet.</div>}
                {masters[key].map(item => (
                  <div key={item} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"var(--bg)",border:"1px solid var(--line)",fontSize:"13px"}}>
                    <span>{item}</span>
                    <button className="row-btn" onClick={() => delMasterItem(key, item)} style={iconBtnSmall}>✕</button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>}
    </div>
    </div>
  </div>;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#101828;background:#f4f6f9;font-family:monospace;white-space:pre-wrap;min-height:100vh;">Dashboard failed to load.\n\nError: ' +
    (e && e.message ? e.message : e) +
    '\n\nOpen browser DevTools (F12) > Console tab for full details.</div>';
  console.error(e);
}
</script>
</body>
</html>
