<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAYCO Plummer Block Costing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F3;
  --ink:#111111; --ink-soft:#4B4B4B; --ink-faint:#93908C;
  --card:#ffffff; --card-border:rgba(17,17,17,0.08);
  --navy:#171717; --navy-deep:#000000; --navy-glow:rgba(0,0,0,0.28);
  --orange:#E5322D; --orange-deep:#9C1712; --orange-glow:rgba(229,50,45,0.38);
  --glass:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.7);
  --line:rgba(17,17,17,0.09);
  --ok:#1DAA5C; --warn:#B45309; --bad:#C0231E;
  --r-lg:22px; --r-md:14px; --r-sm:10px; --r-pill:100px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --mono:'Space Grotesk','Inter',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.panel-title,.val,.logo-box{font-family:var(--display)}
button,input,textarea,select{font:inherit}
a{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:266px;flex:0 0 266px;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-head{border-bottom:1px solid rgba(255,255,255,.1);padding:22px 20px;display:flex;align-items:center;gap:12px}
.brand-logo{height:26px;width:auto;display:block}
.sidebar-head .brand-logo{filter:brightness(1.12)}
.logo-box{width:40px;height:40px;border-radius:12px;background:var(--orange);display:grid;place-items:center;
  font-weight:700;font-size:19px;box-shadow:0 8px 20px -8px var(--orange-glow)}
.nav-ico{flex:0 0 auto;width:17px;height:17px;display:block}
.nav-ico svg{width:100%;height:100%;display:block}
.nav-btn > span:first-child{display:flex;align-items:center;gap:11px;min-width:0}
.nav-btn .nav-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-head p:first-of-type{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.2px;font-family:var(--display)}
.sidebar-head p:last-of-type{margin:2px 0 0;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 12px}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.32);padding:14px 10px 7px}
.nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;
  color:rgba(255,255,255,.72);padding:10px 12px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;
  border-radius:var(--r-sm);transition:background .2s,color .2s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:var(--orange);color:#fff;font-weight:600;box-shadow:0 10px 24px -12px var(--orange-glow)}
.nav-btn .count{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.5}
.nav-sep{height:1px;background:rgba(255,255,255,.09);margin:12px 10px}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.1);padding:18px 20px;font-size:11.5px;color:rgba(255,255,255,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-height:70px;
  background:rgba(246,245,243,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:0 26px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-size:14.5px;font-family:var(--display);letter-spacing:-.2px}
.topbar .title span{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px}
.content{padding:26px;max-width:1600px;width:100%;animation:rise .5s ease both}
.hamburger{display:none}

/* ---------- shared ---------- */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-faint);margin:0}
.page-head{margin-bottom:22px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  border:1px solid var(--card-border);border-radius:var(--r-lg);padding:26px 30px;
  box-shadow:0 1px 2px rgba(11,24,41,.04)}
.page-head h1{margin:10px 0 6px;font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.page-head p.desc{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.data-panel{overflow:hidden;border:1px solid var(--card-border);border-radius:var(--r-lg);background:var(--card);
  box-shadow:0 1px 2px rgba(11,24,41,.04);margin-bottom:22px}
.panel-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding:22px 26px}
.panel-title{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.4px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.metric-card{min-height:142px;border:1px solid var(--card-border);border-radius:var(--r-lg);padding:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  box-shadow:0 1px 2px rgba(11,24,41,.04);position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1)}
.metric-card:hover{transform:translateY(-4px);box-shadow:0 1px 2px rgba(11,24,41,.04),0 28px 54px -24px rgba(11,24,41,.18)}
.metric-card.dark{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff}
.metric-card.dark:hover{box-shadow:0 36px 70px -20px var(--navy-glow)}
.metric-card.red{border-color:transparent;background:linear-gradient(155deg,#F1544C 0%,var(--orange-deep) 100%);color:#fff}
.metric-card.red:hover{box-shadow:0 36px 70px -20px var(--orange-glow)}
.metric-card.dark::after,.metric-card.red::after{content:"";position:absolute;top:-40%;right:-20%;width:70%;height:70%;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);pointer-events:none}
.metric-card .lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:0}
.metric-card .val{margin:20px 0 0;font-size:30px;font-weight:700;letter-spacing:-1.2px}
.metric-card .note{margin:8px 0 0;font-size:12.5px;opacity:.62}
.two-col{display:grid;grid-template-columns:1.45fr .75fr;gap:22px}
.weight-total-card{border:1px solid var(--card-border);border-radius:var(--r-md);background:var(--card);padding:16px 18px}
.weight-total-card span{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint)}
.weight-total-card strong{display:block;margin-top:9px;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.5px}
.weight-total-card.actual{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%)}
.weight-total-card.actual span{color:rgba(255,255,255,.5)}
.weight-total-card.actual strong{color:#fff}
.weight-total-card.diff-up{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06)}
.weight-total-card.diff-up strong{color:var(--bad)}
.weight-total-card.diff-ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.07)}
.weight-total-card.diff-ok strong{color:var(--ok)}
.totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--card-border);background:var(--card);
  color:var(--ink);padding:9px 17px;border-radius:var(--r-pill);cursor:pointer;font-size:12.5px;font-weight:600;
  white-space:nowrap;transition:background .2s,box-shadow .25s,transform .25s}
.btn:hover{background:#fff;box-shadow:0 8px 20px -10px rgba(11,24,41,.3);transform:translateY(-1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--orange);border-color:var(--orange);box-shadow:0 10px 24px -8px var(--orange-glow)}
.btn.green{border-color:rgba(29,170,92,.35);color:var(--ok)}
.btn.green:hover{background:rgba(29,170,92,.07)}
.btn.icon{padding:8px 11px;font-size:13px;line-height:1;border-radius:var(--r-sm)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger{color:var(--bad);border-color:rgba(229,50,45,.28)}
.btn.danger:hover{background:rgba(229,50,45,.06)}
label.field{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;margin-top:8px;border:1px solid var(--card-border);border-radius:var(--r-sm);padding:10px 13px;
  background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(229,50,45,.14)}
textarea{min-height:80px;resize:vertical}
.search-wrap{position:relative;max-width:320px;width:100%}
.search-wrap input{margin-top:0;padding-left:34px;border-radius:var(--r-pill);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--glass-border)}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:16px}

/* ---------- tables ---------- */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:rgba(17,17,17,.025);text-align:left;font-weight:700;color:var(--ink-soft);padding:13px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:1.4px}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(17,17,17,.018)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.empty-row td{text-align:center;color:var(--ink-faint);padding:52px 16px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:var(--r-pill);padding:4px 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px}
.badge.ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.08);color:var(--ok)}
.badge.warn{border-color:rgba(180,83,9,.28);background:rgba(180,83,9,.07);color:var(--warn)}
.badge.bad{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06);color:var(--bad)}
.badge.neutral{border-color:var(--card-border);background:rgba(17,17,17,.035);color:var(--ink-soft)}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px;border-bottom:1px solid var(--line)}
.po-block{grid-column:1/-1;border:1px solid var(--card-border);background:rgba(17,17,17,.018);padding:20px;border-radius:var(--r-md)}
.po-row{display:grid;grid-template-columns:1fr 14rem auto;gap:14px;align-items:end;background:var(--card);
  border:1px solid var(--card-border);padding:16px;border-radius:var(--r-sm);margin-bottom:10px}
.form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);
  background:rgba(17,17,17,.018);padding:20px 26px}
.item-table-wrap{border:1px solid var(--card-border);border-radius:var(--r-md);overflow-x:auto}
.item-table input,.item-table select{margin-top:0;font-size:12.5px;padding:8px 10px}
.item-table td{vertical-align:top}
.progress{height:7px;background:rgba(17,17,17,.07);border-radius:var(--r-pill);overflow:hidden;margin-top:9px}
.progress > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--orange)}
.progress.dark > i{background:var(--ink)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;padding:32px 20px;z-index:60}
.modal-back.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:46rem;
  box-shadow:0 40px 90px -24px rgba(11,24,41,.4);animation:rise .3s ease both;
  display:flex;flex-direction:column;max-height:calc(100vh - 64px)}
.modal.wide{max-width:66rem}
.modal > form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-head{padding:28px 28px 8px;flex:0 0 auto}
.modal-head h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px}
.modal-head p{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.6}
.modal-body{padding:20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px;
  overflow-y:auto;flex:1 1 auto;min-height:0}
.modal-body.single{display:block}
.modal-body .full{grid-column:1/-1}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:18px 28px;
  border-top:1px solid var(--line);background:var(--card);flex:0 0 auto;
  border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ---------- attachments ---------- */
.attach-box{border:1px dashed var(--card-border);border-radius:var(--r-md);background:rgba(17,17,17,.02);
  height:132px;display:grid;place-items:center;overflow:hidden}
.attach-img{width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in}
.attach-empty{margin:0;font-size:12px;color:var(--ink-faint)}
.attach-file{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;padding:0 14px}
.attach-file i{font-style:normal;color:var(--orange)}
.attach-name{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:42px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--card-border);
  background:#fff;cursor:zoom-in;display:block}
.thumb-none{font-size:11px;color:var(--ink-faint)}
#lightbox{position:fixed;inset:0;background:rgba(17,17,17,.86);z-index:120;display:none;
  align-items:center;justify-content:center;padding:32px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-md);background:#fff}

/* ---------- toast ---------- */
#toasts{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--ink);
  box-shadow:0 20px 44px -18px rgba(11,24,41,.34);padding:14px 18px;font-size:13px;min-width:260px;max-width:370px;
  border-radius:var(--r-sm);animation:rise .3s ease both}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--ink)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);color:#fff;
  z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);color:var(--ink);width:100%;max-width:432px;border-radius:var(--r-lg);
  overflow:hidden;box-shadow:0 44px 100px -28px rgba(0,0,0,.6);animation:rise .4s ease both}
#gate .box-head{background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff;padding:24px;
  display:flex;align-items:center;gap:12px}
#gate .box-head .logo-box{width:38px;height:38px;font-size:17px}
#gate .box-head .brand-logo{height:24px}
#gate .box-head b{display:block;font-size:13.5px;letter-spacing:-.2px;font-family:var(--display)}
#gate .box-head span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
#gate .box-body{padding:28px}
#gate .box-body h2{margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-.5px}
#gate .box-body p.sub{margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);line-height:1.65}
#gate label.field{margin-bottom:16px;display:block}
#gate .err{background:rgba(229,50,45,.06);border:1px solid rgba(229,50,45,.24);border-radius:var(--r-sm);
  color:var(--bad);padding:13px 15px;font-size:13px;line-height:1.6;margin-bottom:18px;display:none}
#gate .err.show{display:block}
#gate ol{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.85;color:var(--ink-soft)}
#gate code{background:rgba(17,17,17,.05);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
.user-chip{font-size:11.5px;color:rgba(255,255,255,.7);word-break:break-all}

@media print{
  .sidebar, .topbar, .page-head, footer, #toasts, .modal-back, .btn, .search-wrap{display:none !important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .data-panel{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .metric-card{box-shadow:none;border:1px solid #ccc;background:#fff !important;color:#111 !important;min-height:0}
  .metric-card::after{display:none}
  thead th{background:#f2f2f2 !important}
}

/* ---------- responsive ---------- */
@media(max-width:1100px){.two-col{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}.totals-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:70}
  .sidebar.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.4)}
  .hamburger{display:inline-flex}
  .form-grid{grid-template-columns:1fr}
  .po-row{grid-template-columns:1fr}
  .modal-body{grid-template-columns:1fr}
  .topbar .title span{display:none}
  .content{padding:16px}
  .page-head{padding:20px 22px}
  .page-head h1{font-size:22px}
  .metric-card{padding:20px;min-height:126px}
  .metric-card .val{font-size:25px}
}

/* ---------- costing page ---------- */
.cost-layout{display:grid;grid-template-columns:1.35fr .85fr;gap:22px;align-items:start}
.cost-layout .data-panel{margin-bottom:0}
.form-grid.four{grid-template-columns:repeat(4,1fr)}
.form-grid .full{grid-column:1/-1}
.form-grid .span2{grid-column:span 2}
.section-label{grid-column:1/-1;margin:4px 0 -6px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint)}
.hint{display:block;margin-top:6px;font-size:11px;font-weight:500;color:var(--ink-faint)}
.hint.src{color:var(--warn)}
.suffix-wrap{position:relative;display:block}
.suffix-wrap input{padding-right:46px}
.suffix-wrap i{position:absolute;right:12px;bottom:11px;font-style:normal;font-size:11.5px;color:var(--ink-faint);font-weight:600}
.breakdown{position:sticky;top:90px}
.breakdown table td{padding:11px 22px;vertical-align:middle}
.breakdown table td:first-child{color:var(--ink-soft)}
.breakdown tr.sub td{font-weight:700;color:var(--ink);background:rgba(17,17,17,.025)}
.breakdown tr.sub td:first-child{color:var(--ink)}
.breakdown .muted{font-size:11px;color:var(--ink-faint);display:block;margin-top:2px}
.result-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 22px 22px}
.result-cards .metric-card{min-height:0;padding:18px 20px}
.result-cards .metric-card .val{margin-top:12px;font-size:24px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select{margin-top:0;width:auto;min-width:150px;border-radius:var(--r-pill);padding:8px 14px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.sel-price{font-weight:700;color:var(--ink)}
.price-table td.num,.price-table td.mono{white-space:nowrap}
.mode-local{color:var(--warn)}

/* ==========================================================================
   0. FIREBASE CONFIG  —  same shared JAYCO project as the other portals
   ========================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyAs7J_8awM76M6H6-4fuwYJ9BrpwS5iYPU",
  authDomain:        "jayco-dispatch-board.firebaseapp.com",
  projectId:         "jayco-dispatch-board",
  storageBucket:     "jayco-dispatch-board.firebasestorage.app",
  messagingSenderId: "3086329458",
  appId:             "1:3086329458:web:7862b6eab33fccae9844eb"
};
const FB_VER = '11.0.2';

/* Firestore collection names, prefixed so they never collide with the other tools. */
const FS_NAME = {
  entries:  'costing_plummer_blocks',   // one document per model / size
  settings: 'costing_settings'          // one document holding the default rates
};

/* ==========================================================================
   1. STORAGE ADAPTERS
   Firestore is used whenever it can be reached. If it cannot (no internet,
   file:/// address, Firebase blocked) the page still works and saves on this
   device only — the sidebar and page header say so clearly.
   ========================================================================== */
let fs = null, db = null;

function operatorName(){ try { return localStorage.getItem('jayco_operator') || ''; } catch { return ''; } }
function setOperatorName(v){ try { localStorage.setItem('jayco_operator', v); } catch {} }
const authUser = () => operatorName().trim() || 'Unnamed user';

const FirebaseAdapter = {
  name: 'Firebase Firestore', shared: true,
  async list(c){
    const snap = await fs.getDocs(fs.collection(db, FS_NAME[c]));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async create(c, data){
    const now = new Date().toISOString();
    const body = { ...data, createdAt: now, updatedAt: now, changedBy: authUser() };
    delete body.id;
    const ref = await fs.addDoc(fs.collection(db, FS_NAME[c]), body);
    return { ...body, id: ref.id };
  },
  async update(c, id, patch){
    const body = { ...patch, updatedAt: new Date().toISOString(), changedBy: authUser() };
    delete body.id;
    await fs.updateDoc(fs.doc(db, FS_NAME[c], id), body);
    return { ...body, id };
  },
  async remove(c, id){ await fs.deleteDoc(fs.doc(db, FS_NAME[c], id)); }
};

const LocalAdapter = {
  name: 'This device only', shared: false,
  key: c => 'jayco_' + FS_NAME[c],
  async list(c){ try { return JSON.parse(localStorage.getItem(this.key(c)) || '[]'); } catch { return []; } },
  async create(c, d){
    const rows = await this.list(c), now = new Date().toISOString();
    const row = { ...d, id: uid(), createdAt: now, updatedAt: now, changedBy: authUser() };
    rows.unshift(row); localStorage.setItem(this.key(c), JSON.stringify(rows)); return row;
  },
  async update(c, id, patch){
    const rows = await this.list(c);
    const i = rows.findIndex(r => String(r.id) === String(id));
    if(i < 0) throw new Error('Record not found.');
    rows[i] = { ...rows[i], ...patch, id: rows[i].id, updatedAt: new Date().toISOString(), changedBy: authUser() };
    localStorage.setItem(this.key(c), JSON.stringify(rows)); return rows[i];
  },
  async remove(c, id){
    const rows = (await this.list(c)).filter(r => String(r.id) !== String(id));
    localStorage.setItem(this.key(c), JSON.stringify(rows));
  }
};

/* ==========================================================================
   3. THE COSTING FORMULA  —  one place, used by the form, the list and Excel
   ------------------------------------------------------------------------
   Casting cost   = (cap kg + base kg) × rate per kg
   Direct cost    = casting + machining + painting + packing
   Overhead       = direct cost × overhead %
   Rejection      = (direct + overhead) × rejection %
   ACTUAL COST    = direct + overhead + rejection
   Margin         = actual cost × margin %
   SELLING PRICE  = actual cost + margin
   ========================================================================== */
function compute(f){
  const weight    = num(f.capWt) + num(f.baseWt);
  const casting   = weight * num(f.ratePerKg);
  const direct    = casting + num(f.machining) + num(f.painting) + num(f.packing);
  const overhead  = direct * num(f.overheadPct) / 100;
  const rejection = (direct + overhead) * num(f.rejectionPct) / 100;
  const actual    = direct + overhead + rejection;
  const margin    = actual * num(f.marginPct) / 100;
  const selling   = actual + margin;
  return { weight, casting, direct, overhead, rejection, actual, margin, selling };
}

async function loadAll(){
  const [entries, settingsRows] = await Promise.all([
    DB.list('entries').catch(e => { toast('Could not read saved costings: ' + e.message, 'error'); return []; }),
    DB.list('settings').catch(() => [])
  ]);
  state.entries = entries.sort((a, b) => String(a.series).localeCompare(String(b.series)) || String(a.model).localeCompare(String(b.model), 'en', { numeric: true }));
  state.settings = settingsRows[0] || null;
  if(!state.form) state.form = blankForm();
  render();
}

/* ==========================================================================
   6. RENDER
   ========================================================================== */
const view = document.getElementById('view');

function render(){
  const v = VIEWS[state.view];
  document.getElementById('pg-eyebrow').textContent = v.eyebrow;
  document.getElementById('pg-title').textContent = v.title;
  document.getElementById('pg-desc').textContent = v.desc;
  document.getElementById('top-title').textContent = v.title;
  document.getElementById('top-desc').textContent = DB.shared ? 'Shared with everyone at JAYCO' : 'Saved on this device only';
  document.getElementById('search-wrap').style.display = state.view === 'price-list' ? '' : 'none';
  document.getElementById('count-entries').textContent = state.entries.length || '';
  document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  if(state.view === 'calculator') renderCalculator();
  else if(state.view === 'price-list') renderList();
  else renderDefaults();
}

function field(label, name, val, opts = {}){
  const type = opts.type || 'number';
  const attrs = type === 'number' ? 'step="any" min="0" inputmode="decimal"' : '';
  const input = `<input type="${type}" name="${name}" value="${esc(val)}" ${attrs} ${opts.list ? `list="${opts.list}"` : ''} placeholder="${esc(opts.ph || '')}" ${opts.required ? 'required' : ''}>`;
  return `<label class="field ${opts.cls || ''}">${esc(label)}
    ${opts.suffix ? `<span class="suffix-wrap">${input}<i>${esc(opts.suffix)}</i></span>` : input}
    ${opts.hint ? `<span class="hint ${opts.hintCls || ''}" data-hint="${name}">${opts.hint}</span>` : ''}</label>`;
}

function renderBreakdown(){
  const f = state.form, c = compute(f);
  const editing = state.editingId ? state.entries.find(e => e.id === state.editingId) : null;
  const prev = editing ? num(editing.sellingPrice) : null;
  const delta = prev !== null && prev > 0 ? (c.selling - prev) / prev * 100 : null;
  const hist = editing && Array.isArray(editing.history) ? editing.history.slice(-5).reverse() : [];
  document.getElementById('breakdown').innerHTML = `
    <div class="panel-heading"><div><p class="eyebrow">Cost breakdown · per piece</p>
      <h2 class="panel-title">${esc(f.model || 'Unnamed model')}</h2></div></div>
    <table><tbody>
      <tr><td>Casting<span class="muted">${esc(kg(c.weight))} × ${money(f.ratePerKg)}/kg</span></td><td class="num">${money(c.casting)}</td></tr>
      <tr><td>Machining</td><td class="num">${money(f.machining)}</td></tr>
      <tr><td>Painting</td><td class="num">${money(f.painting)}</td></tr>
      <tr><td>Packing</td><td class="num">${money(f.packing)}</td></tr>
      <tr class="sub"><td>Direct cost</td><td class="num">${money(c.direct)}</td></tr>
      <tr><td>Overhead<span class="muted">${pct(f.overheadPct)} of direct cost</span></td><td class="num">${money(c.overhead)}</td></tr>
      <tr><td>Rejection allowance<span class="muted">${pct(f.rejectionPct)} of direct + overhead</span></td><td class="num">${money(c.rejection)}</td></tr>
      <tr class="sub"><td>Actual cost</td><td class="num">${money(c.actual)}</td></tr>
      <tr><td>Margin<span class="muted">${pct(f.marginPct)} of actual cost</span></td><td class="num">${money(c.margin)}</td></tr>
    </tbody></table>
    <div class="result-cards">
      <div class="metric-card dark"><p class="lbl">Actual cost</p><p class="val">${money(c.actual)}</p>
        <p class="note">${c.weight > 0 ? money(c.actual / c.weight) + ' per kg' : 'Enter casting weight'}</p></div>
      <div class="metric-card red"><p class="lbl">Selling price</p><p class="val">${money(c.selling)}</p>
        <p class="note">${delta === null ? 'Before GST' : (Math.abs(delta) < 0.005 ? 'Same as saved price' : (delta > 0 ? '▲ ' : '▼ ') + pct(Math.abs(delta)) + ' vs saved ' + money(prev))}</p></div>
    </div>
    ${hist.length ? `<p class="eyebrow" style="padding:4px 22px 10px">Earlier prices</p><ul class="history">${hist.map(h =>
      `<li><span>${esc(fmtStamp(h.at))} · ${esc(h.by || '')}</span><span class="mono">${money(h.sellingPrice)}</span></li>`).join('')}</ul>` : ''}`;
}

function bindCalculator(){
  const form = document.getElementById('cost-form');
  form.addEventListener('input', e => {
    const n = e.target.name; if(!n) return;
    state.form[n] = e.target.value;
    if(n === 'capWt' || n === 'baseWt') document.getElementById('total-wt').value = kg(num(state.form.capWt) + num(state.form.baseWt));
    if(n === 'model') { const ref = sheetRef(e.target.value), saved = findEntry(e.target.value);
      const h = form.querySelector('[data-hint="model"]');
      if(h) { h.textContent = saved && saved.id !== state.editingId ? 'Already saved — pick it to open the saved costing' : (ref ? `Weights available from costing sheet (${SHEET_DATE})` : ''); h.className = 'hint' + (ref || saved ? ' src' : ''); } }
    renderBreakdown();
  });
  form.addEventListener('change', e => {
    const n = e.target.name;
    if(n === 'material') { state.form.ratePerKg = settings().rates[e.target.value]; renderCalculator(); }
    else if(n === 'series') renderCalculator();
    else if(n === 'model' && normKey(e.target.value) !== state.lastPicked) pickModel(e.target.value);
  });
  form.addEventListener('submit', e => { e.preventDefault(); save(); });
  document.getElementById('btn-new').addEventListener('click', newCosting);
  document.getElementById('btn-reset').addEventListener('click', newCosting);
  const del = document.getElementById('btn-delete');
  if(del) del.addEventListener('click', () => confirmDelete(state.editingId));
}

/* Choosing a model opens its saved costing, or pre-fills from the sheet. */
function pickModel(model){
  state.lastPicked = normKey(model);
  const saved = findEntry(model);
  if(saved) { openEntry(saved.id); toast('Opened saved costing for ' + saved.model); return; }
  const ref = sheetRef(model);
  if(ref) {
    const f = state.form;
    f.series = ref.s; f.capWt = ref.t; f.baseWt = ref.b;
    if(ref.x) { f.material = ref.x; f.ratePerKg = settings().rates[ref.x]; }
    if(ref.mc !== undefined) { f.machining = ref.mc; f.painting = ref.pt; f.packing = ref.pk; }
    toast(`Weights for ${ref.m} filled from the ${SHEET_DATE} costing sheet`);
  }
  renderCalculator();
}

function newCosting(){ state.lastPicked = ''; state.editingId = null; state.form = blankForm(); renderCalculator(); }

function openEntry(id){
  const e = state.entries.find(x => x.id === id); if(!e) return;
  state.editingId = id; state.lastPicked = normKey(e.model);
  state.form = Object.fromEntries(FORM_FIELDS.map(k => [k, e[k] ?? '']));
  state.view = 'calculator'; render();
}

async function save(){
  const f = state.form;
  const model = String(f.model || '').trim();
  if(!model) { toast('Enter the model / size first.', 'error'); return; }
  if(num(f.capWt) + num(f.baseWt) <= 0) { toast('Enter the casting weight.', 'error'); return; }
  if(num(f.ratePerKg) <= 0) { toast('Enter the casting rate per kg.', 'error'); return; }
  const clash = findEntry(model);
  if(clash && clash.id !== state.editingId) { toast(model + ' is already saved. Open it from Saved costings to revise it.', 'error'); return; }

  const c = compute(f);
  const body = {};
  FORM_FIELDS.forEach(k => body[k] = ['series','model','material','remarks'].includes(k) ? String(f[k] ?? '').trim() : num(f[k]));
  Object.assign(body, { model, totalWt: Math.round(c.weight * 1000) / 1000, castingCost: r2(c.casting), directCost: r2(c.direct), overheadAmt: r2(c.overhead),
    rejectionAmt: r2(c.rejection), actualCost: r2(c.actual), marginAmt: r2(c.margin), sellingPrice: r2(c.selling) });

  state.saving = true; renderCalculator();
  try {
    if(state.editingId) {
      const old = state.entries.find(e => e.id === state.editingId);
      const history = Array.isArray(old.history) ? old.history.slice(-19) : [];
      if(r2(old.sellingPrice) !== body.sellingPrice || r2(old.actualCost) !== body.actualCost)
        history.push({ at: old.updatedAt || old.createdAt || '', by: old.changedBy || '', actualCost: old.actualCost, sellingPrice: old.sellingPrice });
      body.history = history;
      await DB.update('entries', state.editingId, body);
      toast('Updated ' + model, 'success');
    } else {
      body.history = [];
      const row = await DB.create('entries', body);
      state.editingId = row.id;
      toast('Saved ' + model, 'success');
    }
    const id = state.editingId;
    state.saving = false;
    await loadAll();
    openEntry(id);
  } catch(e) {
    state.saving = false; renderCalculator();
    toast('Could not save: ' + (e.code ? e.code + ' — ' : '') + e.message, 'error');
  }
}

function confirmDelete(id){
  const e = state.entries.find(x => x.id === id); if(!e) return;
  openModal(`<div class="modal-head"><h3>Delete ${esc(e.model)}?</h3><p>This removes the saved costing and its price history for everyone. It cannot be undone.</p></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="do-delete">Delete costing</button></div>`);
  document.getElementById('do-delete').addEventListener('click', async () => {
    try { await DB.remove('entries', id); closeModal(); toast('Deleted ' + e.model, 'success');
      if(state.editingId === id) { state.editingId = null; state.form = blankForm(); }
      await loadAll(); }
    catch(err) { toast('Could not delete: ' + err.message, 'error'); }
  });
}

function filteredEntries(){
  const q = normKey(state.search);
  return state.entries.filter(e => (state.seriesFilter === 'All' || e.series === state.seriesFilter) &&
    (!q || normKey(e.model).includes(q) || normKey(e.series).includes(q) || normKey(e.remarks).includes(q)));
}

        <td style="white-space:nowrap">${esc(fmtStamp(e.updatedAt))}<span class="hint">${esc(e.changedBy || '')}</span></td>
        <td><div class="row-actions"><button class="btn icon" data-open="${esc(e.id)}" title="Open">✎</button><button class="btn icon danger" data-del="${esc(e.id)}" title="Delete">✕</button></div></td>

  document.getElementById('series-filter').addEventListener('change', e => { state.seriesFilter = e.target.value; renderList(); });

function exportExcel(){
  if(!window.XLSX) { toast('Excel library did not load. Check the internet connection.', 'error'); return; }
  const data = filteredEntries().map(e => ({
    'Series': e.series, 'Model': e.model, 'Material': e.material,
    'Cap wt (kg)': num(e.capWt), 'Base wt (kg)': num(e.baseWt), 'Total wt (kg)': num(e.totalWt), 'Rate / kg': num(e.ratePerKg),
    'Casting cost': num(e.castingCost), 'Machining': num(e.machining), 'Painting': num(e.painting), 'Packing': num(e.packing),
    'Direct cost': num(e.directCost), 'Overhead %': num(e.overheadPct), 'Overhead': num(e.overheadAmt),
    'Rejection %': num(e.rejectionPct), 'Rejection': num(e.rejectionAmt), 'Actual cost': num(e.actualCost),
    'Margin %': num(e.marginPct), 'Margin': num(e.marginAmt), 'Selling price': num(e.sellingPrice),
    'Remarks': e.remarks || '', 'Revised on': fmtStamp(e.updatedAt), 'Revised by': e.changedBy || ''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = Object.keys(data[0]).map(k => ({ wch: Math.max(10, k.length + 2) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Plummer block costing');
  XLSX.writeFile(wb, `JAYCO-Plummer-Block-Costing-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function setMode(shared, why){
  DB = shared ? FirebaseAdapter : LocalAdapter;
  document.getElementById('storage-mode').innerHTML = shared ? '◆ Firebase Firestore' : '<span class="mode-local">◆ This device only</span>';
  document.getElementById('foot-mode').textContent = shared ? 'Shared · Firebase Firestore' : 'Offline · saved in this browser only' + (why ? ' (' + why + ')' : '');
  const st = document.getElementById('pg-status');
  st.className = 'badge ' + (shared ? 'ok' : 'warn');
  st.textContent = shared ? '● Live data' : '● Offline · this device only';
  st.title = why || '';
}

async function boot(){
  const gate = document.getElementById('gate');
  const fallback = async why => {
    setMode(false, why);
    gate.style.display = 'none';
    if(why) toast('Shared database unavailable (' + why + '). Costings will be saved on this device only.', 'error');
    await loadAll();
  };
  if(location.protocol === 'file:' || new URLSearchParams(location.search).has('local')) return fallback(location.protocol === 'file:' ? 'opened from a file' : '');
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appMod, fsMod, authMod] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')
    ]);
    fs = { collection: fsMod.collection, getDocs: fsMod.getDocs, addDoc: fsMod.addDoc, updateDoc: fsMod.updateDoc, deleteDoc: fsMod.deleteDoc, doc: fsMod.doc };
    const app = appMod.initializeApp(firebaseConfig);
    db = fsMod.getFirestore(app);
    const auth = authMod.getAuth(app);
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('sign-in timed out')), 12000);
      authMod.onAuthStateChanged(auth, u => { if(u) { clearTimeout(t); resolve(u); } });
      authMod.signInAnonymously(auth).catch(e => { clearTimeout(t); reject(e); });
    });
    setMode(true);
    gate.style.display = 'none';
    await loadAll();
  } catch(e) {
    await fallback(e.code || e.message || 'could not connect');
  }
}
boot();
</script>
</body>
</html>
