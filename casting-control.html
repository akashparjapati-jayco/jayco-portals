}

/* ==========================================================================
   7b. EXCEL IMPORT — Pattern Master
   ========================================================================== */
const XLS_COLUMNS = ['Pattern Name','Pattern Type','Pattern Material','Pattern Construction',
                     'Core Box','Number of Cores','Pattern Group','Total Sets'];

/* Spreadsheets are typed by hand, so match loosely: ignore case, spaces and
   common spellings, and fall back to a sensible default rather than refusing. */
function matchOption(value, options, fallback){
  const norm = t => String(t ?? '').trim().toLowerCase().replace(/[\s._-]+/g,'');
  const v = norm(value);
  if(!v) return {value: fallback, guessed: false};
  let hit = options.find(o => norm(o) === v);
  if(hit) return {value: hit, guessed: false};
  hit = options.find(o => norm(o).startsWith(v) || v.startsWith(norm(o)));
  if(hit) return {value: hit, guessed: false};
  /* "aluminum" vs "Aluminium" — compare a short prefix so spelling variants land */
  hit = options.find(o => norm(o).slice(0,5) === v.slice(0,5) && v.length > 3);
  if(hit) return {value: hit, guessed: false};
  return {value: fallback, guessed: true};   // supplied but not recognised
}

function normaliseCore(value){
  const v = String(value ?? '').trim().toLowerCase();
  if(!v) return 'Without core';
  if(v.startsWith('with') && !v.startsWith('without')) return 'With core box';
  if(v === 'yes' || v === 'y' || v === 'core' || v === 'true') return 'With core box';
  return 'Without core';
}

function downloadXlsTemplate(){
  try{
    const rows = [
      XLS_COLUMNS,
      ['SN 511','Cap','Aluminium','Split Type','Without core',0,'SN',1],
      ['SNH 520-617','Housing','Wooden','Non-Split Type','With core box',2,'SNH',2]
    ];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:16},{wch:18},{wch:20},{wch:16},{wch:16},{wch:16},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Patterns');
    XLSX.writeFile(wb, 'JAYCO-Pattern-Master-Template.xlsx');
    toast('Template downloaded. Keep the header row exactly as it is.','success');
  }catch(err){ toast('Could not build the template: ' + err.message,'error'); }
}

/* Parse the sheet, then show what WILL happen before anything is written. */
async function previewXlsImport(file){
  let rows;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, {defval:''});
  }catch(err){ return toast('That file could not be read: ' + err.message,'error'); }

  if(!rows.length) return toast('The first sheet has no rows under the header.','error');

  const key = patternKey;
  const existing = new Set(state.castingMasters.map(patternKey));
  const seen = new Set();
  const types = allTypes();

  const parsed = rows.map((raw, n) => {
    const pick = (...names) => {
      for(const nm of names){
        const hit = Object.keys(raw).find(k => k.trim().toLowerCase() === nm.toLowerCase());
        if(hit && String(raw[hit]).trim() !== '') return raw[hit];
      }
      return '';
    };
    const name = String(pick('Pattern Name','Name','Item','Casting Item Name')).trim();
    const warn = [];
    const take = (raw, options, fallback, fieldName) => {
      const r = matchOption(raw, options, fallback);
      if(r.guessed) warn.push(fieldName + ' "' + String(raw).trim() + '" not recognised');
      return r.value;
    };
    const rec = {
      row: n + 2,
      itemName: name,
      itemType: take(pick('Pattern Type','Type'), types, types[0], 'Type'),
      patternMaterial: take(pick('Pattern Material','Material'), PATTERN_MATERIALS, 'Wooden', 'Material'),
      patternConstruction: take(pick('Pattern Construction','Construction'), PATTERN_CONSTRUCTION, 'Split Type', 'Construction'),
      coreBox: normaliseCore(pick('Core Box','Core')),
      coreCount: num(pick('Number of Cores','Cores','Core Count')),
      patternGroup: String(pick('Pattern Group','Group')).trim(),
      totalSets: num(pick('Total Sets','Sets')) || 1
    };
    if(rec.coreBox === 'Without core') rec.coreCount = 0;
    else if(rec.coreCount < 1) rec.coreCount = 1;

    rec.warn = warn;
    if(!rec.itemName)            rec.skip = 'No pattern name';
    else if(existing.has(key(rec))) rec.skip = 'Already in Pattern Master';
    else if(seen.has(key(rec)))     rec.skip = 'Duplicated in this file';
    else seen.add(key(rec));
    return rec;
  });

  const ok = parsed.filter(r => !r.skip);
  const skipped = parsed.filter(r => r.skip);
  window.__xlsQueue = ok;

  openModal(`<div class="modal-head">
      <h3>Import ${ok.length} pattern${ok.length===1?'':'s'}</h3>
      <p>${parsed.length} row${parsed.length===1?'':'s'} read from <b>${esc(file.name)}</b>${skipped.length?` · ${skipped.length} skipped`:''}${ok.filter(r=>r.warn.length).length?` · ${ok.filter(r=>r.warn.length).length} need checking`:''}. Nothing is saved until you confirm.</p>
    </div>
    <div style="padding:0 28px;overflow-y:auto;flex:1 1 auto;min-height:0">
      <div class="table-scroll" style="border:1px solid var(--card-border);border-radius:var(--r-md)">
        <table><thead><tr><th>Row</th><th>Pattern name</th><th>Type</th><th>Material</th><th>Construction</th><th>Core</th><th class="num">Sets</th><th>Group</th><th>Result</th></tr></thead>
        <tbody>${ parsed.slice(0,200).map(r=>`<tr style="${r.skip?'opacity:.55':''}">
          <td class="mono">${r.row}</td><td><b>${esc(r.itemName)||'—'}</b></td><td>${esc(r.itemType)}</td>
          <td>${esc(r.patternMaterial)}</td><td>${esc(r.patternConstruction)}</td>
          <td>${r.coreBox==='With core box'?num(r.coreCount)+' cores':'No core'}</td>
          <td class="num">${num(r.totalSets)}</td><td>${esc(r.patternGroup)||'—'}</td>
          <td>${ r.skip ? `<span class="badge warn">${esc(r.skip)}</span>`
                 : (r.warn.length ? `<span class="badge warn">Check: ${esc(r.warn.join('; '))}</span>`
                                  : '<span class="badge ok">Will import</span>') }</td>
        </tr>`).join('') }</tbody></table>
      </div>
      ${ parsed.length > 200 ? `<p style="margin:12px 0 0;font-size:12px;color:var(--ink-faint)">Showing the first 200 rows. All ${ok.length} valid rows will be imported.</p>` : '' }
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="button" class="btn primary" id="btn-xls-confirm" ${ok.length?'':'disabled'}>Import ${ok.length} pattern${ok.length===1?'':'s'}</button>
    </div>`, true);
}

async function runXlsImport(){
  const queue = window.__xlsQueue || [];
  if(!queue.length) return;
  const btn = document.getElementById('btn-xls-confirm');
  btn.disabled = true;
  let done = 0, failed = 0;
  for(const r of queue){
    btn.textContent = 'Importing ' + (done + 1) + ' of ' + queue.length + '…';
    try{
      await DB.create('casting_masters', {
        createdBy: authUser(), createdOn: today(),
        itemName:r.itemName, itemType:r.itemType,
        patternMaterial:r.patternMaterial, patternConstruction:r.patternConstruction,
        coreBox:r.coreBox, coreCount:r.coreCount, totalSets:r.totalSets,
        patternGroup:r.patternGroup, drawingPdf:'', drawingPdfName:'', patternPhoto:'',
        material:'Cast Iron', status:'Active', averageWeight:0,
        itemCode:'CAST-' + Math.random().toString(36).slice(2,10).toUpperCase()
      });
      done++;
    }catch(err){ failed++; }
  }
  window.__xlsQueue = [];
  closeModal();
  toast(failed ? `Imported ${done}, ${failed} failed.` : `Imported ${done} pattern${done===1?'':'s'}.`, failed ? 'error' : 'success');
  await loadAll();
}

document.addEventListener('click', e => {
  if(e.target.closest('#btn-xls-template')) downloadXlsTemplate();
  if(e.target.closest('#btn-xls-import'))   document.getElementById('file-xls').click();
  if(e.target.closest('#btn-xls-confirm'))  runXlsImport();
});
document.getElementById('file-xls').addEventListener('change', async e => {
  const file = e.target.files[0];
  if(file) await previewXlsImport(file);
  e.target.value = '';
});

/* ==========================================================================
   8. BACKUP / SEED
   ========================================================================== */
/* Writes a throwaway record, reads it back, deletes it — and reports the exact
   Firestore error code at whichever step fails. */
document.getElementById('btn-selftest')?.addEventListener('click', async () => {
  const steps = [];
  let id = null;
  try{
    steps.push('Signed in: ' + (currentUser ? 'yes (' + currentUser.uid.slice(0,8) + '…)' : 'NO'));
    const made = await DB.create('casting_masters', {itemName:'__connection test__', itemType:'Cap',
      patternMaterial:'Wooden', patternConstruction:'Split Type', coreBox:'Without core', coreCount:0,
      totalSets:0, patternGroup:'', drawingPdf:'', drawingPdfName:'', patternPhoto:'',
      material:'Cast Iron', status:'Active', averageWeight:0, itemCode:'TEST'});
    id = made.id;
    steps.push('Write: OK');
    const back = await DB.list('casting_masters');
    steps.push('Read back: ' + (back.some(r=>r.id===id) ? 'OK, found it' : 'WROTE BUT CANNOT READ'));
    await DB.remove('casting_masters', id);
    steps.push('Cleanup: OK');
    alert('Connection test passed.\n\n' + steps.join('\n') +
      '\n\nSaving works. If a pattern still does not appear, tell Claude exactly what these lines say.');
  }catch(err){
    steps.push('FAILED: ' + (err.code ? err.code + ' — ' : '') + err.message);
    alert('Connection test FAILED.\n\n' + steps.join('\n') +
      '\n\nSend this text to Claude.');
    if(id){ try{ await DB.remove('casting_masters', id); }catch{} }
  }
  loadAll();
});

document.getElementById('btn-export')?.addEventListener('click', async () => {
  const dump = {};
  for(const c of COLLECTIONS) dump[c] = await DB.list(c);
  const blob = new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jayco-casting-backup-' + today() + '.json';
  a.click();
  toast('Backup downloaded','success');
});
document.getElementById('btn-import')?.addEventListener('click', () => {
  if(!confirm('This will WRITE every record from the backup file into Firestore as new documents. Continue?')) return;
  document.getElementById('file-import').click();
});
document.getElementById('file-import')?.addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const dump = JSON.parse(await file.text());
    let n = 0;
    for(const c of COLLECTIONS){
      for(const row of (dump[c]||[])){ const r = {...row}; delete r.id; await DB.create(c, r); n++; }
    }
    toast(n + ' records imported into Firestore','success'); loadAll();
  }catch(err){ toast('Import failed: ' + err.message,'error'); }
  e.target.value = '';
});
document.getElementById('btn-wipe')?.addEventListener('click', async () => {
  if(!confirm('Delete ALL casting records from Firestore? This cannot be undone.')) return;
  if(prompt('Type DELETE to confirm.') !== 'DELETE') return toast('Cancelled','info');
  try{
    for(const c of COLLECTIONS){ for(const r of await DB.list(c)) await DB.remove(c, r.id); }
    toast('All casting data deleted','success'); loadAll();
  }catch(err){ toast('Delete failed: ' + err.message,'error'); }
});

  await DB.create('control_records', {module:'patterns', reference:'PTN-SNH-520', item:'SNH 520-617 housing pattern', foundry:'Bharat Steel Foundry', quantity:2, received:1, dueDate:today(), status:'At foundry', notes:'One set sent for trial casting', changedBy: authUser()});
  const demoItems = [

    {itemName:saved[1].itemName, itemType:saved[1].itemType, material:saved[1].material, quantity:50, foundryWeight:640, actualWeight:651.2, foundryTotalWeight:640, actualTotalWeight:651.2}
  ];
  await DB.create('casting_challans', {
    challanNumber:'BSF/CH/1024', challanDate:today(), foundryName:'Bharat Steel Foundry',
    purchaseOrders:[{purchaseOrderNumber:'JAY/PO/2026/118', purchaseOrderDate:today()}],
    purchaseOrderNumber:'JAY/PO/2026/118', purchaseOrderDate:today(), status:'Closed',
    totalQuantity:100, foundryTotalWeight:1890, actualTotalWeight:1919.7, items:demoItems, changedBy: authUser()});

  loadAll();

/* ==========================================================================
   9. BOOT — silent anonymous sign-in, no login screen
   ========================================================================== */
const gate     = document.getElementById('gate');
const gateBody = document.getElementById('gate-body');

function gateMsg(title, sub, extra){
  gateBody.innerHTML = `<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>${extra||''}`;
}

function gateError(title, sub, hint){
  gateBody.innerHTML = `<h2>${esc(title)}</h2>
    <div class="err show">${esc(sub)}</div>
    ${hint ? `<ol>${hint}</ol>` : ''}
    <button class="btn primary" id="retry" style="width:100%;justify-content:center;margin-top:1rem">Try again</button>`;
  document.getElementById('retry').addEventListener('click', () => location.reload());
}

/* name field */
const operatorInput = document.getElementById('operator');
operatorInput.value = operatorName();
operatorInput.addEventListener('input', e => setOperatorName(e.target.value));

if (location.protocol === 'file:') {
  gateError('This file must be opened from a web address',
    'You have opened it directly from your computer (file:///). Firebase blocks sign-in from local files because there is no domain it can authorise.',
    `<li>Upload <code>index.html</code> to your GitHub repository</li>
     <li>Repo &rarr; <b>Settings</b> &rarr; <b>Pages</b> &rarr; Branch <b>main</b> / root &rarr; Save</li>
     <li>Wait 2 minutes, then open the <code>github.io</code> address it gives you</li>
     <li>Firebase Console &rarr; <b>Authentication</b> &rarr; <b>Settings</b> &rarr;
         <b>Authorized domains</b> &rarr; add your <code>github.io</code> domain</li>`);
  throw new Error('file protocol');
}

try {
  app  = initializeApp(firebaseConfig);
  db   = getFirestore(app);
  auth = getAuth(app);

  gateMsg('Connecting…', 'Starting the shared casting database.');

  onAuthStateChanged(auth, async user => {
    currentUser = user;
    if (!user) return;
    gate.style.display = 'none';
    try { await loadAll(); }
    catch(e){ toast('Could not load records: ' + e.message, 'error'); }
  });

  signInAnonymously(auth).catch(e => {
    if (e.code === 'auth/admin-restricted-operation' || e.code === 'auth/operation-not-allowed') {
      gateError('Anonymous sign-in is off',
        'Firebase is rejecting the automatic sign-in because Anonymous Authentication has not been enabled.',
        `<li>Firebase Console &rarr; <b>Authentication</b></li>
         <li><b>Sign-in method</b> tab</li>
         <li>Click <b>Anonymous</b> &rarr; Enable &rarr; Save</li>
         <li>Come back here and press Try again</li>`);
    } else if (e.code === 'auth/unauthorized-domain') {
      gateError('This web address is not authorised',
        'Add this exact domain in Firebase.',
        `<li>Firebase Console &rarr; <b>Authentication</b> &rarr; <b>Settings</b></li>
         <li><b>Authorized domains</b> &rarr; Add domain</li>
         <li>Enter <code>${esc(location.hostname)}</code></li>
         <li>Press Try again</li>`);
    } else if (e.code === 'auth/configuration-not-found') {
      gateError('Firebase Authentication is not switched on',
        'Project "' + firebaseConfig.projectId + '" has no Authentication service yet, so the automatic sign-in has nothing to talk to.',
        `<li>Firebase Console &rarr; check the project name at the top left says
             <b>${esc(firebaseConfig.projectId)}</b> &mdash; not a different JAYCO project</li>
         <li>Left menu &rarr; <b>Build</b> &rarr; <b>Authentication</b></li>
         <li>Click <b>Get started</b> (this creates the service)</li>
         <li><b>Sign-in method</b> tab &rarr; <b>Anonymous</b> &rarr; Enable &rarr; Save</li>
         <li>Press Try again below</li>`);
    } else if (e.code === 'auth/network-request-failed') {
      gateError('No connection', 'Could not reach Firebase. Check the internet connection and try again.');
    } else {
      gateError('Could not start', e.code ? (e.code + ' — ' + e.message) : e.message);
    }
  });
} catch (e) {
  gateError('Firebase failed to start', e.message);
}
