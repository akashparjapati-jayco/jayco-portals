<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAYCO Casting & Pattern Control</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F3;
  --ink:#111111; --ink-soft:#4B4B4B; --ink-faint:#93908C;
  --card:#ffffff; --card-border:rgba(17,17,17,0.08);
  --navy:#171717; --navy-deep:#000000; --navy-glow:rgba(0,0,0,0.28);
  --orange:#E5322D; --orange-deep:#9C1712; --orange-glow:rgba(229,50,45,0.38);
  --glass:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.7);
  --line:rgba(17,17,17,0.09);
  --ok:#1DAA5C; --warn:#B45309; --bad:#C0231E;
  --r-lg:22px; --r-md:14px; --r-sm:10px; --r-pill:100px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --mono:'Space Grotesk','Inter',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.panel-title,.val,.logo-box{font-family:var(--display)}
button,input,textarea,select{font:inherit}
a{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:266px;flex:0 0 266px;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-head{border-bottom:1px solid rgba(255,255,255,.1);padding:22px 20px;display:flex;align-items:center;gap:12px}
.brand-logo{height:26px;width:auto;display:block}
.sidebar-head .brand-logo{filter:brightness(1.12)}
.logo-box{width:40px;height:40px;border-radius:12px;background:var(--orange);display:grid;place-items:center;
  font-weight:700;font-size:19px;box-shadow:0 8px 20px -8px var(--orange-glow)}
.nav-ico{flex:0 0 auto;width:17px;height:17px;display:block}
.nav-ico svg{width:100%;height:100%;display:block}
.nav-btn > span:first-child{display:flex;align-items:center;gap:11px;min-width:0}
.nav-btn .nav-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-head p:first-of-type{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.2px;font-family:var(--display)}
.sidebar-head p:last-of-type{margin:2px 0 0;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 12px}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.32);padding:14px 10px 7px}
.nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;
  color:rgba(255,255,255,.72);padding:10px 12px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;
  border-radius:var(--r-sm);transition:background .2s,color .2s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:var(--orange);color:#fff;font-weight:600;box-shadow:0 10px 24px -12px var(--orange-glow)}
.nav-btn .count{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.5}
.nav-sep{height:1px;background:rgba(255,255,255,.09);margin:12px 10px}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.1);padding:18px 20px;font-size:11.5px;color:rgba(255,255,255,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-height:70px;
  background:rgba(246,245,243,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:0 26px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-size:14.5px;font-family:var(--display);letter-spacing:-.2px}
.topbar .title span{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px}
.content{padding:26px;max-width:1600px;width:100%;animation:rise .5s ease both}
.hamburger{display:none}

/* ---------- shared ---------- */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-faint);margin:0}
.page-head{margin-bottom:22px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  border:1px solid var(--card-border);border-radius:var(--r-lg);padding:26px 30px;
  box-shadow:0 1px 2px rgba(11,24,41,.04)}
.page-head h1{margin:10px 0 6px;font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.page-head p.desc{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.data-panel{overflow:hidden;border:1px solid var(--card-border);border-radius:var(--r-lg);background:var(--card);
  box-shadow:0 1px 2px rgba(11,24,41,.04);margin-bottom:22px}
.panel-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding:22px 26px}
.panel-title{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.4px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.metric-card{min-height:142px;border:1px solid var(--card-border);border-radius:var(--r-lg);padding:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  box-shadow:0 1px 2px rgba(11,24,41,.04);position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1)}
.metric-card:hover{transform:translateY(-4px);box-shadow:0 1px 2px rgba(11,24,41,.04),0 28px 54px -24px rgba(11,24,41,.18)}
.metric-card.dark{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff}
.metric-card.dark:hover{box-shadow:0 36px 70px -20px var(--navy-glow)}
.metric-card.red{border-color:transparent;background:linear-gradient(155deg,#F1544C 0%,var(--orange-deep) 100%);color:#fff}
.metric-card.red:hover{box-shadow:0 36px 70px -20px var(--orange-glow)}
.metric-card.dark::after,.metric-card.red::after{content:"";position:absolute;top:-40%;right:-20%;width:70%;height:70%;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);pointer-events:none}
.metric-card .lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:0}
.metric-card .val{margin:20px 0 0;font-size:30px;font-weight:700;letter-spacing:-1.2px}
.metric-card .note{margin:8px 0 0;font-size:12.5px;opacity:.62}
.two-col{display:grid;grid-template-columns:1.45fr .75fr;gap:22px}
.weight-total-card{border:1px solid var(--card-border);border-radius:var(--r-md);background:var(--card);padding:16px 18px}
.weight-total-card span{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint)}
.weight-total-card strong{display:block;margin-top:9px;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.5px}
.weight-total-card.actual{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%)}
.weight-total-card.actual span{color:rgba(255,255,255,.5)}
.weight-total-card.actual strong{color:#fff}
.weight-total-card.diff-up{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06)}
.weight-total-card.diff-up strong{color:var(--bad)}
.weight-total-card.diff-ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.07)}
.weight-total-card.diff-ok strong{color:var(--ok)}
.totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--card-border);background:var(--card);
  color:var(--ink);padding:9px 17px;border-radius:var(--r-pill);cursor:pointer;font-size:12.5px;font-weight:600;
  white-space:nowrap;transition:background .2s,box-shadow .25s,transform .25s}
.btn:hover{background:#fff;box-shadow:0 8px 20px -10px rgba(11,24,41,.3);transform:translateY(-1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--orange);border-color:var(--orange);box-shadow:0 10px 24px -8px var(--orange-glow)}
.btn.green{border-color:rgba(29,170,92,.35);color:var(--ok)}
.btn.green:hover{background:rgba(29,170,92,.07)}
.btn.icon{padding:8px 11px;font-size:13px;line-height:1;border-radius:var(--r-sm)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger{color:var(--bad);border-color:rgba(229,50,45,.28)}
.btn.danger:hover{background:rgba(229,50,45,.06)}
label.field{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;margin-top:8px;border:1px solid var(--card-border);border-radius:var(--r-sm);padding:10px 13px;
  background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(229,50,45,.14)}
textarea{min-height:80px;resize:vertical}
.search-wrap{position:relative;max-width:320px;width:100%}
.search-wrap input{margin-top:0;padding-left:34px;border-radius:var(--r-pill);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--glass-border)}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:16px}

/* ---------- tables ---------- */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:rgba(17,17,17,.025);text-align:left;font-weight:700;color:var(--ink-soft);padding:13px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:1.4px}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(17,17,17,.018)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.empty-row td{text-align:center;color:var(--ink-faint);padding:52px 16px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:var(--r-pill);padding:4px 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px}
.badge.ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.08);color:var(--ok)}
.badge.warn{border-color:rgba(180,83,9,.28);background:rgba(180,83,9,.07);color:var(--warn)}
.badge.bad{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06);color:var(--bad)}
.badge.neutral{border-color:var(--card-border);background:rgba(17,17,17,.035);color:var(--ink-soft)}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px;border-bottom:1px solid var(--line)}
.po-block{grid-column:1/-1;border:1px solid var(--card-border);background:rgba(17,17,17,.018);padding:20px;border-radius:var(--r-md)}
.po-row{display:grid;grid-template-columns:1fr 14rem auto;gap:14px;align-items:end;background:var(--card);
  border:1px solid var(--card-border);padding:16px;border-radius:var(--r-sm);margin-bottom:10px}
.form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);
  background:rgba(17,17,17,.018);padding:20px 26px}
.item-table-wrap{border:1px solid var(--card-border);border-radius:var(--r-md);overflow-x:auto}
.item-table input,.item-table select{margin-top:0;font-size:12.5px;padding:8px 10px}
.item-table td{vertical-align:top}
.progress{height:7px;background:rgba(17,17,17,.07);border-radius:var(--r-pill);overflow:hidden;margin-top:9px}
.progress > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--orange)}
.progress.dark > i{background:var(--ink)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(4px);display:none;
  align-items:flex-start;justify-content:center;padding:44px 20px;z-index:60;overflow-y:auto}
.modal-back.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:46rem;
  box-shadow:0 40px 90px -24px rgba(11,24,41,.4);animation:rise .3s ease both}
.modal.wide{max-width:66rem}
.modal-head{padding:28px 28px 8px}
.modal-head h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px}
.modal-head p{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.6}
.modal-body{padding:20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.modal-body.single{display:block}
.modal-body .full{grid-column:1/-1}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:20px 28px 28px;border-top:1px solid var(--line)}

/* ---------- toast ---------- */
#toasts{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--ink);
  box-shadow:0 20px 44px -18px rgba(11,24,41,.34);padding:14px 18px;font-size:13px;min-width:260px;max-width:370px;
  border-radius:var(--r-sm);animation:rise .3s ease both}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--ink)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);color:#fff;
  z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);color:var(--ink);width:100%;max-width:432px;border-radius:var(--r-lg);
  overflow:hidden;box-shadow:0 44px 100px -28px rgba(0,0,0,.6);animation:rise .4s ease both}
#gate .box-head{background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff;padding:24px;
  display:flex;align-items:center;gap:12px}
#gate .box-head .logo-box{width:38px;height:38px;font-size:17px}
#gate .box-head .brand-logo{height:24px}
#gate .box-head b{display:block;font-size:13.5px;letter-spacing:-.2px;font-family:var(--display)}
#gate .box-head span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
#gate .box-body{padding:28px}
#gate .box-body h2{margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-.5px}
#gate .box-body p.sub{margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);line-height:1.65}
#gate label.field{margin-bottom:16px;display:block}
#gate .err{background:rgba(229,50,45,.06);border:1px solid rgba(229,50,45,.24);border-radius:var(--r-sm);
  color:var(--bad);padding:13px 15px;font-size:13px;line-height:1.6;margin-bottom:18px;display:none}
#gate .err.show{display:block}
#gate ol{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.85;color:var(--ink-soft)}
#gate code{background:rgba(17,17,17,.05);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
.user-chip{font-size:11.5px;color:rgba(255,255,255,.7);word-break:break-all}

/* ---------- responsive ---------- */
@media(max-width:1100px){.two-col{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}.totals-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:70}
  .sidebar.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.4)}
  .hamburger{display:inline-flex}
  .form-grid{grid-template-columns:1fr}
  .po-row{grid-template-columns:1fr}
  .modal-body{grid-template-columns:1fr}
  .topbar .title span{display:none}
  .content{padding:16px}
  .page-head{padding:20px 22px}
  .page-head h1{font-size:22px}
  .metric-card{padding:20px;min-height:126px}
  .metric-card .val{font-size:25px}
}
</style>
</head>
<body>

<!-- ============ LOGIN / CONFIG GATE ============ -->
<div id="gate">

const FS_NAME = {
  casting_challans: 'casting_challans',
  pattern_masters:  'casting_pattern_masters',
  casting_masters:  'casting_item_masters',

function operatorName(){

}
function setOperatorName(v){
  try { localStorage.setItem('jayco_operator', v); } catch {}
}
const authUser = () => operatorName().trim() || 'Unnamed user';

const FirebaseAdapter = {
  name: 'Firebase Firestore',
  async list(c) {
    const snap = await getDocs(fsCollection(db, FS_NAME[c]));
    return snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  },
  async create(c, docData) {
    const now = new Date().toISOString();
    const body = { ...docData, createdAt: now, updatedAt: now, changedBy: authUser() };
    delete body.id;
    const ref = await addDoc(fsCollection(db, FS_NAME[c]), body);
    return { ...body, id: ref.id };
  },
  async update(c, id, patch) {
    const now = new Date().toISOString();
    const body = { ...patch, updatedAt: now, changedBy: authUser() };
    delete body.id;
    await updateDoc(fsDoc(db, FS_NAME[c], id), body);
    return { ...body, id };
  },
  async remove(c, id) {
    await deleteDoc(fsDoc(db, FS_NAME[c], id));
  }
};

/* Kept only so the JSON backup/restore buttons still work offline. */
const LocalAdapter = {
  name: 'Local test storage',
  async list(c) { try { return JSON.parse(localStorage.getItem('jayco_' + c) || '[]'); } catch { return []; } },
  async create(c, d) {
    const rows = await this.list(c);
    d.id = d.id || uid(); d.createdAt = new Date().toISOString(); d.updatedAt = d.createdAt;
    rows.unshift(d); localStorage.setItem('jayco_' + c, JSON.stringify(rows)); return d;
  },
  async update(c, id, patch) {
    const rows = await this.list(c);
    const i = rows.findIndex(r => String(r.id) === String(id));
    if (i < 0) throw new Error('Record not found.');
    rows[i] = { ...rows[i], ...patch, id: rows[i].id, updatedAt: new Date().toISOString() };
    localStorage.setItem('jayco_' + c, JSON.stringify(rows)); return rows[i];
  },
  async remove(c, id) {
    const rows = (await this.list(c)).filter(r => String(r.id) !== String(id));
    localStorage.setItem('jayco_' + c, JSON.stringify(rows));
  }
};

function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v + 'T00:00:00');
  if(isNaN(d)) return v;
  return new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',year:'numeric'}).format(d);
}
function fmtWt(v){ return new Intl.NumberFormat('en-IN',{maximumFractionDigits:3}).format(num(v)) + ' kg'; }
function badgeClass(s){
  const v = String(s).toLowerCase();
  if(['active','available','good','accepted','closed'].some(w=>v.includes(w))) return 'ok';
  if(['repair','hold','foundry','pending'].some(w=>v.includes(w))) return 'warn';
  if(['retired','recall','overdue','inactive'].some(w=>v.includes(w))) return 'bad';
  return 'neutral';
}
function statusBadge(s){ return `<span class="badge ${badgeClass(s)}">${esc(s)}</span>`; }
function toast(msg, kind='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}
function getPOs(ch){
  if(ch.purchaseOrders && ch.purchaseOrders.length) return ch.purchaseOrders;

/* ---- Generate P/O ---- */
/* Approx weight per piece is derived from YOUR OWN closed challans:
   total JAYCO weight received for that item / total pieces received.   */
function avgWeightFor(itemName){
  let qty = 0, wt = 0;
  for(const c of state.challans)
    for(const i of c.items)
      if(i.itemName === itemName){ qty += num(i.quantity); wt += num(i.actualTotalWeight); }
  return qty > 0 ? {avg: wt/qty, qty, source: 'challans'} : {avg: 0, qty: 0, source: 'none'};
}

function blankPoLine(){ return {masterCode:'', itemName:'', itemType:DEFAULT_TYPES[0], quantity:''}; }
function blankPo(){ return {poNumber:'', poDate: today(), foundryName:'', items:[blankPoLine()], notes:''}; }

function viewGeneratePO(){
  if(!state.poForm) state.poForm = blankPo();
  const f = state.poForm;
  const editing = !!state.editingPoId;
  const masters = [...state.castingMasters].sort((a,b)=>String(a.itemName).localeCompare(String(b.itemName),'en',{numeric:true}));
  const foundries = [...new Set([...state.challans.map(c=>c.foundryName), ...state.purchaseOrders.map(p=>p.foundryName)].filter(Boolean))];
  const typeOptions = allTypes();

  let totQty = 0, totWt = 0, anyMissing = false;
  const lines = f.items.map((it,i)=>{
    const qty = num(it.quantity);
    const w = avgWeightFor(it.itemName);
    const approx = qty * w.avg;
    totQty += qty; totWt += approx;
    if(it.itemName && w.source === 'none') anyMissing = true;
    const known = masters.some(m=>m.itemCode===it.masterCode);
    return `<tr>
      <td><select data-po-item="${i}" data-po-field="masterCode" required>
        <option value="">${masters.length?'Select saved item':'Save an item in Casting Master first'}</option>
        ${!known && it.itemName ? `<option value="${esc(it.masterCode)}" selected>${esc(it.itemName)}</option>` : ''}
        ${masters.map(m=>`<option value="${esc(m.itemCode)}" ${m.itemCode===it.masterCode?'selected':''}>${esc(m.itemName)}</option>`).join('')}
      </select></td>
      <td><select data-po-item="${i}" data-po-field="itemType">${opt(typeOptions, it.itemType)}</select></td>
      <td><input type="number" min="1" required data-po-item="${i}" data-po-field="quantity" value="${esc(it.quantity)}" placeholder="0" style="text-align:right"></td>
      <td class="num">${ w.source==='challans'
          ? `<b>${fmtWt(w.avg)}</b><div style="font-size:10.5px;color:var(--ink-faint);font-family:var(--font)">from ${w.qty} pcs received</div>`
          : (it.itemName ? `<span class="badge warn">No history</span>` : '—') }</td>
      <td class="num"><b>${ approx>0 ? fmtWt(approx) : '—' }</b></td>
      <td><button type="button" class="btn icon danger" data-rm-po-item="${i}" ${f.items.length===1?'disabled':''}>🗑</button></td>
    </tr>`;
  }).join('');

  const register = state.purchaseOrders.map(p=>`<tr>
      <td class="mono">${esc(p.poNumber)}</td>
      <td>${fmtDate(p.poDate)}</td>
      <td>${esc(p.foundryName)}</td>
      <td class="num">${p.items.length}</td>
      <td class="num">${num(p.totalQuantity)}</td>
      <td class="num">${fmtWt(p.totalApproxWeight)}</td>
      <td>${statusBadge(p.status||'Open')}</td>
      <td class="num" style="white-space:nowrap">
        <button class="btn icon" data-edit-po="${esc(p.id)}" title="Edit">✎</button>
        <button class="btn icon" data-pdf-po="${esc(p.id)}" title="PDF">⬇</button>
        <button class="btn icon green" data-wa-po="${esc(p.id)}" title="WhatsApp">✆</button>
        <button class="btn icon danger" data-del-po="${esc(p.id)}" title="Delete">🗑</button>
      </td></tr>`).join('');

  return `<section class="data-panel">
    <div class="panel-heading">
      <div><p class="eyebrow">${editing?'Change saved order':'New purchase order'}</p>
      <h2 class="panel-title">${editing?'Edit Purchase Order':'Generate P/O'}</h2></div>
      <span class="badge neutral">Weight from challan history</span>
    </div>
    <form id="po-form">
      <div class="form-grid">
        <label class="field">P/O No. *<input type="text" required maxlength="80" name="poNumber" value="${esc(f.poNumber)}" placeholder="e.g. JAY/PO/2026/118"></label>
        <label class="field">P/O Date *<input type="date" required name="poDate" value="${esc(f.poDate)}"></label>
        <label class="field">Foundry Name *<input type="text" required maxlength="160" name="foundryName" list="dl-po-foundries" value="${esc(f.foundryName)}" placeholder="Enter foundry name">
          <datalist id="dl-po-foundries">${foundries.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
      </div>

      <div style="padding:26px">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-bottom:18px">
          <div><p class="eyebrow">Order line items</p>
          <p style="margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.6">Approx. weight/pc is pulled from your closed challans for that item. Approx. total = qty x avg weight/pc.</p></div>
          <button type="button" class="btn" id="add-po-item">+ Add Item</button>
        </div>
        <div class="item-table-wrap"><table class="item-table">
          <thead><tr><th style="min-width:240px">Item</th><th style="min-width:130px">Type</th>
          <th class="num" style="min-width:90px">Qty</th><th class="num" style="min-width:170px">Approx. Weight/Pc</th>
          <th class="num" style="min-width:150px">Approx. Total Weight</th><th></th></tr></thead>
          <tbody>${lines}</tbody>
        </table></div>

        ${ anyMissing ? `<div style="margin-top:16px;border:1px solid rgba(180,83,9,.28);background:rgba(180,83,9,.06);border-radius:var(--r-md);padding:14px 18px;font-size:13px;color:var(--warn);line-height:1.6">
          One or more items have never been received on a closed challan, so there is no weight history to calculate from. The approximate weight for those lines will show as zero until you close a challan for them.</div>` : '' }

        <div class="totals-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="weight-total-card"><span>Line Items</span><strong>${f.items.length}</strong></div>

    </div>
    <div class="table-scroll"><table>
      <thead><tr><th>P/O No.</th><th>Date</th><th>Foundry</th><th class="num">Items</th>
      <th class="num">Qty</th><th class="num">Approx. Weight</th><th>Status</th><th class="num">Actions</th></tr></thead>
      <tbody>${ register || emptyRow(8,'No purchase orders raised yet.') }</tbody>
    </table></div>
  </section>`;
}

  // POs

    doc.setFontSize(7); doc.setTextColor(...SLATE);
    doc.text(fmtDate(p.purchaseOrderDate), x+160, y+23);
  });
  const tableTop = py + Math.ceil(pos.length/3)*34 + 14;

  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...RED);
  doc.text('CALCULATION: AVERAGE WEIGHT/PC = JAYCO WEIGHT / QTY', 30, tableTop - 4);

    startY: tableTop,
    margin: {left:30, right:30},
    head: [['SR','CASTING ITEM','TYPE','MATERIAL','QTY','FOUNDRY WEIGHT','JAYCO WEIGHT','AVERAGE WEIGHT/PC']],
    body: c.items.map((i,n)=>[
      n+1, i.itemName, i.itemType, i.material, num(i.quantity),
      num(i.foundryTotalWeight)>0 ? fmtWt(i.foundryTotalWeight) : 'Not entered',
      fmtWt(i.actualTotalWeight),

    ]),

    columnStyles:{0:{halign:'center',cellWidth:28},4:{halign:'right'},5:{halign:'right'},6:{halign:'right',fontStyle:'bold'},7:{halign:'right'}},
    alternateRowStyles:{fillColor:[248,250,252]}
  });

  // totals
  let ty = doc.lastAutoTable.finalY + 14;
  const cards = [
    ['TOTAL QUANTITY', String(num(c.totalQuantity)), null],
    ['FOUNDRY TOTAL WEIGHT', fc?fmtWt(c.foundryTotalWeight):'Not entered', null],
    ['JAYCO TOTAL WEIGHT', fmtWt(c.actualTotalWeight), DARK],
    ['DIFFERENCE', fc?fmtWt(num(c.actualTotalWeight)-num(c.foundryTotalWeight)):'Not available', RED]
  ];
  const cw = (W - 60 - 3*10) / 4;

/* Build a challan object from the current entry form (with validation) */
function currentFormChallan(){
  const f = state.entryForm;
  const items = f.items.map(i=>{
    const qty = num(i.quantity), fw = num(i.foundryWeight), aw = num(i.actualWeight);
    return {itemName:i.itemName, itemType:i.itemType, material:i.material, quantity:qty,
            foundryWeight:fw, actualWeight:aw, foundryTotalWeight:fw, actualTotalWeight:aw};
  });
  const bad = !f.challanNumber.trim() || !f.challanDate || !f.foundryName.trim()
    || !f.purchaseOrders.length
    || f.purchaseOrders.some(p=>!p.purchaseOrderNumber.trim() || !p.purchaseOrderDate)
    || items.some(i=>!i.itemName || !i.itemType || !i.material || i.quantity<=0 || i.actualWeight<=0);
  if(bad){ toast('Complete the challan, JAYCO P/O, item, quantity and JAYCO weight fields first. Foundry weight is optional.','error'); return null; }
  return {
    id: state.editingChallanId || 'draft',
    challanNumber: f.challanNumber, challanDate: f.challanDate, foundryName: f.foundryName,
    purchaseOrderNumber: f.purchaseOrders[0].purchaseOrderNumber,
    purchaseOrderDate: f.purchaseOrders[0].purchaseOrderDate,
    purchaseOrders: f.purchaseOrders, status: state.editingChallanId ? 'Closed' : 'Draft',
    totalQuantity: items.reduce((s,i)=>s+i.quantity,0),
    foundryTotalWeight: items.reduce((s,i)=>s+i.foundryTotalWeight,0),
    actualTotalWeight: items.reduce((s,i)=>s+i.actualTotalWeight,0),
    items
  };
}

/* ---- P/O document ---- */
function currentFormPo(){
  const f = state.poForm;
  const items = f.items.map(i=>{
    const qty = num(i.quantity), w = avgWeightFor(i.itemName);
    return {masterCode:i.masterCode, itemName:i.itemName, itemType:i.itemType,
            quantity:qty, avgWeight:w.avg, approxWeight:qty*w.avg, weightSource:w.source};
  });
  const bad = !f.poNumber.trim() || !f.poDate || !f.foundryName.trim()
    || items.some(i=>!i.itemName || !i.itemType || i.quantity<=0);
  if(bad){ toast('Complete the P/O number, date, foundry, item and quantity fields first.','error'); return null; }
  return {
    id: state.editingPoId || 'draft',
    poNumber: f.poNumber, poDate: f.poDate, foundryName: f.foundryName, notes: f.notes||'',
    status: 'Open', items,
    totalQuantity: items.reduce((s,i)=>s+i.quantity,0),
    totalApproxWeight: items.reduce((s,i)=>s+i.approxWeight,0)
  };
}

async function savePo(status){
  const p = currentFormPo(); if(!p) return;
  const payload = {...p, status};
  delete payload.id;
  try{
    if(state.editingPoId){
      await DB.update('purchase_orders', state.editingPoId, payload);
      toast('Purchase order updated','success');
    } else {
      const dup = state.purchaseOrders.find(x => x.poNumber === payload.poNumber);
      if(dup) return toast('That P/O number already exists.','error');
      await DB.create('purchase_orders', payload);
      toast(status === 'Closed' ? 'Purchase order closed and saved' : 'Purchase order saved as Open','success');
    }
    state.poForm = blankPo(); state.editingPoId = null;
    await loadAll(); window.scrollTo(0,0);
  }catch(err){ toast('Could not save: ' + err.message,'error'); }
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-view],[data-go],[data-new-challan],[data-view-challan],[data-edit-challan],[data-del-challan],[data-open-pattern],[data-del-pattern],[data-open-casting],[data-del-casting],[data-open-type],[data-del-type],[data-open-move],[data-del-move],[data-close],[data-rm-po],[data-rm-item],[data-quick-add],[data-pdf-challan],[data-wa-challan],[data-edit-po],[data-del-po],[data-pdf-po],[data-wa-po],[data-rm-po-item]');
  if(!t) return;
  const d = t.dataset;

  if(d.view !== undefined){ state.view = d.view; state.search=''; document.getElementById('search').value=''; document.getElementById('sidebar').classList.remove('open'); render(); return; }
  if(d.go !== undefined){ state.view = d.go; render(); window.scrollTo(0,0); return; }
  if(d.close !== undefined){ closeModal(); return; }

  if(d.newChallan !== undefined){ state.editingChallanId=null; state.entryForm=blankEntry(); state.view='insert-casting'; render(); window.scrollTo(0,0); return; }

  if(d.viewChallan){ modalViewChallan(d.viewChallan); return; }
  if(d.pdfChallan){ const c = state.challans.find(x=>String(x.id)===d.pdfChallan); if(c) downloadPdf(c); return; }
  if(d.waChallan){ const c = state.challans.find(x=>String(x.id)===d.waChallan); if(c) shareWhatsApp(c); return; }

  if(d.editChallan){
    const c = state.challans.find(x=>String(x.id)===d.editChallan); if(!c) return;
    closeModal();
    state.editingChallanId = c.id;
    state.entryForm = {
      challanNumber:c.challanNumber, challanDate:c.challanDate, foundryName:c.foundryName,
      purchaseOrders:getPOs(c).map(p=>({...p})),
      items:c.items.map((i,n)=>({
        masterCode: (state.castingMasters.find(m=>m.itemName===i.itemName)||{}).itemCode || ('legacy-'+n),
        itemName:i.itemName, itemType:i.itemType, material:i.material,
        quantity:String(i.quantity), foundryWeight: num(i.foundryTotalWeight)>0?String(i.foundryTotalWeight):'',
        actualWeight:String(i.actualTotalWeight)}))
    };
    state.view='insert-casting'; render(); window.scrollTo(0,0); return;
  }

  if(d.delChallan){ if(confirm('Delete this challan permanently?')){ await DB.remove('casting_challans', d.delChallan); toast('Challan deleted','success'); loadAll(); } return; }
  if(d.delPattern){ if(confirm('Delete this pattern from the master?')){ await DB.remove('pattern_masters', d.delPattern); toast('Pattern deleted','success'); loadAll(); } return; }
  if(d.delCasting){ if(confirm('Delete this casting item from the master?')){ await DB.remove('casting_masters', d.delCasting); toast('Casting item deleted','success'); loadAll(); } return; }
  if(d.delType){ if(confirm('Delete this casting type?')){ await DB.remove('casting_types', d.delType); toast('Type deleted','success'); loadAll(); } return; }
  if(d.delMove){ if(confirm('Delete this pattern position record?')){ await DB.remove('control_records', d.delMove); toast('Pattern position deleted','success'); loadAll(); } return; }

  if(d.openPattern !== undefined){ modalPattern(d.openPattern); return; }
  if(d.openCasting !== undefined){ modalCasting(d.openCasting, null); return; }
  if(d.openType !== undefined){ modalType(d.openType); return; }
  if(d.openMove !== undefined){ modalMovement(d.openMove); return; }
  if(d.quickAdd !== undefined){ modalCasting('', Number(d.quickAdd)); return; }

  if(d.rmPo !== undefined){
    if(state.entryForm.purchaseOrders.length>1) state.entryForm.purchaseOrders.splice(Number(d.rmPo),1);
    render(); return;
  }

  if(d.rmPoItem !== undefined){
    if(state.poForm.items.length>1) state.poForm.items.splice(Number(d.rmPoItem),1);
    render(); return;
  }
  if(d.pdfPo){ const p = state.purchaseOrders.find(x=>String(x.id)===d.pdfPo); if(p) downloadPoPdf(p); return; }
  if(d.waPo){ const p = state.purchaseOrders.find(x=>String(x.id)===d.waPo); if(p) shareWhatsAppPo(p); return; }
  if(d.delPo){ if(confirm('Delete this purchase order permanently?')){ await DB.remove('purchase_orders', d.delPo); toast('Purchase order deleted','success'); loadAll(); } return; }
  if(d.editPo){
    const p = state.purchaseOrders.find(x=>String(x.id)===d.editPo); if(!p) return;
    state.editingPoId = p.id;
    state.poForm = {poNumber:p.poNumber, poDate:p.poDate, foundryName:p.foundryName, notes:p.notes||'',
      items:p.items.map((i,n)=>({masterCode:(state.castingMasters.find(m=>m.itemName===i.itemName)||{}).itemCode || ('legacy-'+n),
        itemName:i.itemName, itemType:i.itemType, quantity:String(i.quantity)}))};
    state.view='generate-po'; render(); window.scrollTo(0,0); return;
  }
  if(d.rmItem !== undefined){
    if(state.entryForm.items.length>1) state.entryForm.items.splice(Number(d.rmItem),1);
    render(); return;
  }
});

/* modal backdrop click */
document.getElementById('modal-back').addEventListener('click', e => { if(e.target.id==='modal-back') closeModal(); });

/* topbar */
document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; render(); });
document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('toggle-sidebar').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

/* entry form live binding */
document.addEventListener('input', e => {
  const el = e.target;
  if(!state.entryForm) return;
  if(el.name && ['challanNumber','challanDate','foundryName'].includes(el.name) && el.closest('#entry-form')){
    state.entryForm[el.name] = el.value; return;   // no re-render: keeps focus
  }
  if(el.name && ['poNumber','poDate','foundryName','notes'].includes(el.name) && el.closest('#po-form') && state.poForm){
    state.poForm[el.name] = el.value; return;
  }
  if(el.dataset.po !== undefined){ state.entryForm.purchaseOrders[Number(el.dataset.po)][el.dataset.pofield] = el.value; return; }
  if(el.dataset.poItem !== undefined && state.poForm){
    state.poForm.items[Number(el.dataset.poItem)][el.dataset.poField] = el.value;
    if(el.dataset.poField === 'quantity') render();
    return;
  }
  if(el.dataset.item !== undefined){
    const i = Number(el.dataset.item), field = el.dataset.field;
    state.entryForm.items[i][field] = el.value;
    // live-update the average cell without full re-render
    const row = el.closest('tr');
    const it = state.entryForm.items[i], qty = num(it.quantity);
    if(row) row.querySelector('td.num b').textContent = (it.actualWeight && qty>0) ? fmtWt(num(it.actualWeight)/qty) : '—';
    updateEntryTotals();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(!state.entryForm) return;
  if(el.dataset.poItem !== undefined && state.poForm){
    const i = Number(el.dataset.poItem);
    if(el.dataset.poField === 'masterCode'){
      const m = state.castingMasters.find(x=>x.itemCode===el.value);
      if(m) Object.assign(state.poForm.items[i], {masterCode:m.itemCode, itemName:m.itemName,
        itemType: PO_TYPES.includes(m.itemType) ? m.itemType : state.poForm.items[i].itemType});
      else Object.assign(state.poForm.items[i], {masterCode:'', itemName:''});
    } else {
      state.poForm.items[i][el.dataset.poField] = el.value;
    }
    render(); return;
  }
  if(el.dataset.item !== undefined && el.dataset.field === 'masterCode'){
    const m = state.castingMasters.find(x=>x.itemCode===el.value);
    const i = Number(el.dataset.item);
    if(m) Object.assign(state.entryForm.items[i], {masterCode:m.itemCode, itemName:m.itemName, itemType:m.itemType, material:m.material});
    render();
  } else if(el.dataset.item !== undefined){
    state.entryForm.items[Number(el.dataset.item)][el.dataset.field] = el.value;
  }
});

function updateEntryTotals(){
  const f = state.entryForm; if(!f) return;
  const cards = document.querySelectorAll('.totals-grid .weight-total-card strong');
  if(cards.length < 4) return;
  const t = f.items.reduce((a,i)=>({q:a.q+num(i.quantity), fw:a.fw+num(i.foundryWeight), aw:a.aw+num(i.actualWeight)}),{q:0,fw:0,aw:0});
  const complete = f.items.every(i=>num(i.foundryWeight)>0);
  cards[0].textContent = t.q;
  cards[1].textContent = complete ? fmtWt(t.fw) : '—';
  cards[2].textContent = fmtWt(t.aw);
  cards[3].textContent = complete ? fmtWt(t.aw - t.fw) : '—';
  const diffCard = cards[3].parentElement;
  diffCard.className = 'weight-total-card ' + (complete && (t.aw-t.fw)>0 ? 'diff-up' : 'diff-ok');
}

/* form buttons inside the entry view */
document.addEventListener('click', e => {
  if(e.target.closest('#add-po')){ state.entryForm.purchaseOrders.push(blankPO()); render(); }
  if(e.target.closest('#add-item')){ state.entryForm.items.push(blankLine()); render(); }
  if(e.target.closest('#form-pdf')){ const c = currentFormChallan(); if(c) downloadPdf(c); }
  if(e.target.closest('#form-wa')){ const c = currentFormChallan(); if(c) shareWhatsApp(c); }
  if(e.target.closest('#add-po-item')){ state.poForm.items.push(blankPoLine()); render(); }
  if(e.target.closest('#po-pdf')){ const p = currentFormPo(); if(p) downloadPoPdf(p); }
  if(e.target.closest('#po-wa')){ const p = currentFormPo(); if(p) shareWhatsAppPo(p); }
  if(e.target.closest('#po-reset')){ state.poForm = blankPo(); state.editingPoId = null; render(); }
  if(e.target.closest('#po-save')){ savePo('Open'); }
});

/* form submissions */
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const data = Object.fromEntries(new FormData(f).entries());

  try{
    if(f.id === 'entry-form'){
      const c = currentFormChallan(); if(!c) return;
      const payload = {...c, status:'Closed'};
      delete payload.id;
      if(state.editingChallanId){
        await DB.update('casting_challans', state.editingChallanId, payload);
        toast('Closed challan updated','success');
      } else {
        const dup = state.challans.find(x => x.foundryName===payload.foundryName && x.challanNumber===payload.challanNumber);
        if(dup) return toast('That challan number already exists for this foundry.','error');
        await DB.create('casting_challans', payload);
        toast('Challan closed and moved to Casting Management','success');
      }
      state.entryForm = blankEntry(); state.editingChallanId = null; state.view = 'casting-records';
      await loadAll(); window.scrollTo(0,0); return;
    }

    if(f.id === 'po-form'){ await savePo('Closed'); return; }

    if(f.id === 'f-pattern'){
      const p = {patternCode:data.patternCode.trim(), patternName:data.patternName.trim(), castingItem:data.castingItem.trim(),
                 patternType:data.patternType, totalQuantity:num(data.totalQuantity), location:data.location.trim(),
                 status:data.status, notes:data.notes.trim()};
      const dup = state.patternMasters.find(x=>x.patternCode===p.patternCode && String(x.id)!==String(data.id));
      if(dup) return toast('That pattern code already exists.','error');
      data.id ? await DB.update('pattern_masters', data.id, p) : await DB.create('pattern_masters', p);
      toast(data.id?'Pattern master updated':'Pattern added to master','success');
    }

    if(f.id === 'f-casting'){
      const c = {itemName:data.itemName.trim(), itemType:data.itemType, material:data.material,
                 drawingNumber:data.drawingNumber.trim(), patternCode:data.patternCode.trim(),
                 status:data.status, notes:data.notes.trim(), averageWeight:0};
      let saved;
      if(data.id){ saved = await DB.update('casting_masters', data.id, c); }
      else { c.itemCode = 'CAST-' + Math.random().toString(36).slice(2,10).toUpperCase(); saved = await DB.create('casting_masters', c); }
      if(data.quickIndex !== '' && state.entryForm){
        const i = Number(data.quickIndex);
        Object.assign(state.entryForm.items[i], {masterCode:saved.itemCode, itemName:saved.itemName, itemType:saved.itemType, material:saved.material});
        toast('Item saved and selected on the challan','success');
      } else toast(data.id?'Casting master updated':'Casting item added to master','success');
    }

    if(f.id === 'f-type'){
      const t = {typeName:data.typeName.trim(), status:data.status, notes:data.notes.trim()};
      const dup = state.castingTypes.find(x=>x.typeName.toLowerCase()===t.typeName.toLowerCase() && String(x.id)!==String(data.id));
      if(dup) return toast('That type name already exists.','error');
      data.id ? await DB.update('casting_types', data.id, t) : await DB.create('casting_types', t);
      toast(data.id?'Casting type updated everywhere':'Casting type added to master','success');
    }

    if(f.id === 'f-move'){
      const m = {module:'patterns', reference:data.reference.trim(), item:data.item.trim(), foundry:data.foundry.trim(),
                 quantity:num(data.quantity), received:Math.min(num(data.quantity), num(data.received)),
                 dueDate:data.dueDate, status:data.status, notes:data.notes.trim(), changedBy: authUser()};
      data.id ? await DB.update('control_records', data.id, m) : await DB.create('control_records', m);
      toast(data.id?'Pattern position updated':'Pattern position added','success');
    }

    closeModal();
    await loadAll();
  }catch(err){ toast(err.message || 'Could not save.','error'); }
});

/* ==========================================================================
   8. BACKUP / SEED
   ========================================================================== */
document.getElementById('btn-export').addEventListener('click', async () => {
  const dump = {};
  for(const c of COLLECTIONS) dump[c] = await DB.list(c);
  const blob = new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jayco-casting-backup-' + today() + '.json';
  a.click();
  toast('Backup downloaded','success');
});
document.getElementById('btn-import').addEventListener('click', () => {
  if(!confirm('This will WRITE every record from the backup file into Firestore as new documents. Continue?')) return;
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const dump = JSON.parse(await file.text());
    let n = 0;
    for(const c of COLLECTIONS){
      for(const row of (dump[c]||[])){ const r = {...row}; delete r.id; await DB.create(c, r); n++; }
    }
    toast(n + ' records imported into Firestore','success'); loadAll();
  }catch(err){ toast('Import failed: ' + err.message,'error'); }
  e.target.value = '';
});
document.getElementById('btn-wipe').addEventListener('click', async () => {
  if(!confirm('Delete ALL casting records from Firestore? This cannot be undone.')) return;
  if(prompt('Type DELETE to confirm.') !== 'DELETE') return toast('Cancelled','info');
  try{
    for(const c of COLLECTIONS){ for(const r of await DB.list(c)) await DB.remove(c, r.id); }
    toast('All casting data deleted','success'); loadAll();
  }catch(err){ toast('Delete failed: ' + err.message,'error'); }
});
document.getElementById('btn-seed').addEventListener('click', async () => {
  if(!confirm('Load demo data on top of what is already stored?')) return;
  for(const t of ['Cap','Base','Housing','Pillow Block','Lock Nut','Adapter Sleeve'])
    await DB.create('casting_types', {typeName:t, status:'Active', notes:''});
  const items = [
    ['SNH 520-617 Housing','Housing','Cast Iron','DRG-520-617','PTN-SNH-520'],
    ['SNH 520-617 Cap','Cap','Cast Iron','DRG-520-C','PTN-SNH-520'],
    ['SN 511-609 Base','Base','Cast Iron','DRG-511-B','PTN-SN-511'],
    ['P 210 Pillow Block','Pillow Block','SG Iron','DRG-P210','PTN-P-210']
  ];
  const saved = [];
  for(const [itemName,itemType,material,drawingNumber,patternCode] of items)
    saved.push(await DB.create('casting_masters',
      {itemCode:'CAST-'+Math.random().toString(36).slice(2,10).toUpperCase(), itemName, itemType, material, drawingNumber, patternCode, status:'Active', notes:'', averageWeight:0}));
  for(const [patternCode,patternName,castingItem] of [
    ['PTN-SNH-520','SNH 520-617 housing pattern','SNH 520-617 Housing'],
    ['PTN-SN-511','SN 511-609 base pattern','SN 511-609 Base'],
    ['PTN-P-210','P 210 pillow block pattern','P 210 Pillow Block']])
    await DB.create('pattern_masters', {patternCode, patternName, castingItem, patternType:'Split pattern', totalQuantity:2, location:'In-house', status:'Available', notes:''});
  await DB.create('control_records', {module:'patterns', reference:'PTN-SNH-520', item:'SNH 520-617 housing pattern', foundry:'Bharat Steel Foundry', quantity:2, received:1, dueDate:today(), status:'At foundry', notes:'One set sent for trial casting', changedBy: authUser()});
  const demoItems = [
    {itemName:saved[0].itemName, itemType:saved[0].itemType, material:saved[0].material, quantity:50, foundryWeight:1250, actualWeight:1268.5, foundryTotalWeight:1250, actualTotalWeight:1268.5},
    {itemName:saved[1].itemName, itemType:saved[1].itemType, material:saved[1].material, quantity:50, foundryWeight:640, actualWeight:651.2, foundryTotalWeight:640, actualTotalWeight:651.2}
  ];
  await DB.create('casting_challans', {
    challanNumber:'BSF/CH/1024', challanDate:today(), foundryName:'Bharat Steel Foundry',
    purchaseOrders:[{purchaseOrderNumber:'JAY/PO/2026/118', purchaseOrderDate:today()}],
    purchaseOrderNumber:'JAY/PO/2026/118', purchaseOrderDate:today(), status:'Closed',
    totalQuantity:100, foundryTotalWeight:1890, actualTotalWeight:1919.7, items:demoItems, changedBy: authUser()});
  toast('Demo data loaded','success');
  loadAll();
});

/* ==========================================================================
   9. BOOT — silent anonymous sign-in, no login screen
   ========================================================================== */
const gate     = document.getElementById('gate');
const gateBody = document.getElementById('gate-body');

function gateMsg(title, sub, extra){
  gateBody.innerHTML = `<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>${extra||''}`;
}

function gateError(title, sub, hint){
  gateBody.innerHTML = `<h2>${esc(title)}</h2>
    <div class="err show">${esc(sub)}</div>
    ${hint ? `<ol>${hint}</ol>` : ''}
    <button class="btn primary" id="retry" style="width:100%;justify-content:center;margin-top:1rem">Try again</button>`;
  document.getElementById('retry').addEventListener('click', () => location.reload());
}

/* name field */
const operatorInput = document.getElementById('operator');
operatorInput.value = operatorName();
operatorInput.addEventListener('input', e => setOperatorName(e.target.value));

if (location.protocol === 'file:') {
  gateError('This file must be opened from a web address',
    'You have opened it directly from your computer (file:///). Firebase blocks sign-in from local files because there is no domain it can authorise.',
    `<li>Upload <code>index.html</code> to your GitHub repository</li>
     <li>Repo &rarr; <b>Settings</b> &rarr; <b>Pages</b> &rarr; Branch <b>main</b> / root &rarr; Save</li>
     <li>Wait 2 minutes, then open the <code>github.io</code> address it gives you</li>
     <li>Firebase Console &rarr; <b>Authentication</b> &rarr; <b>Settings</b> &rarr;
         <b>Authorized domains</b> &rarr; add your <code>github.io</code> domain</li>`);
  throw new Error('file protocol');
}

try {
  app  = initializeApp(firebaseConfig);
  db   = getFirestore(app);
  auth = getAuth(app);

  gateMsg('Connecting…', 'Starting the shared casting database.');

  onAuthStateChanged(auth, async user => {
    currentUser = user;
    if (!user) return;
    gate.style.display = 'none';
    try { await loadAll(); }
    catch(e){ toast('Could not load records: ' + e.message, 'error'); }
  });

  signInAnonymously(auth).catch(e => {
    if (e.code === 'auth/admin-restricted-operation' || e.code === 'auth/operation-not-allowed') {
      gateError('Anonymous sign-in is off',
        'Firebase is rejecting the automatic sign-in because Anonymous Authentication has not been enabled.',
        `<li>Firebase Console &rarr; <b>Authentication</b></li>
         <li><b>Sign-in method</b> tab</li>
         <li>Click <b>Anonymous</b> &rarr; Enable &rarr; Save</li>
         <li>Come back here and press Try again</li>`);
    } else if (e.code === 'auth/unauthorized-domain') {
      gateError('This web address is not authorised',
        'Add this exact domain in Firebase.',
        `<li>Firebase Console &rarr; <b>Authentication</b> &rarr; <b>Settings</b></li>
         <li><b>Authorized domains</b> &rarr; Add domain</li>
         <li>Enter <code>${esc(location.hostname)}</code></li>
         <li>Press Try again</li>`);
    } else if (e.code === 'auth/configuration-not-found') {
      gateError('Firebase Authentication is not switched on',
        'Project "' + firebaseConfig.projectId + '" has no Authentication service yet, so the automatic sign-in has nothing to talk to.',
        `<li>Firebase Console &rarr; check the project name at the top left says
             <b>${esc(firebaseConfig.projectId)}</b> &mdash; not a different JAYCO project</li>
         <li>Left menu &rarr; <b>Build</b> &rarr; <b>Authentication</b></li>
         <li>Click <b>Get started</b> (this creates the service)</li>
         <li><b>Sign-in method</b> tab &rarr; <b>Anonymous</b> &rarr; Enable &rarr; Save</li>
         <li>Press Try again below</li>`);
    } else if (e.code === 'auth/network-request-failed') {
      gateError('No connection', 'Could not reach Firebase. Check the internet connection and try again.');
    } else {
      gateError('Could not start', e.code ? (e.code + ' — ' + e.message) : e.message);
    }
  });
} catch (e) {
  gateError('Firebase failed to start', e.message);
}
</script>
