<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAYCO Casting & Pattern Control</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F3;
  --ink:#111111; --ink-soft:#4B4B4B; --ink-faint:#93908C;
  --card:#ffffff; --card-border:rgba(17,17,17,0.08);
  --navy:#171717; --navy-deep:#000000; --navy-glow:rgba(0,0,0,0.28);
  --orange:#E5322D; --orange-deep:#9C1712; --orange-glow:rgba(229,50,45,0.38);
  --glass:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.7);
  --line:rgba(17,17,17,0.09);
  --ok:#1DAA5C; --warn:#B45309; --bad:#C0231E;
  --r-lg:22px; --r-md:14px; --r-sm:10px; --r-pill:100px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --mono:'Space Grotesk','Inter',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.panel-title,.val,.logo-box{font-family:var(--display)}
button,input,textarea,select{font:inherit}
a{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:266px;flex:0 0 266px;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-head{border-bottom:1px solid rgba(255,255,255,.1);padding:22px 20px;display:flex;align-items:center;gap:12px}
.brand-logo{height:26px;width:auto;display:block}
.sidebar-head .brand-logo{filter:brightness(1.12)}
.logo-box{width:40px;height:40px;border-radius:12px;background:var(--orange);display:grid;place-items:center;
  font-weight:700;font-size:19px;box-shadow:0 8px 20px -8px var(--orange-glow)}
.nav-ico{flex:0 0 auto;width:17px;height:17px;display:block}
.nav-ico svg{width:100%;height:100%;display:block}
.nav-btn > span:first-child{display:flex;align-items:center;gap:11px;min-width:0}
.nav-btn .nav-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-head p:first-of-type{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.2px;font-family:var(--display)}
.sidebar-head p:last-of-type{margin:2px 0 0;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
.sidebar-body{flex:1;overflow-y:auto;padding:14px 12px}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.32);padding:14px 10px 7px}
.nav-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;
  color:rgba(255,255,255,.72);padding:10px 12px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;
  border-radius:var(--r-sm);transition:background .2s,color .2s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:var(--orange);color:#fff;font-weight:600;box-shadow:0 10px 24px -12px var(--orange-glow)}
.nav-btn .count{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.5}
.nav-sep{height:1px;background:rgba(255,255,255,.09);margin:12px 10px}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.1);padding:18px 20px;font-size:11.5px;color:rgba(255,255,255,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-height:70px;
  background:rgba(246,245,243,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:0 26px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-size:14.5px;font-family:var(--display);letter-spacing:-.2px}
.topbar .title span{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px}
.content{padding:26px;max-width:1600px;width:100%;animation:rise .5s ease both}
.hamburger{display:none}

/* ---------- shared ---------- */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-faint);margin:0}
.page-head{margin-bottom:22px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  border:1px solid var(--card-border);border-radius:var(--r-lg);padding:26px 30px;
  box-shadow:0 1px 2px rgba(11,24,41,.04)}
.page-head h1{margin:10px 0 6px;font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.page-head p.desc{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.data-panel{overflow:hidden;border:1px solid var(--card-border);border-radius:var(--r-lg);background:var(--card);
  box-shadow:0 1px 2px rgba(11,24,41,.04);margin-bottom:22px}
.panel-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding:22px 26px}
.panel-title{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.4px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.metric-card{min-height:142px;border:1px solid var(--card-border);border-radius:var(--r-lg);padding:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  box-shadow:0 1px 2px rgba(11,24,41,.04);position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1)}
.metric-card:hover{transform:translateY(-4px);box-shadow:0 1px 2px rgba(11,24,41,.04),0 28px 54px -24px rgba(11,24,41,.18)}
.metric-card.dark{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff}
.metric-card.dark:hover{box-shadow:0 36px 70px -20px var(--navy-glow)}
.metric-card.red{border-color:transparent;background:linear-gradient(155deg,#F1544C 0%,var(--orange-deep) 100%);color:#fff}
.metric-card.red:hover{box-shadow:0 36px 70px -20px var(--orange-glow)}
.metric-card.dark::after,.metric-card.red::after{content:"";position:absolute;top:-40%;right:-20%;width:70%;height:70%;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);pointer-events:none}
.metric-card .lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:0}
.metric-card .val{margin:20px 0 0;font-size:30px;font-weight:700;letter-spacing:-1.2px}
.metric-card .note{margin:8px 0 0;font-size:12.5px;opacity:.62}
.two-col{display:grid;grid-template-columns:1.45fr .75fr;gap:22px}
.weight-total-card{border:1px solid var(--card-border);border-radius:var(--r-md);background:var(--card);padding:16px 18px}
.weight-total-card span{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint)}
.weight-total-card strong{display:block;margin-top:9px;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.5px}
.weight-total-card.actual{border-color:transparent;background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%)}
.weight-total-card.actual span{color:rgba(255,255,255,.5)}
.weight-total-card.actual strong{color:#fff}
.weight-total-card.diff-up{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06)}
.weight-total-card.diff-up strong{color:var(--bad)}
.weight-total-card.diff-ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.07)}
.weight-total-card.diff-ok strong{color:var(--ok)}
.totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--card-border);background:var(--card);
  color:var(--ink);padding:9px 17px;border-radius:var(--r-pill);cursor:pointer;font-size:12.5px;font-weight:600;
  white-space:nowrap;transition:background .2s,box-shadow .25s,transform .25s}
.btn:hover{background:#fff;box-shadow:0 8px 20px -10px rgba(11,24,41,.3);transform:translateY(-1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--orange);border-color:var(--orange);box-shadow:0 10px 24px -8px var(--orange-glow)}
.btn.green{border-color:rgba(29,170,92,.35);color:var(--ok)}
.btn.green:hover{background:rgba(29,170,92,.07)}
.btn.icon{padding:8px 11px;font-size:13px;line-height:1;border-radius:var(--r-sm)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger{color:var(--bad);border-color:rgba(229,50,45,.28)}
.btn.danger:hover{background:rgba(229,50,45,.06)}
label.field{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;margin-top:8px;border:1px solid var(--card-border);border-radius:var(--r-sm);padding:10px 13px;
  background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(229,50,45,.14)}
textarea{min-height:80px;resize:vertical}
.search-wrap{position:relative;max-width:320px;width:100%}
.search-wrap input{margin-top:0;padding-left:34px;border-radius:var(--r-pill);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--glass-border)}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:16px}

/* ---------- tables ---------- */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:rgba(17,17,17,.025);text-align:left;font-weight:700;color:var(--ink-soft);padding:13px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:1.4px}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(17,17,17,.018)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.empty-row td{text-align:center;color:var(--ink-faint);padding:52px 16px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:var(--r-pill);padding:4px 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px}
.badge.ok{border-color:rgba(29,170,92,.3);background:rgba(29,170,92,.08);color:var(--ok)}
.badge.warn{border-color:rgba(180,83,9,.28);background:rgba(180,83,9,.07);color:var(--warn)}
.badge.bad{border-color:rgba(229,50,45,.28);background:rgba(229,50,45,.06);color:var(--bad)}
.badge.neutral{border-color:var(--card-border);background:rgba(17,17,17,.035);color:var(--ink-soft)}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px;border-bottom:1px solid var(--line)}
.po-block{grid-column:1/-1;border:1px solid var(--card-border);background:rgba(17,17,17,.018);padding:20px;border-radius:var(--r-md)}
.po-row{display:grid;grid-template-columns:1fr 14rem auto;gap:14px;align-items:end;background:var(--card);
  border:1px solid var(--card-border);padding:16px;border-radius:var(--r-sm);margin-bottom:10px}
.form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);
  background:rgba(17,17,17,.018);padding:20px 26px}
.item-table-wrap{border:1px solid var(--card-border);border-radius:var(--r-md);overflow-x:auto}
.item-table input,.item-table select{margin-top:0;font-size:12.5px;padding:8px 10px}
.item-table td{vertical-align:top}
.progress{height:7px;background:rgba(17,17,17,.07);border-radius:var(--r-pill);overflow:hidden;margin-top:9px}
.progress > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--orange)}
.progress.dark > i{background:var(--ink)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;padding:32px 20px;z-index:60}
.modal-back.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:46rem;
  box-shadow:0 40px 90px -24px rgba(11,24,41,.4);animation:rise .3s ease both;
  display:flex;flex-direction:column;max-height:calc(100vh - 64px)}
.modal.wide{max-width:66rem}
.modal > form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-head{padding:28px 28px 8px;flex:0 0 auto}
.modal-head h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px}
.modal-head p{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.6}
.modal-body{padding:20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px;
  overflow-y:auto;flex:1 1 auto;min-height:0}
.modal-body.single{display:block}
.modal-body .full{grid-column:1/-1}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:18px 28px;
  border-top:1px solid var(--line);background:var(--card);flex:0 0 auto;
  border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ---------- attachments ---------- */
.attach-box{border:1px dashed var(--card-border);border-radius:var(--r-md);background:rgba(17,17,17,.02);
  height:132px;display:grid;place-items:center;overflow:hidden}
.attach-img{width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in}
.attach-empty{margin:0;font-size:12px;color:var(--ink-faint)}
.attach-file{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;padding:0 14px}
.attach-file i{font-style:normal;color:var(--orange)}
.attach-name{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:42px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--card-border);
  background:#fff;cursor:zoom-in;display:block}
.thumb-none{font-size:11px;color:var(--ink-faint)}
#lightbox{position:fixed;inset:0;background:rgba(17,17,17,.86);z-index:120;display:none;
  align-items:center;justify-content:center;padding:32px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-md);background:#fff}

/* ---------- toast ---------- */
#toasts{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--ink);
  box-shadow:0 20px 44px -18px rgba(11,24,41,.34);padding:14px 18px;font-size:13px;min-width:260px;max-width:370px;
  border-radius:var(--r-sm);animation:rise .3s ease both}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--ink)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(170deg,#1c1c1c 0%,var(--navy-deep) 100%);color:#fff;
  z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);color:var(--ink);width:100%;max-width:432px;border-radius:var(--r-lg);
  overflow:hidden;box-shadow:0 44px 100px -28px rgba(0,0,0,.6);animation:rise .4s ease both}
#gate .box-head{background:linear-gradient(155deg,#2E2E2E 0%,var(--navy-deep) 100%);color:#fff;padding:24px;
  display:flex;align-items:center;gap:12px}
#gate .box-head .logo-box{width:38px;height:38px;font-size:17px}
#gate .box-head .brand-logo{height:24px}
#gate .box-head b{display:block;font-size:13.5px;letter-spacing:-.2px;font-family:var(--display)}
#gate .box-head span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:600;color:var(--orange)}
#gate .box-body{padding:28px}
#gate .box-body h2{margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-.5px}
#gate .box-body p.sub{margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);line-height:1.65}
#gate label.field{margin-bottom:16px;display:block}
#gate .err{background:rgba(229,50,45,.06);border:1px solid rgba(229,50,45,.24);border-radius:var(--r-sm);
  color:var(--bad);padding:13px 15px;font-size:13px;line-height:1.6;margin-bottom:18px;display:none}
#gate .err.show{display:block}
#gate ol{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.85;color:var(--ink-soft)}
#gate code{background:rgba(17,17,17,.05);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
.user-chip{font-size:11.5px;color:rgba(255,255,255,.7);word-break:break-all}

@media print{
  .sidebar, .topbar, .page-head, footer, #toasts, .modal-back, .btn, .search-wrap{display:none !important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .data-panel{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .metric-card{box-shadow:none;border:1px solid #ccc;background:#fff !important;color:#111 !important;min-height:0}
  .metric-card::after{display:none}
  thead th{background:#f2f2f2 !important}
}

/* ---------- responsive ---------- */
@media(max-width:1100px){.two-col{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}.totals-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:70}
  .sidebar.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.4)}
  .hamburger{display:inline-flex}
  .form-grid{grid-template-columns:1fr}
  .po-row{grid-template-columns:1fr}
  .modal-body{grid-template-columns:1fr}
  .topbar .title span{display:none}
  .content{padding:16px}
  .page-head{padding:20px 22px}
  .page-head h1{font-size:22px}
  .metric-card{padding:20px;min-height:126px}
  .metric-card .val{font-size:25px}
}
</style>
</head>
<body>

<!-- ============ LOGIN / CONFIG GATE ============ -->
<div id="gate">

  async list(c) {

    return snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  },
  async create(c, docData) {
    const now = new Date().toISOString();
    const body = { ...docData, createdAt: now, updatedAt: now, changedBy: authUser() };
    delete body.id;
    const ref = await addDoc(fsCollection(db, FS_NAME[c]), body);
    return { ...body, id: ref.id };
  },
  async update(c, id, patch) {
    const now = new Date().toISOString();
    const body = { ...patch, updatedAt: now, changedBy: authUser() };
    delete body.id;
    await updateDoc(fsDoc(db, FS_NAME[c], id), body);
    return { ...body, id };
  },
  async remove(c, id) {
    await deleteDoc(fsDoc(db, FS_NAME[c], id));
  }
};

const LocalAdapter = {
  name: 'Local test storage',
  async list(c) { try { return JSON.parse(localStorage.getItem('jayco_' + c) || '[]'); } catch { return []; } },
  async create(c, d) {
    const rows = await this.list(c);
    d.id = d.id || uid(); d.createdAt = new Date().toISOString(); d.updatedAt = d.createdAt;
    rows.unshift(d); localStorage.setItem('jayco_' + c, JSON.stringify(rows)); return d;
  },
  async update(c, id, patch) {
    const rows = await this.list(c);
    const i = rows.findIndex(r => String(r.id) === String(id));
    if (i < 0) throw new Error('Record not found.');
    rows[i] = { ...rows[i], ...patch, id: rows[i].id, updatedAt: new Date().toISOString() };
    localStorage.setItem('jayco_' + c, JSON.stringify(rows)); return rows[i];
  },
  async remove(c, id) {
    const rows = (await this.list(c)).filter(r => String(r.id) !== String(id));
    localStorage.setItem('jayco_' + c, JSON.stringify(rows));
  }
};

/* ---- P/O fulfilment ----------------------------------------------------
   A challan lists the JAYCO P/O numbers it was received against. Matching a
   challan line to a P/O line on P/O number + item + type gives the quantity
   received so far, and therefore what is still pending.                    */
function receivedFor(poNumber, itemName, itemType){
  let qty = 0, wt = 0;
  for(const c of state.challans){
    const nums = getPOs(c).map(x => String(x.purchaseOrderNumber).trim());
    if(!nums.includes(String(poNumber).trim())) continue;
    for(const i of c.items){
      if(i.itemName === itemName && i.itemType === itemType){
        qty += num(i.quantity); wt += num(i.actualTotalWeight);
      }
    }
  }
  return {qty, wt};
}

function poProgress(po){
  const lines = po.items.map(it => {
    const got = receivedFor(po.poNumber, it.itemName, it.itemType);
    const ordered = num(it.quantity);
    const received = Math.min(got.qty, ordered * 5);   // guard against runaway data
    return {...it, ordered, received, pending: Math.max(0, ordered - received), receivedWeight: got.wt};
  });
  const ordered  = lines.reduce((a,l) => a + l.ordered, 0);
  const received = lines.reduce((a,l) => a + Math.min(l.received, l.ordered), 0);
  const pending  = Math.max(0, ordered - received);
  const pendingWeight = lines.reduce((a,l) => a + l.pending * num(l.avgWeight), 0);
  const stage = received === 0 ? 'Open' : (pending === 0 ? 'Completed' : 'Partially received');
  const pct = ordered > 0 ? Math.round(received / ordered * 100) : 0;
  return {lines, ordered, received, pending, pendingWeight, stage, pct};
}

function stageBadge(stage){
  const cls = stage === 'Completed' ? 'ok' : (stage === 'Open' ? 'neutral' : 'warn');

/* Attachments are stored inside the Firestore document as compressed
   data URLs. Firestore caps a document at 1 MiB, so each image is
   shrunk until it fits a 320 KB budget. Held here while the modal is open. */
const IMAGE_BUDGET = 280000;   // ~205 KB of actual JPG
const PDF_BUDGET   = 560000;   // ~410 KB of actual PDF
const DOC_BUDGET   = 900000;   // both together, under Firestore's 1 MiB record cap
let pendingAttach = {drawingPdf:'', drawingPdfName:'', patternPhoto:''};

function readAsDataUrl(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('That file could not be read.'));
    r.readAsDataURL(file);
  });
}

async function loadPdf(file){
  if(file.type !== 'application/pdf')
    throw new Error('The drawing must be a PDF file.');
  const data = await readAsDataUrl(file);
  if(data.length > PDF_BUDGET)
    throw new Error('That PDF is ' + Math.round(file.size/1024) + ' KB. The limit is about 400 KB because the whole record must fit in 1 MB. Export it at lower resolution, or split it.');
  return data;
}

/* data: URLs cannot be opened directly by the browser, so convert to a blob */
function openAttachment(dataUrl, name){
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], {type: mime}));
  window.open(url, '_blank', 'noopener');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function compressImage(file){
  if(!file.type.startsWith('image/'))
    throw new Error('The image must be a JPG or PNG.');
  const bmp = await createImageBitmap(file);
  let dim = 1400, q = 0.75, out = '';
  for(let pass = 0; pass < 7; pass++){
    const scale = Math.min(1, dim / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
    cx.drawImage(bmp, 0, 0, w, h);
    out = cv.toDataURL('image/jpeg', q);
    if(out.length <= IMAGE_BUDGET) return out;
    if(q > 0.45) q -= 0.1; else dim = Math.round(dim * 0.75);
  }
  throw new Error('That image is too large even after compression. Crop it or use a smaller photo.');
}
/* Built-ins first, then any Active types from Type Master, de-duplicated. */
/* A pattern is the same pattern if name, type, material and construction match.
   Compared case- and space-insensitively so "SN 511" and "sn511" collide.     */
function patternKey(r){
  const n = t => String(t ?? '').trim().toLowerCase().replace(/\s+/g,' ');
  return [n(r.itemName), n(r.itemType), n(r.patternMaterial), n(r.patternConstruction)].join(' | ');
}
function findPatternDuplicates(){
  const groups = new Map();
  for(const r of state.castingMasters){
    const k = patternKey(r);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  /* keep the one with a drawing or photo, else the oldest */
  const score = r => (r.drawingPdf ? 2 : 0) + (r.patternPhoto ? 2 : 0);
  return [...groups.values()].filter(g => g.length > 1).map(g => {
    const sorted = [...g].sort((a,b) =>
      score(b) - score(a) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    return {keep: sorted[0], remove: sorted.slice(1)};
  });
}

/* A pattern is the same pattern if name, type, material and construction all
   match. Case and spacing are ignored so "SN 511" and "sn  511" collide.      */
function patternKey(r){
  return [r.itemName, r.itemType, r.patternMaterial, r.patternConstruction]
    .map(v => String(v ?? '').trim().toLowerCase().replace(/\s+/g,' '))
    .join(' | ');
}
function findDuplicateGroups(){
  const map = new Map();
  for(const m of state.castingMasters){
    const k = patternKey(m);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(m);
  }
  return [...map.entries()]
    .filter(([, rows]) => rows.length > 1)
    .map(([k, rows]) => ({
      key: k,
      /* keep the oldest — it is the one other records were built against */
      rows: rows.sort((a,b) => String(a.createdAt||'').localeCompare(String(b.createdAt||'')))
    }));
}

async function loadAll(notify){
  /* Each collection is read on its own. If one is refused — usually a Firestore
     rule that has not been published yet — only that feature is empty, and the
     message names the collection instead of blanking the whole app. */
  const results = await Promise.all(COLLECTIONS.map(async c => {
    try { return {c, rows: await DB.list(c)}; }
    catch(err){ return {c, rows: [], err}; }
  }));
  const get = c => (results.find(r => r.c === c) || {rows: []}).rows;
  const failed = results.filter(r => r.err);

  state.challans       = get('casting_challans').map(c => ({...c, items: c.items || [], purchaseOrders: c.purchaseOrders || []}));
  state.patternMasters = get('pattern_masters');
  state.castingMasters = get('casting_masters');
  state.castingTypes   = get('casting_types');
  state.patternRecords = get('control_records').filter(r => r.module === 'patterns');
  state.purchaseOrders = get('purchase_orders').map(x => ({...x, items: x.items || []}));
  state.foundries      = get('foundries');
  state.pigIron        = get('pig_iron');

  const badge = document.getElementById('pg-status');
  if(failed.length){
    badge.className = 'badge bad';
    badge.textContent = '● ' + failed.length + ' collection' + (failed.length === 1 ? '' : 's') + ' unavailable';
    const names = failed.map(f => FS_NAME[f.c]).join(', ');
    const denied = failed.some(f => String(f.err && f.err.code).includes('permission-denied'));
    toast(denied
      ? 'Firestore is refusing: ' + names + '. Add a rule for ' + (failed.length === 1 ? 'it' : 'them') + ' and publish.'
      : 'Could not load: ' + names, 'error');
  } else {
    badge.className = 'badge ok';
    badge.textContent = '● Live data';
    if(notify) toast('Dashboard refreshed','success');
  }
  render();
}

/* ---- Duplicate cleanup ------------------------------------------------
   Groups patterns that share name + type + material + construction, keeps
   the oldest of each group and deletes the rest. Shows exactly what will go
   before anything is removed, and never touches a group of one.
   -------------------------------------------------------------------- */
function previewDuplicates(){
  const groups = findDuplicateGroups();
  if(!groups.length) return toast('No duplicates found — every pattern is unique.','success');

  const toDelete = groups.flatMap(g => g.rows.slice(1));
  window.__dupQueue = toDelete;

  openModal(`<div class="modal-head">
      <h3>${toDelete.length} duplicate${toDelete.length===1?'':'s'} to remove</h3>
      <p>${groups.length} pattern${groups.length===1?'':'s'} appear more than once. The oldest of each is kept, the rest are deleted. Nothing is removed until you confirm.</p>
    </div>
    <div style="padding:0 28px;overflow-y:auto;flex:1 1 auto;min-height:0">
      <div class="table-scroll" style="border:1px solid var(--card-border);border-radius:var(--r-md)">
        <table><thead><tr><th>Pattern name</th><th>Type</th><th>Material</th><th>Construction</th><th>Created by</th><th>Action</th></tr></thead>
        <tbody>${ groups.slice(0,80).map(g => g.rows.map((r,i)=>`<tr style="${i?'':'background:rgba(29,170,92,.05)'}">
          <td><b>${esc(r.itemName)}</b></td><td>${esc(r.itemType)}</td>
          <td>${esc(r.patternMaterial)||'—'}</td><td>${esc(r.patternConstruction)||'—'}</td>
          <td>${esc(r.createdBy || r.changedBy)||'—'}</td>
          <td>${ i === 0 ? '<span class="badge ok">Keep</span>' : '<span class="badge bad">Delete</span>' }</td>
        </tr>`).join('')).join('') }</tbody></table>
      </div>
      ${ groups.length > 80 ? `<p style="margin:12px 0 0;font-size:12px;color:var(--ink-faint)">Showing the first 80 groups. All ${toDelete.length} duplicates will be removed.</p>` : '' }
      <div style="margin-top:14px;border-left:3px solid var(--orange);background:rgba(229,50,45,.05);padding:14px 16px;font-size:13px;line-height:1.6">
        Deleting cannot be undone. Challans and purchase orders reference patterns by name, so they are unaffected — but check the list before confirming.
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="button" class="btn primary" id="btn-dupes-confirm">Delete ${toDelete.length} duplicate${toDelete.length===1?'':'s'}</button>
    </div>`, true);
}

async function runDuplicateCleanup(){
  const queue = window.__dupQueue || [];
  if(!queue.length) return;
  const btn = document.getElementById('btn-dupes-confirm');
  btn.disabled = true;
  let done = 0, failed = 0;
  for(const r of queue){
    btn.textContent = 'Deleting ' + (done + 1) + ' of ' + queue.length + '…';
    try{ await DB.remove('casting_masters', r.id); done++; }
    catch(err){ failed++; }
  }
  window.__dupQueue = [];
  closeModal();
  toast(failed ? `Deleted ${done}, ${failed} failed.` : `Deleted ${done} duplicate pattern${done===1?'':'s'}.`,
        failed ? 'error' : 'success');
  await loadAll();
}

/* Full JSON copy of every collection. Firestore has no automatic backup on the
   free plan, so this is the only way back if a bulk delete goes wrong. */
async function downloadBackup(){
  const btn = document.getElementById('btn-backup');
  if(btn){ btn.disabled = true; btn.textContent = 'Reading…'; }
  try{
    const dump = {exportedAt: new Date().toISOString(), project: firebaseConfig.projectId};
    for(const c of COLLECTIONS){
      try { dump[c] = await DB.list(c); } catch(err){ dump[c] = []; }
    }
    const counts = COLLECTIONS.map(c => c + ': ' + dump[c].length).join(', ');
    const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'JAYCO-casting-backup-' + today() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    toast('Backup downloaded — ' + counts, 'success');
  }catch(err){
    toast('Backup failed: ' + (err.message || err), 'error');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Backup all data'; }
  }
}

document.addEventListener('click', e => {
  if(e.target.closest('#btn-backup'))        downloadBackup();
  if(e.target.closest('#btn-find-dupes'))    previewDuplicates();
  if(e.target.closest('#btn-dupes-confirm')) runDuplicateCleanup();
});

/* ---- Pig Iron Bank ----------------------------------------------------
   Three movements:
     Receipt  client  -> JAYCO      (+ JAYCO stock)
     Issue    JAYCO   -> foundry    (- JAYCO stock, + that foundry's holding)
     Casting  foundry -> JAYCO      (- that foundry's holding), taken straight
                                     from closed challans, never keyed by hand.
   -------------------------------------------------------------------- */

function pigLedger(){
  const rows = [];
  for(const r of state.pigIron){
    rows.push({
      date: r.date, kind: r.kind,
      party: r.kind === 'Receipt' ? (r.clientName || '—') : (r.foundryName || '—'),
      weight: num(r.weight),
      ref: r.kind === 'Receipt' ? (r.ewayBill || '') : [r.labourBill, r.ewayBill].filter(Boolean).join(' / '),
      notes: r.notes || '', id: r.id, source: 'manual'
    });
  }
  /* castings coming back consume the pig iron sitting at that foundry */
  for(const c of state.challans){
    rows.push({
      date: c.challanDate, kind: 'Casting received',
      party: c.foundryName || '—',
      weight: num(c.actualTotalWeight),
      ref: 'Challan ' + (c.challanNumber || ''),
      notes: c.items.map(i => i.itemName).join(', '),
      id: c.id, source: 'challan'
    });
  }
  rows.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.kind).localeCompare(String(b.kind)));

  let stock = 0;
  for(const r of rows){
    if(r.kind === 'Receipt') stock += r.weight;
    else if(r.kind === 'Issue') stock -= r.weight;
    r.stock = stock;              // pig iron physically at JAYCO
  }
  return rows;
}

function pigTotals(){
  const received = state.pigIron.filter(r => r.kind === 'Receipt').reduce((a, r) => a + num(r.weight), 0);
  const issued   = state.pigIron.filter(r => r.kind === 'Issue').reduce((a, r) => a + num(r.weight), 0);
  const returned = state.challans.reduce((a, c) => a + num(c.actualTotalWeight), 0);
  return {received, issued, returned, atJayco: received - issued, atFoundries: issued - returned};
}

/* how much pig iron each foundry is still holding */
function pigByFoundry(){
  const map = new Map();
  const bump = (name, field, v) => {
    if(!name) return;
    const e = map.get(name) || {name, issued:0, returned:0};
    e[field] += v; map.set(name, e);
  };
  state.pigIron.filter(r => r.kind === 'Issue').forEach(r => bump(r.foundryName, 'issued', num(r.weight)));
  state.challans.forEach(c => bump(c.foundryName, 'returned', num(c.actualTotalWeight)));
  return [...map.values()]
    .map(e => ({...e, balance: e.issued - e.returned}))
    .sort((a, b) => b.balance - a.balance);
}

                 refNo:(data.refNo||'').trim(), notes:(data.notes||'').trim()};

/* ---- Generate P/O ---- */
/* Approx weight per piece is derived from YOUR OWN closed challans:
   total JAYCO weight received for that item / total pieces received.   */
function avgWeightFor(itemName){
  let qty = 0, wt = 0;
  for(const c of state.challans)
    for(const i of c.items)
      if(i.itemName === itemName){ qty += num(i.quantity); wt += num(i.actualTotalWeight); }
  return qty > 0 ? {avg: wt/qty, qty, source: 'challans'} : {avg: 0, qty: 0, source: 'none'};
}

          <tbody>${ f.items.map((it,i)=>{
            const qty = num(it.quantity);

            const known = masters.some(m=>m.itemCode===it.masterCode);
            return `<tr>
              <td><div style="display:flex;gap:.4rem">
                <select data-item="${i}" data-field="masterCode" required style="flex:1">

                  ${masters.map(m=>`<option value="${esc(m.itemCode)}" ${m.itemCode===it.masterCode?'selected':''}>${esc(m.itemName)}</option>`).join('')}
                </select>
                <button type="button" class="btn icon" data-quick-add="${i}" title="Add a new pattern to Pattern Master">＋</button>
              </div></td>
              <td><select data-item="${i}" data-field="itemType">
                ${!typeOptions.includes(it.itemType) && it.itemType ? `<option value="${esc(it.itemType)}" selected>${esc(it.itemType)}</option>` : ''}

              <td><select data-item="${i}" data-field="material">${opt(MATERIALS, it.material)}</select></td>
              <td><input type="number" min="1" required class="num" data-item="${i}" data-field="quantity" value="${esc(it.quantity)}" placeholder="0" style="text-align:right"></td>

              <td class="num"><b>${it.actualWeight && qty>0 ? fmtWt(avg) : '—'}</b></td>
              <td><button type="button" class="btn icon danger" data-rm-item="${i}" ${f.items.length===1?'disabled':''}>🗑</button></td>
            </tr>`; }).join('') }
          </tbody></table></div>

        <div class="totals-grid">
          <div class="weight-total-card"><span>Total Quantity</span><strong>${totals.quantity}</strong></div>
          <div class="weight-total-card"><span>Foundry Total Weight</span><strong>${fwComplete?fmtWt(totals.foundry):'—'}</strong></div>

          <div class="weight-total-card ${fwComplete && diff>0 ? 'diff-up':'diff-ok'}"><span>Weight Difference</span><strong>${fwComplete?fmtWt(diff):'—'}</strong></div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" data-go="casting-records">Cancel</button>
        <button type="button" class="btn" id="form-pdf">⬇ PDF</button>
        <button type="button" class="btn green" id="form-wa">✆ WhatsApp</button>
        <button type="button" id="btn-close-challan" class="btn primary">🔒 ${editing?'Update &amp; Close Challan':'Close Challan'}</button>
      </div>
    </form></section>`;
}

/* Casting inward challan — same light, print-economical layout as the P/O. */
function buildChallanPdf(c){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 40, CW = W - M*2, rx = W - M;
  const INK=[26,26,26], MUT=[128,133,138], LINE=[214,218,221], RED=[206,42,38], SOFT=[247,248,249];
  const fc = foundryComplete(c), pos = getPOs(c);
  const diff = num(c.actualTotalWeight) - num(c.foundryTotalWeight);

  const fit = (text, maxW, size, style='normal') => {
    let sz = size; doc.setFont('helvetica', style); doc.setFontSize(sz);
    let t = String(text ?? '—');
    while(sz > 6 && doc.getTextWidth(t) > maxW){ sz -= 0.5; doc.setFontSize(sz); }
    while(t.length > 4 && doc.getTextWidth(t) > maxW) t = t.slice(0, -2) + '…';
    return t;
  };
  const label = (txt, x, y, align) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(6.2); doc.setTextColor(...MUT);
    doc.text(txt, x, y, align ? {align} : undefined);
  };

  /* letterhead */
  let y = 46, logoDrawn = false;
  try{
    const logo = document.querySelector('.brand-logo');
    if(logo && logo.src){ doc.addImage(logo.src, 'PNG', M, y - 18, 100, 22); logoDrawn = true; }
  }catch(e){ logoDrawn = false; }
  if(!logoDrawn){ doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(...RED); doc.text('JAYCO', M, y); }

  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
  doc.text(COMPANY.name, M, y + 22);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...RED);
  doc.text(COMPANY.tagline, M, y + 33);
  doc.setTextColor(...MUT); doc.setFontSize(7.2);
  doc.text([COMPANY.addr1, COMPANY.addr2, COMPANY.addr3], M, y + 45, {lineHeightFactor:1.4});

  let ry = y - 12;
  [['GSTIN', COMPANY.gstin], ['PAN', COMPANY.pan], ['PHONE', COMPANY.phone], ['WEB', COMPANY.web]]
  .forEach(([k, v]) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...INK);
    const vw = doc.getTextWidth(v);
    doc.text(v, rx, ry, {align:'right'});
    label(k, rx - vw - 8, ry, 'right');
    ry += 15;
  });

  y += 82;
  doc.setDrawColor(...RED); doc.setLineWidth(1.4); doc.line(M, y, W - M, y);
  doc.setLineWidth(0.6);

  /* title + meta */
  y += 30;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text('CASTING INWARD CHALLAN', M, y);

  y += 14;
  const bw = (CW - 20) / 3, bh = 44;
  [['CHALLAN NO.', c.challanNumber], ['CHALLAN DATE', fmtDate(c.challanDate)], ['FOUNDRY NAME', c.foundryName]]
  .forEach(([k, v], n) => {
    const x = M + n * (bw + 10);
    doc.setDrawColor(...LINE); doc.setFillColor(...SOFT);
    doc.roundedRect(x, y, bw, bh, 3, 3, 'FD');
    label(k, x + 12, y + 16);
    doc.setTextColor(...INK);
    doc.text(fit(v, bw - 24, 11.5, 'bold'), x + 12, y + 33);
  });

  /* purchase orders */
  y += bh + 14;
  const pw = (CW - 20) / 3;
  pos.slice(0, 6).forEach((po, n) => {
    const col = n % 3, row = Math.floor(n / 3);
    const x = M + col * (pw + 10), yy = y + row * 40;
    doc.setDrawColor(...LINE);
    doc.roundedRect(x, yy, pw, 34, 3, 3, 'S');
    label('JAYCO P/O ' + (n + 1), x + 12, yy + 13);
    doc.setTextColor(...INK);
    doc.text(fit(po.purchaseOrderNumber, pw - 80, 9.5, 'bold'), x + 12, yy + 26);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...MUT);
    doc.text(fmtDate(po.purchaseOrderDate), x + pw - 12, yy + 26, {align:'right'});
  });
  y += Math.ceil(Math.max(1, pos.length) / 3) * 40 + 8;

  /* items */
  doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(...RED);
  doc.text('AVERAGE WEIGHT/PC = JAYCO WEIGHT ÷ QTY. JAYCO WEIGHT IS THE VERIFIED WEIGHT ON RECEIPT.', M, y);

  doc.autoTable({
    startY: y + 8,
    margin: {left: M, right: M},
    head: [['SR','CASTING ITEM','TYPE','MATERIAL','QTY','FOUNDRY WT','JAYCO WT','AVG WT/PC']],
    body: c.items.map((i, n) => [
      n + 1, i.itemName, i.itemType, i.material, num(i.quantity),
      num(i.foundryTotalWeight) > 0 ? fmtWt(i.foundryTotalWeight) : '—',
      fmtWt(i.actualTotalWeight),
      num(i.quantity) > 0 ? fmtWt(num(i.actualTotalWeight) / num(i.quantity)) : '—'
    ]),
    styles: {fontSize: 8, cellPadding: 6.5, lineColor: LINE, lineWidth: 0.5, textColor: INK, overflow:'linebreak'},
    headStyles: {fillColor: SOFT, textColor: MUT, fontStyle:'bold', fontSize: 6.2,
                 halign:'center', cellPadding: 7, lineColor: LINE, lineWidth: 0.5},
    columnStyles: {
      0:{halign:'center', cellWidth:24}, 1:{cellWidth:118}, 2:{cellWidth:52}, 3:{cellWidth:56},
      4:{halign:'right', cellWidth:34}, 5:{halign:'right'}, 6:{halign:'right', fontStyle:'bold'}, 7:{halign:'right'}
    }
  });

  /* totals */
  y = doc.lastAutoTable.finalY + 16;
  const tW = 178;
  doc.setDrawColor(...LINE);
  doc.roundedRect(M, y, CW - tW - 10, 44, 3, 3, 'S');
  label('TOTAL QUANTITY', M + 14, y + 16);
  label('FOUNDRY TOTAL', M + 108, y + 16);
  label('DIFFERENCE', M + 216, y + 16);
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
  doc.text(String(num(c.totalQuantity)), M + 14, y + 34);
  doc.text(fc ? fmtWt(c.foundryTotalWeight) : '—', M + 108, y + 34);
  doc.setTextColor(...(fc && diff > 0 ? RED : [21,128,61]));
  doc.text(fc ? fmtWt(diff) : '—', M + 216, y + 34);

  doc.setDrawColor(...RED); doc.setLineWidth(1);
  doc.roundedRect(W - M - tW, y, tW, 44, 3, 3, 'S');
  doc.setLineWidth(0.6);
  label('JAYCO TOTAL WEIGHT', W - M - tW + 14, y + 16);
  doc.setFont('helvetica','bold'); doc.setTextColor(...RED);
  doc.text(fit(fmtWt(c.actualTotalWeight), tW - 28, 14, 'bold'), W - M - tW + 14, y + 34);

  /* signatures */
  const py = Math.max(y + 60, H - 160);
  doc.setDrawColor(...LINE);
  doc.roundedRect(M, py, CW, 92, 3, 3, 'S');
  doc.line(M, py + 20, W - M, py + 20);
  label('VERIFICATION', M + 14, py + 14);
  const colW = CW / 3;
  [['RECEIVED BY', c.changedBy || ''], ['CHECKED BY', ''], ['AUTHORISED SIGNATORY', '']]
  .forEach(([k, v], n) => {
    const x = M + n * colW;
    if(n){ doc.setDrawColor(...LINE); doc.line(x, py + 20, x, py + 92); }
    if(v){ doc.setTextColor(...INK); doc.text(fit(v, colW - 32, 10.5, 'bold'), x + 16, py + 58); }
    doc.setDrawColor(175,180,185);
    doc.line(x + 16, py + 64, x + colW - 16, py + 64);
    label(k, x + 16, py + 78);
  });

  /* footer */
  doc.setDrawColor(...LINE);
  doc.line(M, H - 44, W - M, H - 44);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.4); doc.setTextColor(...MUT);

/* Build a challan object from the current entry form (with validation) */
function currentFormChallan(){
  const f = state.entryForm;
  const items = f.items.map(i=>{
    const qty = num(i.quantity), fw = num(i.foundryWeight), aw = num(i.actualWeight);
    return {itemName:i.itemName, itemType:i.itemType, material:i.material, quantity:qty,
            foundryWeight:fw, actualWeight:aw, foundryTotalWeight:fw, actualTotalWeight:aw};
  });
  const bad = !f.challanNumber.trim() || !f.challanDate || !f.foundryName.trim()
    || !f.purchaseOrders.length
    || f.purchaseOrders.some(p=>!p.purchaseOrderNumber.trim() || !p.purchaseOrderDate)
    || items.some(i=>!i.itemName || !i.itemType || !i.material || i.quantity<=0 || i.actualWeight<=0);
  if(bad){ toast('Complete the challan, JAYCO P/O, item, quantity and JAYCO weight fields first. Foundry weight is optional.','error'); return null; }
  return {
    id: state.editingChallanId || 'draft',
    challanNumber: f.challanNumber, challanDate: f.challanDate, foundryName: f.foundryName,
    purchaseOrderNumber: f.purchaseOrders[0].purchaseOrderNumber,
    purchaseOrderDate: f.purchaseOrders[0].purchaseOrderDate,
    purchaseOrders: f.purchaseOrders, status: state.editingChallanId ? 'Closed' : 'Draft',
    totalQuantity: items.reduce((s,i)=>s+i.quantity,0),
    foundryTotalWeight: items.reduce((s,i)=>s+i.foundryTotalWeight,0),
    actualTotalWeight: items.reduce((s,i)=>s+i.actualTotalWeight,0),
    items
  };
}

/* ---- P/O document ---- */
function currentFormPo(){
  const f = state.poForm;
  const items = f.items.map(i=>{
    const qty = num(i.quantity), w = avgWeightFor(i.itemName);
    return {masterCode:i.masterCode, itemName:i.itemName, itemType:i.itemType,
            quantity:qty, avgWeight:w.avg, approxWeight:qty*w.avg, weightSource:w.source};
  });
  const form = document.getElementById('po-form');
  const bad = (name, msg) => { if(form) fieldError(form, name, msg); else toast(msg,'error'); return null; };
  if(!f.poNumber.trim())            return bad('poNumber', 'P/O No. is required.');
  if(!f.poDate)                     return bad('poDate', 'P/O Date is required.');
  if(!f.foundryName.trim())         return bad('foundryName', 'Foundry Name is required.');
  if(!(f.generatedBy||'').trim())   return bad('generatedBy', 'Purchase Order Generated By is required — the order cannot be closed unauthorised.');
  if(items.some(i=>!i.itemName))    { toast('Every line needs a pattern selected.','error'); return null; }
  if(items.some(i=>i.quantity<=0))  { toast('Every line needs a quantity above zero.','error'); return null; }
  return {
    id: state.editingPoId || 'draft',
    poNumber: f.poNumber, poDate: f.poDate, foundryName: f.foundryName, notes: f.notes||'',
    generatedBy: f.generatedBy.trim(), status: 'Open', items,
    totalQuantity: items.reduce((s,i)=>s+i.quantity,0),
    totalApproxWeight: items.reduce((s,i)=>s+i.approxWeight,0)
  };
}

/* Light, print-economical purchase order. No large filled areas — thin rules
   and small red accents only. Every string is measured before it is drawn, so
   long values shrink or truncate instead of colliding with their neighbours. */
function buildPoPdf(p){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 40, CW = W - M*2, rx = W - M;
  const INK=[26,26,26], MUT=[128,133,138], LINE=[214,218,221], RED=[206,42,38], SOFT=[247,248,249];

  /* shrink a string until it fits, then hard-truncate as a last resort */
  const fit = (text, maxW, size, style='normal') => {
    let sz = size;
    doc.setFont('helvetica', style);
    doc.setFontSize(sz);
    let t = String(text ?? '—');
    while(sz > 6 && doc.getTextWidth(t) > maxW){ sz -= 0.5; doc.setFontSize(sz); }
    while(t.length > 4 && doc.getTextWidth(t) > maxW) t = t.slice(0, -2) + '…';
    return t;
  };
  const label = (txt, x, y, align) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(6.2); doc.setTextColor(...MUT);
    doc.text(txt, x, y, align ? {align} : undefined);
  };

  /* ---------- letterhead ---------- */
  let y = 46;
  let logoDrawn = false;
  try{
    const logo = document.querySelector('.brand-logo');
    if(logo && logo.src){ doc.addImage(logo.src, 'PNG', M, y - 18, 100, 22); logoDrawn = true; }
  }catch(e){ logoDrawn = false; }
  if(!logoDrawn){
    doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(...RED);
    doc.text('JAYCO', M, y);
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
  doc.text(COMPANY.name, M, y + 22);
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...RED);
  doc.text(COMPANY.tagline, M, y + 33);
  doc.setTextColor(...MUT); doc.setFontSize(7.2);
  doc.text([COMPANY.addr1, COMPANY.addr2, COMPANY.addr3], M, y + 45, {lineHeightFactor:1.4});

  /* right column: label sits to the LEFT of its value, positioned by measurement */
  let ry = y - 12;
  [['GSTIN', COMPANY.gstin], ['PAN', COMPANY.pan], ['PHONE', COMPANY.phone], ['WEB', COMPANY.web]]
  .forEach(([k, v]) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...INK);
    const vw = doc.getTextWidth(v);
    doc.text(v, rx, ry, {align:'right'});
    label(k, rx - vw - 8, ry, 'right');
    ry += 15;
  });

  y += 82;
  doc.setDrawColor(...RED); doc.setLineWidth(1.4); doc.line(M, y, W - M, y);
  doc.setLineWidth(0.6);

  /* ---------- title + meta boxes ---------- */
  y += 30;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text('PURCHASE ORDER', M, y);

  y += 14;
  const boxW = (CW - 20) / 3, boxH = 44;
  [['P/O NO.', p.poNumber], ['P/O DATE', fmtDate(p.poDate)], ['SUPPLIER / FOUNDRY', p.foundryName]]
  .forEach(([k, v], n) => {
    const x = M + n * (boxW + 10);
    doc.setDrawColor(...LINE); doc.setFillColor(...SOFT);
    doc.roundedRect(x, y, boxW, boxH, 3, 3, 'FD');
    label(k, x + 12, y + 16);
    const t = fit(v, boxW - 24, 11.5, 'bold');
    doc.setTextColor(...INK);
    doc.text(t, x + 12, y + 33);
  });

  /* ---------- items ---------- */
  y += boxH + 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(...RED);
  doc.text('APPROX. WEIGHT IS INDICATIVE, DERIVED FROM PREVIOUS SUPPLY RECORDS. FINAL WEIGHT ON RECEIPT.', M, y);

  doc.autoTable({
    startY: y + 8,
    margin: {left: M, right: M},
    head: [['SR', 'CASTING ITEM', 'TYPE', 'QTY', 'APPROX. WT/PC', 'APPROX. TOTAL']],
    body: p.items.map((it, n) => [
      n + 1, it.itemName, it.itemType, num(it.quantity),
      it.avgWeight > 0 ? fmtWt(it.avgWeight) : 'No history',
      it.approxWeight > 0 ? fmtWt(it.approxWeight) : '—'
    ]),
    styles: {fontSize: 8.4, cellPadding: 7, lineColor: LINE, lineWidth: 0.5, textColor: INK, overflow:'linebreak'},
    headStyles: {fillColor: SOFT, textColor: INK, fontStyle:'bold', fontSize: 6.6,
                 halign:'center', cellPadding: 8, lineColor: LINE, lineWidth: 0.5},
    columnStyles: {
      0: {halign:'center', cellWidth: 26},
      1: {cellWidth: 168},
      2: {cellWidth: 64},
      3: {halign:'right', cellWidth: 40},
      4: {halign:'right'},
      5: {halign:'right', fontStyle:'bold'}
    },
    didParseCell: d => { if(d.section === 'head') d.cell.styles.textColor = MUT; }
  });

  /* ---------- totals ---------- */
  y = doc.lastAutoTable.finalY + 16;
  const tW = 178;
  doc.setDrawColor(...LINE);
  doc.roundedRect(M, y, CW - tW - 10, 44, 3, 3, 'S');
  label('LINE ITEMS', M + 14, y + 16);
  label('TOTAL QUANTITY', M + 120, y + 16);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...INK);
  doc.text(String(p.items.length), M + 14, y + 34);
  doc.text(String(num(p.totalQuantity)), M + 120, y + 34);

  doc.setDrawColor(...RED); doc.setLineWidth(1);
  doc.roundedRect(W - M - tW, y, tW, 44, 3, 3, 'S');
  doc.setLineWidth(0.6);
  label('APPROX. TOTAL WEIGHT', W - M - tW + 14, y + 16);
  doc.setFont('helvetica','bold'); doc.setTextColor(...RED);
  const wt = fit(fmtWt(p.totalApproxWeight), tW - 28, 14, 'bold');
  doc.text(wt, W - M - tW + 14, y + 34);

  /* ---------- notes ---------- */
  y += 60;
  if(p.notes){
    doc.setFont('helvetica','normal'); doc.setFontSize(8.4);
    const lines = doc.splitTextToSize(p.notes, CW - 28).slice(0, 5);
    const h = 26 + lines.length * 11;
    doc.setDrawColor(...LINE);
    doc.roundedRect(M, y, CW, h, 3, 3, 'S');
    label('NOTES / DELIVERY INSTRUCTIONS', M + 14, y + 15);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.4); doc.setTextColor(...INK);
    doc.text(lines, M + 14, y + 28, {lineHeightFactor:1.35});
    y += h + 16;
  }

  /* ---------- authorisation ---------- */
  const py = Math.max(y, H - 160);
  doc.setDrawColor(...LINE);
  doc.roundedRect(M, py, CW, 92, 3, 3, 'S');
  doc.line(M, py + 20, W - M, py + 20);
  label('AUTHORISATION', M + 14, py + 14);

  const colW = CW / 3;
  [['PREPARED BY', p.generatedBy || ''], ['APPROVED BY', ''], ['FOUNDRY ACKNOWLEDGEMENT', '']]
  .forEach(([k, v], n) => {
    const x = M + n * colW;
    if(n){ doc.setDrawColor(...LINE); doc.line(x, py + 20, x, py + 92); }
    if(v){
      const t = fit(v, colW - 32, 10.5, 'bold');
      doc.setTextColor(...INK);
      doc.text(t, x + 16, py + 58);
    }
    doc.setDrawColor(175,180,185);
    doc.line(x + 16, py + 64, x + colW - 16, py + 64);
    label(k, x + 16, py + 78);
  });

  /* ---------- footer ---------- */
  doc.setDrawColor(...LINE);
  doc.line(M, H - 44, W - M, H - 44);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.4); doc.setTextColor(...MUT);
  doc.text('Generated from the JAYCO Casting & Pattern Control System', M, H - 31);
  doc.text(COMPANY.web + '  |  GSTIN ' + COMPANY.gstin, rx, H - 31, {align:'right'});
  doc.setFontSize(6);
  doc.text('System-generated purchase order — valid without a physical seal unless otherwise agreed.', M, H - 21);

  return doc;
}

async function savePo(status){
  const p = currentFormPo(); if(!p) return;
  const payload = {...p, status};
  delete payload.id;
  try{
    if(state.editingPoId){
      await DB.update('purchase_orders', state.editingPoId, payload);
      toast('Purchase order updated','success');
    } else {
      const dup = state.purchaseOrders.find(x => x.poNumber === payload.poNumber);
      if(dup) return toast('That P/O number already exists.','error');
      await DB.create('purchase_orders', payload);
      toast(status === 'Closed' ? 'Purchase order closed and saved' : 'Purchase order saved as Open','success');
    }
    state.poForm = blankPo(); state.editingPoId = null;
    await loadAll(); window.scrollTo(0,0);
  }catch(err){ toast('Could not save: ' + err.message,'error'); }
}

/* Pattern Master save. Called straight from the button, so nothing the browser
   does with native form validation can stop it silently. */
async function savePattern(){
  const f = document.getElementById('f-casting');
  if(!f) return toast('The form is no longer open.','error');
  const data = Object.fromEntries(new FormData(f).entries());
  const btn = document.getElementById('btn-save-pattern');

  const name = (data.itemName || '').trim();
  if(!name){
    const el = f.querySelector('[name=itemName]');
    try{
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.focus({preventScroll:true});
      el.style.borderColor = 'var(--orange)';
      el.style.boxShadow = '0 0 0 3px rgba(229,50,45,.18)';
      el.addEventListener('input', () => { el.style.borderColor=''; el.style.boxShadow=''; }, {once:true});
    }catch{}
    return toast('Pattern Name is required.','error');
  }

  const c = {
    itemName: name,
    itemType: data.itemType || DEFAULT_TYPES[0],
    patternMaterial: data.patternMaterial || PATTERN_MATERIALS[0],
    patternConstruction: data.patternConstruction || PATTERN_CONSTRUCTION[0],
    coreBox: data.coreBox || 'Without core',
    coreCount: (data.coreBox === 'Without core') ? 0 : num(data.coreCount),
    totalSets: num(data.totalSets),
    patternGroup: (data.patternGroup || '').trim(),
    drawingPdf: pendingAttach.drawingPdf || '',
    drawingPdfName: pendingAttach.drawingPdfName || '',
    patternPhoto: pendingAttach.patternPhoto || '',
    material: 'Cast Iron', status: 'Active', averageWeight: 0
  };

  const clash = state.castingMasters.find(m =>
    String(m.id) !== String(data.id) && patternKey(m) === patternKey(c));
  if(clash){
    const el = f.querySelector('[name=itemName]');
    try{ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus({preventScroll:true});
         el.style.borderColor='var(--orange)'; el.style.boxShadow='0 0 0 3px rgba(229,50,45,.18)';
         el.addEventListener('input',()=>{el.style.borderColor='';el.style.boxShadow='';},{once:true}); }catch{}
    return toast('Already in Pattern Master: ' + c.itemName + ' · ' + c.itemType + ' · ' +
                 c.patternMaterial + ' · ' + c.patternConstruction + '. Edit that record instead.', 'error');
  }

  const bytes = c.drawingPdf.length + c.patternPhoto.length;
  if(bytes > DOC_BUDGET)
    return toast('The PDF and image together are ' + Math.round(bytes/1024) + ' KB. One record cannot exceed 1 MB.','error');

  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let saved;
    if(data.id){
      saved = await DB.update('casting_masters', data.id, c);
    } else {
      c.itemCode = 'CAST-' + Math.random().toString(36).slice(2,10).toUpperCase();
      c.createdBy = authUser();
      c.createdOn = today();
      saved = await DB.create('casting_masters', c);
    }

    if(data.quickIndex !== '' && data.quickTarget === 'po' && state.poForm){
      Object.assign(state.poForm.items[Number(data.quickIndex)],
        {masterCode:saved.itemCode, itemName:saved.itemName, itemType:saved.itemType});
      toast('Pattern saved and selected on the P/O','success');
    } else if(data.quickIndex !== '' && state.entryForm){
      Object.assign(state.entryForm.items[Number(data.quickIndex)],
        {masterCode:saved.itemCode, itemName:saved.itemName, itemType:saved.itemType});
      toast('Pattern saved and selected on the challan','success');
    } else {
      toast(data.id ? 'Pattern updated' : 'Pattern saved: ' + saved.itemName, 'success');
    }
    closeModal();
    await loadAll();
  }catch(err){
    btn.disabled = false; btn.textContent = 'Save pattern';
    toast('Could not save: ' + (err.code ? err.code + ' — ' : '') + (err.message || err), 'error');
  }
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-view],[data-go],[data-new-challan],[data-view-challan],[data-edit-challan],[data-del-challan],[data-open-casting],[data-del-casting],[data-open-type],[data-del-type],[data-open-foundry],[data-del-foundry],[data-close],[data-rm-po],[data-rm-item],[data-quick-add],[data-quick-add-po],[data-open-pdf],[data-row-pdf],[data-open-pig-receipt],[data-open-pig-issue],[data-edit-pig],[data-del-pig],[data-pdf-challan],[data-wa-challan],[data-edit-po],[data-del-po],[data-pdf-po],[data-wa-po],[data-rm-po-item]');
  if(!t) return;
  const d = t.dataset;

  if(d.view !== undefined){ state.view = d.view; state.search=''; document.getElementById('search').value=''; document.getElementById('sidebar').classList.remove('open'); render(); return; }
  if(d.go !== undefined){ state.view = d.go; render(); window.scrollTo(0,0); return; }
  if(d.close !== undefined){ closeModal(); return; }

  if(d.newChallan !== undefined){ state.editingChallanId=null; state.entryForm=blankEntry(); state.view='insert-casting'; render(); window.scrollTo(0,0); return; }

  if(d.viewChallan){ modalViewChallan(d.viewChallan); return; }
  if(d.pdfChallan){ const c = state.challans.find(x=>String(x.id)===d.pdfChallan); if(c) downloadPdf(c); return; }
  if(d.waChallan){ const c = state.challans.find(x=>String(x.id)===d.waChallan); if(c) shareWhatsApp(c); return; }

  if(d.editChallan){
    const c = state.challans.find(x=>String(x.id)===d.editChallan); if(!c) return;
    closeModal();
    state.editingChallanId = c.id;
    state.entryForm = {
      challanNumber:c.challanNumber, challanDate:c.challanDate, foundryName:c.foundryName,
      newFoundry: !foundryOptions().all.includes(c.foundryName),
      purchaseOrders:getPOs(c).map(p=>({...p})),
      items:c.items.map((i,n)=>({
        masterCode: (state.castingMasters.find(m=>m.itemName===i.itemName)||{}).itemCode || ('legacy-'+n),
        itemName:i.itemName, itemType:i.itemType, material:i.material,
        quantity:String(i.quantity), foundryWeight: num(i.foundryTotalWeight)>0?String(i.foundryTotalWeight):'',
        actualWeight:String(i.actualTotalWeight)}))
    };
    state.view='insert-casting'; render(); window.scrollTo(0,0); return;
  }

  if(d.delChallan){ if(confirm('Delete this challan permanently?')){ await DB.remove('casting_challans', d.delChallan); toast('Challan deleted','success'); loadAll(); } return; }
  if(d.delCasting){ if(confirm('Delete this casting item from the master?')){ await DB.remove('casting_masters', d.delCasting); toast('Casting item deleted','success'); loadAll(); } return; }
  if(d.delType){ if(confirm('Delete this casting type?')){ await DB.remove('casting_types', d.delType); toast('Type deleted','success'); loadAll(); } return; }
  if(d.delFoundry){ if(confirm('Delete this foundry from the master? Existing purchase orders keep the name.')){ await DB.remove('foundries', d.delFoundry); toast('Foundry deleted','success'); loadAll(); } return; }

  if(d.openCasting !== undefined){ modalCasting(d.openCasting, null); return; }
  if(d.openType !== undefined){ modalType(d.openType); return; }
  if(d.openFoundry !== undefined){ modalFoundry(d.openFoundry); return; }
  if(d.openPigReceipt !== undefined){ modalPigReceipt(d.openPigReceipt); return; }
  if(d.openPigIssue !== undefined){ modalPigIssue(d.openPigIssue); return; }
  if(d.editPig){
    const r = state.pigIron.find(x=>String(x.id)===d.editPig); if(!r) return;
    r.kind === 'Receipt' ? modalPigReceipt(r.id) : modalPigIssue(r.id);
    return;
  }
  if(d.delPig){ if(confirm('Delete this pig iron entry permanently?')){ await DB.remove('pig_iron', d.delPig); toast('Entry deleted','success'); loadAll(); } return; }
  if(d.quickAdd !== undefined){ modalCasting('', Number(d.quickAdd), 'challan'); return; }
  if(d.quickAddPo !== undefined){ modalCasting('', Number(d.quickAddPo), 'po'); return; }

  if(d.rmPo !== undefined){
    if(state.entryForm.purchaseOrders.length>1) state.entryForm.purchaseOrders.splice(Number(d.rmPo),1);
    render(); return;
  }

  if(d.rmPoItem !== undefined){
    if(state.poForm.items.length>1) state.poForm.items.splice(Number(d.rmPoItem),1);
    render(); return;
  }
  if(d.pdfPo){ const p = state.purchaseOrders.find(x=>String(x.id)===d.pdfPo); if(p) downloadPoPdf(p); return; }
  if(d.waPo){ const p = state.purchaseOrders.find(x=>String(x.id)===d.waPo); if(p) shareWhatsAppPo(p); return; }
  if(d.delPo){ if(confirm('Delete this purchase order permanently?')){ await DB.remove('purchase_orders', d.delPo); toast('Purchase order deleted','success'); loadAll(); } return; }
  if(d.editPo){
    const p = state.purchaseOrders.find(x=>String(x.id)===d.editPo); if(!p) return;
    state.editingPoId = p.id;
    state.poForm = {poNumber:p.poNumber, poDate:p.poDate, foundryName:p.foundryName, notes:p.notes||'', generatedBy:p.generatedBy||'',
      items:p.items.map((i,n)=>({masterCode:(state.castingMasters.find(m=>m.itemName===i.itemName)||{}).itemCode || ('legacy-'+n),
        itemName:i.itemName, itemType:i.itemType, quantity:String(i.quantity)}))};
    state.view='generate-po'; render(); window.scrollTo(0,0); return;
  }
  if(d.rmItem !== undefined){
    if(state.entryForm.items.length>1) state.entryForm.items.splice(Number(d.rmItem),1);
    render(); return;
  }
});

/* Update one P/O row and the totals in place — no re-render, so the field
   you are typing in keeps focus and nothing is rebuilt underneath you. */
function updatePoRow(el, i){
  const f = state.poForm; if(!f) return;
  const it = f.items[i];
  const qty = num(it.quantity);
  const w = avgWeightFor(it.itemName);
  const row = el.closest('tr');
  if(row){
    const cells = row.querySelectorAll('td.num');
    if(cells.length >= 2)
      cells[cells.length-1].innerHTML = '<b>' + (qty*w.avg > 0 ? fmtWt(qty*w.avg) : '—') + '</b>';
  }
  let totQty = 0, totWt = 0;
  for(const line of f.items){
    const q = num(line.quantity);
    totQty += q; totWt += q * avgWeightFor(line.itemName).avg;
  }
  const cards = document.querySelectorAll('.totals-grid .weight-total-card strong');
  if(cards.length >= 3){
    cards[0].textContent = f.items.length;
    cards[1].textContent = totQty;
    cards[2].textContent = fmtWt(totWt);
  }
}

function updateEntryTotals(){
  const f = state.entryForm; if(!f) return;
  const cards = document.querySelectorAll('.totals-grid .weight-total-card strong');
  if(cards.length < 4) return;
  const t = f.items.reduce((a,i)=>({q:a.q+num(i.quantity), fw:a.fw+num(i.foundryWeight), aw:a.aw+num(i.actualWeight)}),{q:0,fw:0,aw:0});
  const complete = f.items.every(i=>num(i.foundryWeight)>0);
  cards[0].textContent = t.q;
  cards[1].textContent = complete ? fmtWt(t.fw) : '—';
  cards[2].textContent = fmtWt(t.aw);
  cards[3].textContent = complete ? fmtWt(t.aw - t.fw) : '—';
  const diffCard = cards[3].parentElement;
  diffCard.className = 'weight-total-card ' + (complete && (t.aw-t.fw)>0 ? 'diff-up' : 'diff-ok');
}

/* form submissions */
/* Every save below is called directly from its button. Nothing depends on the
   browser's native form validation, which can block a submit with no message. */

function fieldError(form, name, msg){
  const el = form.querySelector('[name="' + name + '"]');
  if(el){
    try{
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.focus({preventScroll:true});
      el.style.borderColor = 'var(--orange)';
      el.style.boxShadow = '0 0 0 3px rgba(229,50,45,.18)';
      el.addEventListener('input', () => { el.style.borderColor=''; el.style.boxShadow=''; }, {once:true});
    }catch{}
  }
  toast(msg, 'error');
  return null;
}

function formData(id){
  const f = document.getElementById(id);
  if(!f) return null;
  return {f, data: Object.fromEntries(new FormData(f).entries())};
}

async function saveType(){
  const ctx = formData('f-type'); if(!ctx) return toast('The form is no longer open.','error');
  const {f, data} = ctx;
  const btn = document.getElementById('btn-save-type');
  const name = (data.typeName || '').trim();
  if(!name) return fieldError(f, 'typeName', 'Type Name is required.');
  if(DEFAULT_TYPES.some(t => t.toLowerCase() === name.toLowerCase()) && !data.id)
    return fieldError(f, 'typeName', '"' + name + '" is already a built-in type.');
  const dup = state.castingTypes.find(x => String(x.typeName).toLowerCase() === name.toLowerCase() && String(x.id) !== String(data.id));
  if(dup) return fieldError(f, 'typeName', 'That type name already exists.');

  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const t = {typeName:name, status:data.status || 'Active', notes:(data.notes||'').trim()};
    if(data.id) await DB.update('casting_types', data.id, t);
    else        await DB.create('casting_types', t);
    toast(data.id ? 'Type updated: ' + name : 'Type saved: ' + name, 'success');
    closeModal(); await loadAll();
  }catch(err){
    btn.disabled = false; btn.textContent = 'Save type';
    toast('Could not save: ' + (err.code ? err.code + ' — ' : '') + (err.message || err), 'error');
  }
}

async function saveChallan(){
  const c = currentFormChallan(); if(!c) return;
  const btn = document.getElementById('btn-close-challan');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    const payload = {...c, status:'Closed'};
    delete payload.id;
    if(state.editingChallanId){
      await DB.update('casting_challans', state.editingChallanId, payload);
      toast('Closed challan updated','success');
    } else {
      const dup = state.challans.find(x => x.foundryName===payload.foundryName && x.challanNumber===payload.challanNumber);
      if(dup){
        if(btn){ btn.disabled = false; btn.textContent = 'Close Challan'; }
        return toast('That challan number already exists for this foundry.','error');
      }
      await DB.create('casting_challans', payload);
      toast('Challan closed: ' + payload.challanNumber, 'success');
    }
    const nums = c.purchaseOrders.map(x => String(x.purchaseOrderNumber).trim());
    state.entryForm = blankEntry(); state.editingChallanId = null; state.view = 'casting-records';
    await loadAll();
    await reconcilePos(nums);
    await loadAll();
    window.scrollTo(0,0);
  }catch(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Close Challan'; }
    toast('Could not save: ' + (err.code ? err.code + ' — ' : '') + (err.message || err), 'error');
  }
}

/* ---- Pig iron statement ---- */
function buildPigPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 40, CW = W - M*2, rx = W - M;
  const INK=[26,26,26], MUT=[128,133,138], LINE=[214,218,221], RED=[206,42,38], SOFT=[247,248,249];
  const label = (t,x,y,a) => { doc.setFont('helvetica','bold'); doc.setFontSize(6.2); doc.setTextColor(...MUT); doc.text(t,x,y,a?{align:a}:undefined); };

  let y = 46, logoDrawn = false;
  try{ const l = document.querySelector('.brand-logo');
       if(l && l.src){ doc.addImage(l.src,'PNG',M,y-18,100,22); logoDrawn = true; } }catch(e){}
  if(!logoDrawn){ doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(...RED); doc.text('JAYCO', M, y); }

  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
  doc.text(COMPANY.name, M, y + 22);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.2); doc.setTextColor(...MUT);
  doc.text([COMPANY.addr1, COMPANY.addr3], M, y + 34, {lineHeightFactor:1.4});
  doc.setFontSize(8); doc.setTextColor(...INK);
  const g = COMPANY.gstin; const gw = doc.getTextWidth(g);
  doc.text(g, rx, y - 12, {align:'right'}); label('GSTIN', rx - gw - 8, y - 12, 'right');
  doc.text(COMPANY.phone, rx, y + 3, {align:'right'});

  y += 62;
  doc.setDrawColor(...RED); doc.setLineWidth(1.4); doc.line(M, y, W - M, y); doc.setLineWidth(0.6);
  y += 28;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text('PIG IRON STATEMENT', M, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT);
  doc.text('As on ' + fmtDate(today()), rx, y, {align:'right'});

  const t = pigTotals();
  y += 14;
  const bw = (CW - 30) / 4;
  [['RECEIVED', fmtWt(t.received)], ['ISSUED', fmtWt(t.issued)],
   ['AT JAYCO', fmtWt(t.atJayco)], ['AT FOUNDRIES', fmtWt(t.atFoundries)]]
  .forEach(([k,v],n)=>{
    const x = M + n*(bw+10);
    doc.setDrawColor(...(n>1?RED:LINE)); doc.setFillColor(...SOFT);
    doc.roundedRect(x,y,bw,44,3,3, n>1?'S':'FD');
    label(k, x+12, y+16);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...(n>1?RED:INK));
    doc.text(v, x+12, y+33);
  });

  y += 60;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('Balance lying with each foundry', M, y);
  doc.autoTable({
    startY: y + 8, margin:{left:M,right:M},
    head: [['FOUNDRY','ISSUED','CASTINGS RETURNED','BALANCE']],
    body: pigByFoundry().map(e => [e.name, fmtWt(e.issued), fmtWt(e.returned), fmtWt(e.balance)]),
    styles:{fontSize:8.4, cellPadding:6.5, lineColor:LINE, lineWidth:0.5, textColor:INK},
    headStyles:{fillColor:SOFT, textColor:MUT, fontStyle:'bold', fontSize:6.4, halign:'center', cellPadding:7, lineColor:LINE, lineWidth:0.5},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right',fontStyle:'bold'}}
  });

  y = doc.lastAutoTable.finalY + 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('Ledger', M, y);
  doc.autoTable({
    startY: y + 8, margin:{left:M,right:M},
    head: [['DATE','MOVEMENT','PARTY','REFERENCE','WEIGHT']],
    body: pigLedger().slice(-60).reverse().map(r => [
      fmtDate(r.date), r.kind, r.party, r.ref || '—',
      (r.kind==='Receipt'?'+':(r.kind==='Issue'?'-':'')) + fmtWt(r.weight)
    ]),
    styles:{fontSize:7.8, cellPadding:5.5, lineColor:LINE, lineWidth:0.5, textColor:INK, overflow:'linebreak'},
    headStyles:{fillColor:SOFT, textColor:MUT, fontStyle:'bold', fontSize:6.2, halign:'center', cellPadding:6, lineColor:LINE, lineWidth:0.5},
    columnStyles:{0:{cellWidth:62},1:{cellWidth:84},3:{cellWidth:96},4:{halign:'right',fontStyle:'bold'}}
  });

  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i);
    doc.setDrawColor(...LINE); doc.line(M, H-40, W-M, H-40);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.4); doc.setTextColor(...MUT);
    doc.text('Pig iron statement — castings returned are deducted automatically from closed challans.', M, H-27);
    doc.text('Page ' + i + ' of ' + pages, rx, H-27, {align:'right'});
  }
  return doc;
}

function downloadPigPdf(){
  try{ buildPigPdf().save('JAYCO-Pig-Iron-Statement-' + today() + '.pdf');
       toast('Pig iron statement downloaded','success'); }
  catch(e){ toast('The PDF could not be created: ' + e.message,'error'); }
}

  const lines = [

    `In stock at JAYCO: ${fmtWt(t.atJayco)}`,
