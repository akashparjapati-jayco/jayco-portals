<!DOCTYPE html>
<!--
  JAYCO Staff Attendance — single-file app (GitHub Pages + Firebase)
  Light theme · English / ગુજરાતી
  --------------------------------------------------------------
  SETUP
  1. Firebase console → create project "jayco-attendance".
  2. Authentication → Sign-in method → enable "Email/Password".
     Authentication → Settings → Authorized domains → add: akashparjapati-jayco.github.io
  3. Firestore Database → create (asia-south1 Mumbai) → Rules → paste firestore.rules → Publish.
  4. Project settings → Your apps → Web app → copy firebaseConfig into CONFIG.FIREBASE below.
  5. Put your mobile number in CONFIG.ADMIN_MOBILES (and the same number in firestore.rules).
  6. Upload to the jayco-portals repo as attendance.html.
  Without CONFIG.FIREBASE the app runs in demo mode (data stays on one phone only).
-->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--bg:#f4f5f7;--panel:#ffffff;--panel2:#eff1f4;--line:#e0e3e8;--ink:#14181d;--mute:#5b646e;--red:#e30016;--redsoft:#fdecee;--ok:#15914d;--oksoft:#e6f5ec;--warn:#a86f00;--warnsoft:#fff6e0;--bad:#c8001a;
  --body:Barlow,"Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Noto Sans Gujarati","Arial Narrow",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,24,29,.05),0 6px 18px rgba(20,24,29,.06)}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond,.brand,.stats b,.dial button,.btn,.t,.tag,.hero-a,.far,.seg button,.nav button,.cred b{font-family:var(--cond)}
h1{font-size:30px;line-height:1.1;margin:4px 0;font-weight:700}
h2{font-size:21px;margin:26px 0 10px;font-weight:600}
h3{font-size:18px;margin:20px 0 8px;font-weight:600}
.muted{color:var(--mute)}.small{font-size:13.5px}.err{color:var(--bad)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.top{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:3px solid var(--red);box-shadow:0 2px 10px rgba(20,24,29,.05)}
.brand img{height:26px;width:auto;display:block}
.brand small{display:block;color:var(--mute);font:500 13px var(--body);letter-spacing:0;margin-top:3px}
.who{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font:500 14px var(--body);cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:#c9ced5}
.chip.lang{border-color:var(--red);color:var(--red);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(20,24,29,.04)}
.nav button{flex:1;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;color:var(--mute);padding:12px 4px 13px;font-size:17px;font-weight:600;cursor:pointer}
.nav button.on{color:var(--red);border-top-color:var(--red)}
.dial{width:236px;height:236px;margin:18px auto 8px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e7e9ed 0)}
.dial.ot{background:conic-gradient(#e0a100 calc(var(--o)*1%),var(--ok) 0)}
.dial button{width:196px;height:196px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:64px;font-weight:700;line-height:.9;cursor:pointer;box-shadow:inset 0 -8px 0 rgba(0,0,0,.16),0 10px 24px rgba(227,0,22,.25)}
.dial button:active{transform:scale(.97)}
.dial button.out{background:var(--panel);color:var(--red);border:4px solid var(--red);box-shadow:0 8px 20px rgba(20,24,29,.08)}
.dial button:disabled{opacity:.35;cursor:not-allowed}
.dial button small{display:block;font:500 15px/1.3 var(--body);margin-top:8px;opacity:.95}
.gu{text-align:center;color:var(--mute);font-size:14px;margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0;background:var(--panel);box-shadow:var(--shadow)}
.stats div{padding:10px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:24px;font-weight:600}
.stats span{font-size:12.5px;color:var(--mute)}
.stats .ot{color:var(--warn)}
.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li.click{cursor:pointer}.list li.click:hover{background:#fafbfc}
.grow{flex:1;min-width:0}
.tag{font-size:14px;font-weight:700;padding:3px 8px;border-radius:4px;min-width:44px;text-align:center;display:inline-block}
.tag.IN{background:var(--ok);color:#fff}.tag.OUT{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.t{font-size:20px;font-weight:600}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:14px;color:var(--mute);margin-bottom:5px}
.f .emsg{display:none;color:var(--bad);font-size:13px;margin-top:4px}
.f.bad .emsg{display:block}.f.bad input,.f.bad textarea{border-color:var(--red);background:#fffafa}
input,textarea,select{width:100%;background:var(--panel);color:var(--ink);border:1px solid #d3d7dd;border-radius:8px;padding:12px;font:16px var(--body)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--red);flex:none;margin:2px 0 0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:19px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.big{width:100%;padding:15px;font-size:21px}
.btn.sec{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.state{font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.state.in{background:var(--oksoft);color:var(--ok)}.state.left{background:var(--panel2);color:var(--mute)}.state.abs{background:var(--redsoft);color:var(--bad)}
.warnbox{border-left:4px solid #e0a100;background:var(--warnsoft);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0}
.warnbox a{color:var(--ink);word-break:break-all}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px;white-space:nowrap}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--panel2);color:var(--mute);font-weight:500}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(20,24,29,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--red);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.dial button:active{transform:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cam{position:relative;aspect-ratio:3/4;background:#000;border-radius:10px;overflow:hidden;margin:12px auto;max-height:42vh}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.far{font-size:46px;font-weight:700;color:var(--bad);line-height:1;margin:6px 0}
.okline{color:var(--ok);font-weight:600;margin:4px 0}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos figure{margin:0}
.photos img{width:100%;border-radius:8px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--panel2)}
.photos figcaption{font-size:13px;color:var(--mute);margin-top:4px}
.photos a{color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.sheet .kv{border:0;padding:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.work{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.work .muted{font-size:13px;display:block;margin-bottom:3px;white-space:normal}
.authcard{max-width:440px;margin:0 auto;padding:24px 18px 60px}
.authtop{display:flex;justify-content:space-between;align-items:flex-start}
.hero-a img{width:200px;max-width:62vw;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:18px 0;background:var(--panel)}
.seg button{flex:1;padding:11px;background:none;border:0;color:var(--mute);font-size:18px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar input{width:auto}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute)}
.legend{font-size:15px;color:var(--ink);font-weight:600;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.cred{background:var(--panel2);border-radius:10px;padding:14px;margin:12px 0}
.cred b{font-size:30px;font-weight:700;letter-spacing:1px;display:block}
ol.help{padding-left:18px;margin:10px 0}
.mascot{display:block;width:230px;max-width:62%;margin:6px auto -6px}
.mascot-sm{width:74px;vertical-align:middle;margin-right:8px}
.empty{text-align:center;padding:10px 0}
.empty img{width:150px;opacity:.95}
.plist li{align-items:flex-start}
.pthumb{width:52px;height:69px;border-radius:6px;object-fit:cover;background:var(--panel2);flex:none}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--warnsoft);color:var(--warn);margin:3px 4px 0 0}
.togg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.nav button{font-size:15px;padding:12px 2px 13px}
@media (min-width:860px){
  #app{display:flex;flex-direction:column;min-height:100vh}
  .top{order:0}.nav{order:1}.wrap{order:2}
  .wrap{max-width:960px;padding:22px 24px 40px}
  .nav{position:static;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;box-shadow:none}
  .nav button{flex:0 0 auto;padding:14px 22px;font-size:17px;border-top:0;border-bottom:3px solid transparent;margin:0}
  .nav button.on{border-bottom-color:var(--red)}
  .stats b{font-size:28px}
  .photos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sheet-bg{align-items:center}
  .sheet{max-width:720px;border-radius:14px;max-height:88vh}
  #toast{bottom:28px}
}
.install{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:10px 12px;margin:12px 0;box-shadow:var(--shadow)}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install .grow b{display:block;font-size:15px}
.install .btn{font-size:17px;padding:9px 14px}
.install .x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:0 4px}
.ios-steps{padding-left:20px}.ios-steps li{margin:8px 0}
.pp{display:flex;gap:14px;align-items:center}
.pp-img{width:96px;height:96px;border-radius:50%;flex:none;background:var(--panel2) center/cover no-repeat;border:2px dashed #c9ced5;display:grid;place-items:center;color:var(--mute);overflow:hidden}
.pp-img.has{border:3px solid var(--red)}
.pp-img svg{width:40px;height:40px}
.pp-btns{display:flex;flex-direction:column;gap:8px;flex:1}
.pp-btns .btn{font-size:17px;padding:10px 12px}
.f.bad .pp-img{border-color:var(--red)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
.av.lg{width:88px;height:88px;border:3px solid var(--red)}
.avrow{display:flex;gap:14px;align-items:center}
@media (max-width:430px){.top{padding:8px 12px}.who{gap:4px;flex-wrap:nowrap}.who .chip{padding:6px 8px;font-size:13px}.brand img{height:22px}}
</style>
</head>

/* ============ attendance maths ============ */
function sortP(ps) { return ps.slice().sort((a, b) => a.t - b.t); }
function nextType(ps) { const s = sortP(ps); return s.length && s[s.length-1].type === 'IN' ? 'OUT' : 'IN'; }
function calcDay(punches, isToday) {
  const ps = sortP(punches), st = S.settings;
  let ms = 0, open = null, missing = false;
  for (const p of ps) {
    if (p.type === 'IN') { if (open !== null) missing = true; open = p.t; }
    else { if (open === null) { missing = true; continue; } ms += p.t - open; open = null; }
  }
  const isOpen = open !== null;
  if (isOpen) { if (isToday) ms += Date.now() - open; else missing = true; }
  const shift = st.shiftHours * H, reg = Math.min(ms, shift);
  let ot = Math.max(0, ms - shift);
  const r = (+st.otRoundMin || 0) * 60000; if (r) ot = Math.floor(ot / r) * r;
  const status = ms === 0 ? (ps.length ? 'missing' : 'absent') : ms < st.halfDayHours * H ? 'half' : 'present';
  return { ms, reg, ot, open: isOpen && isToday, missing, status, first: ps[0]?.t, last: ps[ps.length-1]?.t, lastType: ps[ps.length-1]?.type, count: ps.length };
}

// Profile photo: 240x240 square, compressed to about 12 KB
function regPhoto(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  if (!/^image\//.test(f.type)) return toast(t('choosePhoto'), 1);
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => {
    URL.revokeObjectURL(u);
    const W = 240, c = document.createElement('canvas'); c.width = c.height = W;
    const g = c.getContext('2d'), s = Math.min(im.naturalWidth, im.naturalHeight);
    g.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, W, W);
    let q = 0.75, url = c.toDataURL('image/jpeg', q);
    while (url.length * 0.75 > 12 * 1024 && q > 0.3) { q -= 0.08; url = c.toDataURL('image/jpeg', q); }
    S.regPhoto = url;
    const box = $('#pp_img'); box.classList.add('has'); box.style.backgroundImage = `url(${url})`; box.innerHTML = '';
    $('#pp_note').textContent = t('photoAdded', { kb: Math.round(url.length * 0.75 / 1024) });
    $('#w_photo').classList.remove('bad');
  };
  im.onerror = () => toast(t('photoBad'), 1);
  im.src = u;
}

// Small, stamped JPEG: 240x320 px, quality stepped down until it fits the KB limit (default 15 KB)
function stamp(src, sw, sh) {
  const W = 240, Hh = 320, c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const g = c.getContext('2d'), r = Math.max(W / sw, Hh / sh), dw = sw * r, dh = sh * r;
  g.drawImage(src, (W - dw) / 2, (Hh - dh) / 2, dw, dh);
  g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, Hh - 40, W, 40);
  g.fillStyle = '#e30016'; g.fillRect(0, Hh - 40, 4, 40);
  g.fillStyle = '#fff'; g.font = '600 12px Barlow, sans-serif';
  g.fillText(`${fullName(S.profile)} | ${S.pending.type}${S.pending.src === 'upload' ? ' | GALLERY' : S.pending.src === 'selfie' ? ' | SELFIE' : ''}`, 9, Hh - 24);
  g.font = '10px Barlow, sans-serif';
  g.fillText(`${new Date().toLocaleString('en-IN')} | ${S.pending.dist} m`, 9, Hh - 9);
  const limit = (+S.settings.photoKB || 15) * 1024;
  let q = 0.7, url = c.toDataURL('image/jpeg', q);
  while (url.length * 0.75 > limit && q > 0.25) { q -= 0.08; url = c.toDataURL('image/jpeg', q); }
  S.pending.kb = Math.round(url.length * 0.75 / 1024);
  return url;
}
function snap() {
  const v = $('#vid'); if (!v || !v.videoWidth) return toast(t('camStarting'), 1);
  S.pending.src = 'camera';
  const img = stamp(v, v.videoWidth, v.videoHeight); stopCam(); savePunch(img);
}
function snapFile(inp, src) {
  const f = inp.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) return toast(t('choosePhoto'), 1);
  if (src !== 'camera' && Date.now() - f.lastModified > 10 * 60000) { inp.value = ''; return toast(t('photoOld'), 1); }
  S.pending.src = src;
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => { URL.revokeObjectURL(u); stopCam(); savePunch(stamp(im, im.naturalWidth, im.naturalHeight)); };
  im.onerror = () => toast(t('photoBad'), 1);
  im.src = u;
}

// Punch log: every IN and OUT of one day, newest first, with the doubtful ones flagged
function punchFlags(p, byUid) {
  const f = [], R = +S.settings.radius || 100, hh = new Date(p.t).getHours();
  if (p.src === 'upload') f.push('fGallery');
  if (p.dist > R * 0.7) f.push('fFar');
  if (hh < 5 || hh > 22) f.push('fOdd');
  const mine = byUid[p.uid] || [];
  if (p.type === 'IN' && !mine.some(x => x.type === 'OUT' && x.t > p.t)) f.push('fNoPair');
  return f;
}

// thumbnails download only when they scroll into view — 400 punches a day would be 3 MB otherwise
function lazyPhotos(root) {
  const io = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting) return;
    const im = e.target; io.unobserve(im);
    const id = im.dataset.ph; im.removeAttribute('data-ph');
    const src = await DB.photo(id).catch(() => null); if (src) im.src = src;
  }), { rootMargin: '200px' });
  root.querySelectorAll('img[data-ph]').forEach(im => io.observe(im));
}

    <label class="f" style="margin-top:14px"><span>${t('pasteLbl')}</span><input id="s_paste" placeholder="22.991259, 72.841697" oninput="parseLoc(this.value)"></label>
    <div class="row2"><label class="f"><span>${t('lat')}</span><input id="s_lat" inputmode="decimal" value="${s.lat ?? ''}"></label><label class="f"><span>${t('lng')}</span><input id="s_lng" inputmode="decimal" value="${s.lng ?? ''}"></label></div>
    ${s.lat != null ? `<a class="chip" href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">${t('checkMap')}</a>` : ''}
    <label class="f" style="margin-top:14px"><span>${t('radius')}</span><input id="s_rad" type="number" min="30" max="1000" value="${s.radius}"></label>
    <h2>${t('workHours')}</h2>
    <div class="row2"><label class="f"><span>${t('shiftH')}</span><input id="s_sh" type="number" min="1" max="16" step="0.5" value="${s.shiftHours}"></label>
    <label class="f"><span>${t('halfH')}</span><input id="s_hd" type="number" min="0" max="12" step="0.5" value="${s.halfDayHours}"></label></div>
    <label class="f"><span>${t('otBlocks')}</span><select id="s_ot">${[[0, 'exact'], [15, 'm15'], [30, 'm30'], [60, 'h1']].map(([v, l]) => `<option value="${v}" ${+s.otRoundMin === v ? 'selected' : ''}>${t(l)}</option>`).join('')}</select></label>
    <h2>${t('punchPhoto')}</h2>
    <label class="f consent"><input type="checkbox" id="s_up" ${s.allowUpload ? 'checked' : ''}><span>${t('allowGallery')}</span></label>
    <label class="f"><span>${t('maxPhoto')}</span><select id="s_kb">${[[8, 'kb8'], [15, 'kb15'], [25, 'kb25']].map(([v, l]) => `<option value="${v}" ${+s.photoKB === v ? 'selected' : ''}>${t(l)}</option>`).join('')}</select></label>
    <h2>${t('cleanup')}</h2>
    <p class="muted small">${t('cleanupNote')} ${t('storageNote', { mb: Math.round(100 * 4 * 22 * (+s.photoKB || 8) / 1024) })}</p>
    <label class="f"><span>${t('keepMonths')}</span><select id="s_keep">${[[3, 'months3'], [6, 'months6'], [12, 'months12']].map(([v, l]) => `<option value="${v}" ${+s.keepMonths === v ? 'selected' : ''}>${t(l)}</option>`).join('')}</select></label>
    <button class="btn sec big" id="c_btn" onclick="runCleanup()">${t('runCleanup')}</button>
    <button class="btn big" id="s_btn" onclick="saveSettings()" style="margin-top:18px">${t('saveSettings')}</button>`;
}
function parseLoc(v) {
  const x = v.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (x) { $('#s_lat').value = x[1]; $('#s_lng').value = x[2]; toast(t('coordsFilled')); }
}
async function useHere() {
  toast(t('readingLoc'));
  try { const p = await getPos(); $('#s_lat').value = p.coords.latitude.toFixed(6); $('#s_lng').value = p.coords.longitude.toFixed(6);
    toast(t('locRead', { a: Math.round(p.coords.accuracy) })); }
  catch (e) { toast(e.message, 1); }
}
async function runCleanup() {
  const keep = +$('#s_keep').value || 6, b = $('#c_btn');
  const d = new Date(); d.setMonth(d.getMonth() - keep);
  const before = monthKey(d);
  b.disabled = true; b.textContent = t('cleaning');
  let n = 0;
  try {
    for (;;) {
      const ids = await DB.oldPhotoIds(before);
      if (!ids.length) break;
      n += await DB.deletePhotos(ids);
      if (ids.length < 400) break;
    }
    toast(n ? t('cleaned', { n }) : t('nothingOld'));
  } catch (e) { toast(errMsg(e), 1); }
  b.disabled = false; b.textContent = t('runCleanup');
}
async function saveSettings() {
  const lat = parseFloat($('#s_lat').value), lng = parseFloat($('#s_lng').value);
  if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return toast(t('badCoords'), 1);
  const s = { lat, lng, radius: Math.max(30, +$('#s_rad').value || 100), shiftHours: +$('#s_sh').value || 8, halfDayHours: +$('#s_hd').value || 0,
    otRoundMin: +$('#s_ot').value, allowUpload: $('#s_up').checked, photoKB: +$('#s_kb').value, keepMonths: +$('#s_keep').value };
  const b = $('#s_btn'); b.disabled = true;
  try { await DB.saveSettings(s); S.settings = { ...DEF, ...s }; toast(t('saved')); render(); }
  catch (e) { toast(errMsg(e), 1); b.disabled = false; }
}

/* ============ install as mobile app (PWA) ============ */
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
let deferredPrompt = null;
function installBanner() {
  if (STANDALONE || !SECURE) return '';
  try { if (sessionStorage.getItem('jayco_hide_install')) return ''; } catch (e) {}
  if (!deferredPrompt && !IOS) return '';
  return `<div class="install" id="installBox"><img src="jayco-att-192.png" alt=""><div class="grow"><b>${t('installTitle')}</b><span class="muted small">${t('installSub')}</span></div>
    <button class="btn" onclick="doInstall()">${t('install')}</button><button class="x" aria-label="Close" onclick="hideInstall()">×</button></div>`;
}
function hideInstall() { try { sessionStorage.setItem('jayco_hide_install', '1'); } catch (e) {} const b = $('#installBox'); if (b) b.remove(); }
async function doInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice; deferredPrompt = null;
    if (r.outcome === 'accepted') hideInstall();
    return;
  }
  if (IOS) sheet(`<div class="sheet-h"><h2 style="margin:0">${t('iosTitle')}</h2>${closeBtn()}</div>
    <ol class="ios-steps"><li>${t('ios1')}</li><li>${t('ios2')}</li><li>${t('ios3')}</li></ol><button class="btn big" onclick="closeSheet()">${t('gotIt')}</button>`);
}
function showInstallSlot() { const s = $('#installSlot'); if (s) s.innerHTML = installBanner(); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstallSlot(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstall(); toast(t('installed')); });
if ('serviceWorker' in navigator && SECURE && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('attendance-sw.js', { scope: './attendance' }).catch(e => console.warn('SW', e));
}

boot();
</script>
</body>
