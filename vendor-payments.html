function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}
function allocatePaymentFIFO(paymentAmount, openInvoices) {
  const sorted = [...openInvoices].sort((a, b) => new Date(a.invoiceDate) - new Date(b.invoiceDate));
  let remaining = round2(paymentAmount);
  const allocations = [];
  for (const inv of sorted) {
    if (remaining <= 0) break;
    const outstanding = round2(inv.amount - (inv.amountPaid || 0));
    if (outstanding <= 0) continue;
    const applied = Math.min(outstanding, remaining);
    remaining = round2(remaining - applied);
    const newPaidTotal = round2((inv.amountPaid || 0) + applied);
    const newStatus = newPaidTotal >= inv.amount ? "paid" : "partial";
    allocations.push({
      invoiceId: inv.id,
      invoiceNo: inv.invoiceNo,
      amountApplied: applied,
      newStatus
    });
  }
  return {
    allocations,
    unallocatedAmount: round2(remaining)
  };
}
function applyAdvanceToNewInvoice(invoiceAmount, availableAdvance) {
  const applied = round2(Math.min(invoiceAmount, availableAdvance));
  return {
    appliedFromAdvance: applied,
    remainingAdvance: round2(availableAdvance - applied),
    invoiceOutstanding: round2(invoiceAmount - applied)

}
function daysPastDue(dueDate, today = new Date()) {
  const due = new Date(dueDate);
  const t = new Date(today);
  due.setHours(0, 0, 0, 0);
  t.setHours(0, 0, 0, 0);
  return Math.round((t - due) / (1000 * 60 * 60 * 24));
}
function ageingBucket(dueDate, today = new Date()) {
  const dpd = daysPastDue(dueDate, today);
  if (dpd <= 0) return "not_due";
  if (dpd <= 30) return "0_30";
  if (dpd <= 60) return "31_60";
  if (dpd <= 90) return "61_90";

}

async function createInvoice(invoice) {
  const {
    db,
    doc,
    collection,
    runTransaction,
    serverTimestamp

  return runTransaction(db, async tx => {
    const vendorRef = doc(db, "vendors", invoice.vendorId);
    const vendorSnap = await tx.get(vendorRef);
    if (!vendorSnap.exists()) throw new Error("Vendor not found");
    const vendor = vendorSnap.data();
    const advance = round2(vendor.advanceBalance || 0);
    const {
      appliedFromAdvance,
      remainingAdvance
    } = applyAdvanceToNewInvoice(invoice.amount, advance);
    const invoiceRef = doc(collection(db, "invoices"));
    tx.set(invoiceRef, {
      vendorId: invoice.vendorId,
      invoiceNo: invoice.invoiceNo,
      invoiceDate: invoice.invoiceDate,
      dueDate: invoice.dueDate,
      amount: round2(invoice.amount),
      amountPaid: appliedFromAdvance,
      status: appliedFromAdvance >= invoice.amount ? "paid" : appliedFromAdvance > 0 ? "partial" : "open",
      attachmentLink: invoice.attachmentLink || "",
      notes: invoice.notes || "",
      createdAt: serverTimestamp()

      tx.update(vendorRef, {
        advanceBalance: remainingAdvance

        vendorId: invoice.vendorId,
        paymentDate: invoice.invoiceDate,
        amount: appliedFromAdvance,
        mode: "advance_adjustment",
        reference: `Auto-applied from advance to ${invoice.invoiceNo}`,
        isAdvance: false,
        allocations: [{

async function recordPayment({
  vendorId,
  amount,
  paymentDate,
  mode,
  reference,

    db,
    doc,
    collection,
    getDocs,
    query,
    where,
    runTransaction,
    serverTimestamp
  } = fb();
  return runTransaction(db, async tx => {
    const vendorRef = doc(db, "vendors", vendorId);
    const vendorSnap = await tx.get(vendorRef);
    if (!vendorSnap.exists()) throw new Error("Vendor not found");
    const vendor = vendorSnap.data();
    let allocations = [];
    let unallocatedAmount = round2(amount);
    let invoiceUpdates = [];

        id: d.id,

      allocations = result.allocations;
      unallocatedAmount = result.unallocatedAmount;
      invoiceUpdates = allocations.map(a => {
        const inv = openInvoices.find(i => i.id === a.invoiceId);
        return {
          ref: doc(db, "invoices", a.invoiceId),
          newAmountPaid: round2((inv.amountPaid || 0) + a.amountApplied),
          newStatus: a.newStatus
        };

      tx.update(u.ref, {
        amountPaid: u.newAmountPaid,
        status: u.newStatus

      tx.update(vendorRef, {
        advanceBalance: round2((vendor.advanceBalance || 0) + unallocatedAmount)
      });
    }
    const paymentRef = doc(collection(db, "payments"));
    tx.set(paymentRef, {
      vendorId,
      paymentDate,
      amount: round2(amount),
      mode,
      reference: reference || "",
      isAdvance,
      allocations,
      unallocatedAmount,
      createdAt: serverTimestamp()

      paymentId: paymentRef.id,
      allocations,
      unallocatedAmount
    };
  });
}
async function deletePayment(payment) {
  const {
    db,
    doc,
    runTransaction
  } = fb();
  return runTransaction(db, async tx => {
    const paymentRef = doc(db, "payments", payment.id);
    const paymentSnap = await tx.get(paymentRef);
    if (!paymentSnap.exists()) throw new Error("Payment not found");
    const p = paymentSnap.data();
    const vendorRef = doc(db, "vendors", p.vendorId);
    const vendorSnap = await tx.get(vendorRef);
    if (!vendorSnap.exists()) throw new Error("Vendor not found");
    const vendor = vendorSnap.data();
    const newAdvanceBalance = round2((vendor.advanceBalance || 0) - (p.unallocatedAmount || 0));
    if (newAdvanceBalance < 0) {
      throw new Error("Can't delete: this payment's advance credit has already been used on a later bill. Reverse or edit that bill first.");
    }
    const invoiceReads = [];
    for (const alloc of p.allocations || []) {
      const invRef = doc(db, "invoices", alloc.invoiceId);
      const invSnap = await tx.get(invRef);
      if (invSnap.exists()) {
        invoiceReads.push({
          ref: invRef,
          data: invSnap.data(),
          alloc
        });
      }
    }
    const invoiceUpdates = invoiceReads.map(({
      ref,
      data,
      alloc
    }) => {
      const newAmountPaid = round2((data.amountPaid || 0) - alloc.amountApplied);
      if (newAmountPaid < -0.01) {
        throw new Error("Can't delete: " + alloc.invoiceNo + " has since received other payments that depend on this one. Reverse those first.");

      const safeAmountPaid = Math.max(0, newAmountPaid);
      const newStatus = safeAmountPaid <= 0 ? "open" : safeAmountPaid >= data.amount ? "paid" : "partial";
      return {
        ref,
        amountPaid: safeAmountPaid,
        status: newStatus
      };
    });
    for (const u of invoiceUpdates) {
      tx.update(u.ref, {
        amountPaid: u.amountPaid,
        status: u.status
      });
    }
    if ((p.unallocatedAmount || 0) > 0) {
      tx.update(vendorRef, {
        advanceBalance: newAdvanceBalance
      });
    }
    tx.delete(paymentRef);
  });
