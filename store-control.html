  --crit:#FF6B5B; --crit-soft:rgba(255,107,91,.16);
  --info:#5AA9E6; --info-soft:rgba(90,169,230,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --logo:var(--logo-dark);
  --rail:#101216;
  --stripe:rgba(255,255,255,.022);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EFF1F4; --panel:#FFFFFF; --panel2:#F6F7F9; --raise:#EDEFF3;
    --line:#DCE0E7; --line-soft:#E9ECF1;
    --txt:#12141A; --txt2:#59606C; --txt3:#8A919E;
    --field:#FFFFFF; --field-line:#C9CFD9;
    --brand-soft:rgba(227,0,22,.10);
    --shadow:0 8px 24px rgba(16,20,28,.10);
    --logo:var(--logo-light);
    --rail:#FFFFFF;
    --stripe:rgba(12,16,24,.022);
  }
}
:root[data-theme="light"]{
  --bg:#EFF1F4; --panel:#FFFFFF; --panel2:#F6F7F9; --raise:#EDEFF3;
  --line:#DCE0E7; --line-soft:#E9ECF1;
  --txt:#12141A; --txt2:#59606C; --txt3:#8A919E;
  --field:#FFFFFF; --field-line:#C9CFD9;
  --brand-soft:rgba(227,0,22,.10);
  --shadow:0 8px 24px rgba(16,20,28,.10);
  --logo:var(--logo-light);
  --rail:#FFFFFF;
  --stripe:rgba(12,16,24,.022);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand2);text-decoration:none}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-head{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.logo{width:132px;height:29px;background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:left center}
.rail-sub{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);font-weight:600}
.nav{padding:10px 8px 24px;display:flex;flex-direction:column;gap:2px}
.nav-grp{font-family:"Barlow Condensed",sans-serif;font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--txt3);font-weight:700;padding:16px 10px 6px}
.nav-grp:first-child{padding-top:6px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--txt2);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500;position:relative;transition:background .12s,color .12s}
.nav-i svg{width:15px;height:15px;flex:none;opacity:.8}
.nav-i:hover{background:var(--panel2);color:var(--txt)}
.nav-i.on{background:var(--brand-soft);color:var(--txt);font-weight:600}
.nav-i.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-i.on svg{opacity:1;color:var(--brand2)}
.nav-i .badge{margin-left:auto;background:var(--crit-soft);color:var(--crit);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:"IBM Plex Mono",monospace}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:23px;font-weight:700;letter-spacing:.005em;line-height:1.1}
.top .sub{color:var(--txt3);font-size:12px;margin-top:1px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opsel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.opsel label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:600;font-family:"Barlow Condensed",sans-serif}
.opsel input{background:none;border:0;font-weight:600;font-size:13px;padding:2px 0;width:132px;border-radius:4px}
.opsel input:focus{box-shadow:none;outline:1px solid var(--brand2)}
.burger{display:none}
.view{padding:20px 22px 60px;display:flex;flex-direction:column;gap:18px}

/* ============ ATOMS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--field-line);background:var(--panel2)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.gh{background:none}
.btn.dang{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:16.5px;font-weight:700;letter-spacing:.02em}
.card-h .hint{font-size:12px;color:var(--txt3)}
.card-h .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.flush{padding:0}

.lbl{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.55}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--panel2);color:var(--txt3);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--txt2);background:var(--panel2);border:1px solid var(--line-soft);padding:1px 6px;border-radius:4px}

/* ============ STAT STRIP ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat .k{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700}
.stat .v{font-size:27px;font-weight:700;font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .n{font-size:11.5px;color:var(--txt3)}
.stat.alert{border-color:color-mix(in srgb,var(--crit) 42%,var(--line))}
.stat.alert .v{color:var(--crit)}
.stat.warnst{border-color:color-mix(in srgb,var(--warn) 42%,var(--line))}
.stat.warnst .v{color:var(--warn)}

/* ============ TABLE ============ */
.tw{overflow-x:auto;overflow-y:visible}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel2);text-align:left;font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
tbody td.wrap{white-space:normal;min-width:180px}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
td.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
td.act{text-align:right;white-space:nowrap}
tfoot td{padding:9px 12px;border-top:1px solid var(--line);font-weight:700;background:var(--panel2);font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--txt3);font-size:13px}
.strong{font-weight:600;color:var(--txt)}

/* ============ FORM ============ */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px 14px;align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.w2{grid-column:span 2}
.fld.full{grid-column:1/-1}
.fld label{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt2);font-weight:700;display:flex;gap:5px;align-items:baseline}
.fld label .req{color:var(--brand2)}
input,select,textarea{background:var(--field);border:1px solid var(--field-line);border-radius:7px;padding:8px 10px;width:100%;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:60px}
input:disabled,select:disabled{opacity:.6}
.frow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.frow .sp{margin-left:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand)}

/* ============ MISC ============ */
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);padding:4px;border-radius:8px;border:1px solid var(--line)}
.tab{padding:6px 13px;border-radius:6px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--txt2)}
.tab.on{background:var(--panel);color:var(--txt);box-shadow:var(--shadow)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--txt2);display:flex;gap:10px}
.note.w{border-left-color:var(--warn)}
.note.c{border-left-color:var(--crit)}
.note b{color:var(--txt)}
.srch{max-width:280px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--txt2)}
.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(4,5,7,.62);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:640px;margin:auto 0}
.modal.wide{max-width:900px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:18px;font-weight:700}
.modal-h .x{margin-left:auto;background:none;border:0;color:var(--txt3);cursor:pointer;font-size:22px;line-height:1;padding:0 4px}
.modal-b{padding:18px}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;animation:sl .18s ease-out}
.toast.err{border-left-color:var(--crit)}
.toast.warn{border-left-color:var(--warn)}
@keyframes sl{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--txt);border-radius:9px;padding:9px 14px;font-size:12.5px}
.banner .sp{margin-left:auto}

/* BOM list */
.bom-line{display:grid;grid-template-columns:minmax(0,1fr) 92px 74px 34px;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.bom-line:last-of-type{border-bottom:0}
.bom-line .nm{font-size:13px;min-width:0}
.bom-line .nm small{display:block;color:var(--txt3);font-family:"IBM Plex Mono",monospace;font-size:11px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);height:100vh}
  .rail.open{transform:none}
  .burger{display:inline-flex}
  .split{grid-template-columns:1fr}
  .view{padding:16px 14px 60px}
  .top{padding:11px 14px}
  .top h1{font-size:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
}
/* print slip */
#printarea{display:none}
.slip{font-family:"IBM Plex Sans",sans-serif;color:#000;padding:14px 4px;max-width:760px}
.slip h2{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:0}
.slip .sh{display:flex;align-items:flex-start;gap:16px;border-bottom:2px solid #E30016;padding-bottom:10px;margin-bottom:14px}
.slip .sh .lg{width:150px;height:33px;background-image:var(--logo-light);background-size:contain;background-repeat:no-repeat}
.slip .sh .co{font-size:11px;color:#444;line-height:1.5}
.slip .sh .rt{margin-left:auto;text-align:right}
.slip table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.slip th,.slip td{border:1px solid #999;padding:6px 9px;text-align:left}
.slip th{background:#f0f0f0;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.slip .sg{display:flex;justify-content:space-between;margin-top:56px;font-size:12px}
.slip .sg div{border-top:1px solid #666;padding-top:5px;width:180px;text-align:center}
@media print{
  .rail,.top,.no-print,.toasts,.ovl{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  .card{border-color:#bbb;break-inside:avoid}
  body.printing .app{display:none!important}
  body.printing #printarea{display:block!important}
}

/* ==========================================================================
   COMPUTED STOCK
   ========================================================================== */
function toolReceived(id){ var s=0; DB.toolIn.forEach(function(r){ if(r.toolId===id) s+=num(r.qty); }); return s; }
function toolIssued(id){ var s=0; DB.toolIssue.forEach(function(r){ if(r.toolId===id) s+=num(r.qty); }); return s; }
function retFor(issueId){
  var g=0,dm=0;
  DB.toolRet.forEach(function(r){ if(r.issueId===issueId){ g+=num(r.good); dm+=num(r.damaged); } });
  return { good:g, dmg:dm };
}
function toolReturnedGood(id){
  var s=0;
  DB.toolRet.forEach(function(r){ var i=byId(DB.toolIssue,r.issueId); if(i&&i.toolId===id) s+=num(r.good); });
  return s;
}
function toolDamaged(id){
  var s=0;
  DB.toolRet.forEach(function(r){ var i=byId(DB.toolIssue,r.issueId); if(i&&i.toolId===id) s+=num(r.damaged); });
  return s;
}
function toolStock(id){ return toolReceived(id) - toolIssued(id) + toolReturnedGood(id); }
function issuePending(iss){ var r=retFor(iss.id); return num(iss.qty) - r.good - r.dmg; }
function toolOnFloor(id){
  var s=0; DB.toolIssue.forEach(function(r){ if(r.toolId===id) s+=issuePending(r); }); return s;
}
function compReceived(id){ var s=0; DB.compIn.forEach(function(r){ if(r.componentId===id) s+=num(r.qty); }); return s; }
function compConsumed(id){
  var s=0;
  DB.prodEntry.forEach(function(p){ (p.lines||[]).forEach(function(l){ if(l.c===id) s+=num(l.q); }); });
  return s;
}
function compStock(id){ return compReceived(id) - compConsumed(id); }
function fgMade(id){ var s=0; DB.prodEntry.forEach(function(r){ if(r.productId===id) s+=num(r.ok); }); return s; }
function fgOut(id){ var s=0; DB.dispatch.forEach(function(r){ if(r.productId===id) s+=num(r.qty); }); return s; }
function fgStock(id){ return fgMade(id) - fgOut(id); }
function bomCost(p){
  var s=0; (p.bom||[]).forEach(function(b){ var c=byId(DB.components,b.c); if(c) s += num(c.rate)*num(b.q); });
  return s;
}
function shortagesFor(productId, totalQty){
  var p = byId(DB.products, productId), out = [];
  if (!p) return out;
  (p.bom||[]).forEach(function(b){
    var c = byId(DB.components, b.c); if (!c) return;
    var need = num(b.q) * num(totalQty), have = compStock(b.c);
    if (need > have + 1e-9) out.push({ c:c, need:need, have:have, short:need-have });
  });
  return out;
}

    '" data-stop="1"><div class="modal-h"><h3>' + title + '</h3><button class="x" data-act="modal.close" aria-label="Close">&times;</button></div>' +
    '<div class="modal-b">' + body + '</div></div></div>';
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
window.JU = { tbl:tbl, stat:stat, card:card, cardFlush:cardFlush, opts:opts, fld:fld, inp:inp, sel:sel,
  v:v, n:n, setv:setv, toast:toast, modal:modal, closeModal:closeModal, ic:ic, $:$, $$:$$,
  state:state, get cur(){ return cur; } };

/* ---------- router ---------- */
function renderNav(){
  var pend = 0;
  DB.toolIssue.forEach(function(i){ if (S.issuePending(i) > 0) pend++; });
  var lowT = DB.tools.filter(function(t){ return S.toolStock(t.id) < S.num(t.min); }).length;
  var lowC = DB.components.filter(function(c){ return S.compStock(c.id) < S.num(c.min); }).length;
  var badges = { tret: pend, tstk: lowT, cin: lowC };
  var h = '';
  NAV.forEach(function(g){
    h += '<div class="nav-grp">' + g.g + '</div>';
    g.items.forEach(function(it){
      var b = badges[it[0]];
      h += '<button class="nav-i' + (it[0] === cur ? ' on' : '') + '" data-act="go" data-id="' + it[0] + '">' +
           ic(it[2]) + '<span>' + it[1] + '</span>' + (b ? '<span class="badge">' + b + '</span>' : '') + '</button>';
    });
  });
  $('#nav').innerHTML = h;
}
function go(id){ cur = id; state.tab = null; render(); window.scrollTo(0, 0); }
function render(){
  var V = VIEWS[cur] || VIEWS.dash;
  $('#vtitle').textContent = V.title;
  $('#vsub').textContent = V.sub || '';
  $('#view').innerHTML = V.html();
  if (V.after) V.after();
  renderNav();
  $('#rail').classList.remove('open');
  var sc = $('.scrim'); if (sc) sc.remove();
}
window.JR = { go:go, render:render, renderNav:renderNav };

/* ---------- operator ---------- */
function operator(){ return state.op || (DB.workers[0] ? DB.workers[0].name : 'Store'); }
window.JU.operator = operator;
function fillOperator(){
  var s = $('#opsel');
  var store = DB.workers.filter(function(w){ return /store/i.test(w.dept); })[0];
  state.op = DB.meta.operator || (store || DB.workers[0] || {}).name || 'Storekeeper';
  s.value = state.op;
  s.title = 'Name stamped on every entry — click to change';
  var upd = function(){
    state.op = s.value.trim() || 'Storekeeper';
    DB.meta.operator = state.op; S.save();
  };
  s.onchange = upd; s.onblur = upd;
}

VIEWS.dash = {
  title:'Dashboard', sub:'Live position of both stores',
  html:function(){
    var lowTools = DB.tools.map(function(t){ return { t:t, s:S.toolStock(t.id) }; })
      .filter(function(x){ return x.s < S.num(x.t.min); })
      .sort(function(a,b){ return (a.s - a.t.min) - (b.s - b.t.min); });
    var lowComp = DB.components.map(function(c){ return { c:c, s:S.compStock(c.id) }; })
      .filter(function(x){ return x.s < S.num(x.c.min); })
      .sort(function(a,b){ return (a.s - a.c.min) - (b.s - b.c.min); });

    var pend = DB.toolIssue.map(function(i){ return { i:i, p:S.issuePending(i) }; })
      .filter(function(x){ return x.p > 0; }).sort(function(a,b){ return a.i.date < b.i.date ? -1 : 1; });
    var pendVal = 0; pend.forEach(function(x){ var t = S.byId(DB.tools, x.i.toolId); if (t) pendVal += x.p * S.num(t.rate); });

    var m = S.today().slice(0, 7);
    var buyVal = 0; DB.toolIn.forEach(function(r){ if (String(r.date).slice(0,7) === m) buyVal += S.num(r.qty) * S.num(r.rate); });
    DB.compIn.forEach(function(r){ if (String(r.date).slice(0,7) === m) buyVal += S.num(r.qty) * S.num(r.rate); });

    var made = 0, rej = 0;
    DB.prodEntry.forEach(function(r){ if (String(r.date).slice(0,7) === m) { made += S.num(r.ok); rej += S.num(r.rej); } });
    var fgTot = 0, fgVal = 0;
    DB.products.forEach(function(p){ var s = S.fgStock(p.id); fgTot += s; fgVal += s * S.bomCost(p); });
    var dmg = 0, issuedTot = 0;
    DB.toolRet.forEach(function(r){ dmg += S.num(r.damaged); });
    DB.toolIssue.forEach(function(r){ issuedTot += S.num(r.qty); });

    var strip = '<div class="stats">' +
      stat('Tools below min', lowTools.length, lowTools.length ? 'Reorder required' : 'All above minimum', lowTools.length ? 'alert' : '') +
      stat('Not returned', pend.length, '₹' + S.inr(pendVal) + ' with workers', pend.length ? 'warnst' : '') +
      stat('Components below min', lowComp.length, lowComp.length ? 'Assembly may stop' : 'Assembly covered', lowComp.length ? 'alert' : '') +
      stat('FG in stock', S.qty(fgTot), '₹' + S.inr(fgVal) + ' at BOM cost') +
      stat('Painted this month', S.qty(made), rej ? S.qty(rej) + ' rejected' : 'No rejections') +
      stat('Purchases this month', '₹' + S.inr(buyVal), 'Tools + components') +
      '</div>';

    var reorder = tbl(
      [{h:'Item'},{h:'Store',cls:'num'},{h:'Min',cls:'num'},{h:'Short by',cls:'num'},{h:'Value to buy',cls:'num'}],
      lowTools.slice(0, 8).map(function(x){
        var sh = S.num(x.t.min) - x.s;
        return ['<span class="strong">' + S.esc(x.t.name) + '</span><br><span class="tag">' + S.esc(x.t.code) + '</span>',
          S.qty(x.s), S.qty(x.t.min), '<span class="pill crit"><i class="dot"></i>' + S.qty(sh) + '</span>', '₹' + S.inr(sh * S.num(x.t.rate))];
      }), { empty:'Every tool is above its minimum level.' });

    var pendT = tbl(
      [{h:'Issue No'},{h:'Worker'},{h:'Tool'},{h:'Pending',cls:'num'},{h:'Days out',cls:'num'},{h:'',cls:'act'}],
      pend.slice(0, 8).map(function(x){
        var days = Math.round((new Date(S.today()) - new Date(x.i.date)) / 86400000);
        return ['<span class="tag">' + S.esc(x.i.no) + '</span>', S.esc(S.nm(DB.workers, x.i.workerId)),
          S.esc(S.nm(DB.tools, x.i.toolId)), S.qty(x.p),
          '<span class="pill ' + (days > 21 ? 'crit' : days > 10 ? 'warn' : 'mute') + '">' + days + '</span>',
          '<button class="btn sm" data-act="tret.open" data-id="' + x.i.id + '">Receive</button>'];
      }), { empty:'Nothing pending with workers.' });

    var lowCompT = tbl(
      [{h:'Component'},{h:'Type'},{h:'Stock',cls:'num'},{h:'Min',cls:'num'},{h:'Blocks',cls:''}],
      lowComp.slice(0, 8).map(function(x){
        var blocks = DB.products.filter(function(p){ return (p.bom||[]).some(function(b){ return b.c === x.c.id; }); })
          .map(function(p){ return p.code; }).join(', ');
        return ['<span class="strong">' + S.esc(x.c.name) + '</span><br><span class="tag">' + S.esc(x.c.code) + '</span>',
          '<span class="pill mute">' + S.esc(x.c.type) + '</span>', S.qty(x.s), S.qty(x.c.min),
          '<span style="font-size:12px;color:var(--txt2)">' + S.esc(blocks || '—') + '</span>'];
      }), { empty:'All components above minimum.' });

    var prodRows = DB.products.map(function(p){
      var made30 = 0;
      DB.prodEntry.forEach(function(r){ if (r.productId === p.id && r.date >= S.daysAgo(30)) made30 += S.num(r.ok); });
      return { p:p, m:made30, s:S.fgStock(p.id) };
    });
    var maxM = Math.max.apply(null, prodRows.map(function(r){ return r.m; }).concat([1]));
    var prodT = tbl(
      [{h:'Model'},{h:'Painted · 30 days',cls:''},{h:'Qty',cls:'num'},{h:'FG stock',cls:'num'},{h:'Buildable now',cls:'num'}],
      prodRows.map(function(r){
        var can = Infinity;
        (r.p.bom||[]).forEach(function(b){ if (S.num(b.q) > 0) can = Math.min(can, Math.floor(S.compStock(b.c) / S.num(b.q))); });
        if (!isFinite(can)) can = 0;
        return ['<span class="strong">' + S.esc(r.p.code) + '</span>',
          '<div class="bar"><i style="width:' + Math.round(r.m / maxM * 100) + '%"></i></div>',
          S.qty(r.m), S.qty(r.s),
          '<span class="pill ' + (can <= 0 ? 'crit' : can < 20 ? 'warn' : 'ok') + '">' + can + '</span>'];
      }));

    var banner = DB.meta.sample ? '<div class="banner"><b>Sample data loaded.</b> Masters and transactions below are examples so you can see how the system behaves. ' +
      '<span class="sp"><button class="btn sm" data-act="sys.clear">Clear sample data &amp; start fresh</button></span></div>' : '';
    var noPersist = !S.persistOK() ? '<div class="note c"><div><b>Storage blocked in this window.</b> Entries will not survive a refresh here. Open the page directly (not inside a preview frame) or download the offline copy.</div></div>' : '';

    return banner + noPersist + strip +
      '<div class="split">' +
        cardFlush('Reorder — Workshop Tools', lowTools.length + ' item(s) below minimum', reorder,
          '<button class="btn sm" data-act="go" data-id="tstk">Full stock</button>') +
        cardFlush('Tools Not Returned', pend.length + ' open issue(s)', pendT,
          '<button class="btn sm" data-act="go" data-id="tret">Return desk</button>') +
      '</div>' +
      '<div class="split">' +
        cardFlush('Component Shortage — Assembly', lowComp.length + ' item(s) below minimum', lowCompT,
          '<button class="btn sm" data-act="go" data-id="cin">Book inward</button>') +
        cardFlush('Production & Buildable Quantity', 'Last 30 days', prodT,
          '<button class="btn sm pri" data-act="go" data-id="prod">Paint entry</button>') +
      '</div>';
  }
};

  html:function(){
    var f =
      '<div class="form">' +
        fld('ti_date','Date <span class="req">*</span>', inp('ti_date','date',' value="' + S.today() + '"')) +

        fld('ti_tool','Item <span class="req">*</span>', sel('ti_tool', opts(DB.tools, '', function(o){ return o.code + ' · ' + o.name; })), 'w2') +

    var rows = DB.toolIn.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0, 60).map(function(r){
      var t = S.byId(DB.tools, r.toolId);

        '<button class="btn sm dang gh" data-act="tin.del" data-id="' + r.id + '">Delete</button>'];
    });
    var totVal = 0; DB.toolIn.forEach(function(r){ totVal += S.num(r.qty) * S.num(r.rate); });
    var t = tbl([{h:'GRN No'},{h:'Date'},{h:'Vendor'},{h:'Bill / Challan'},{h:'Item'},{h:'Qty',cls:'num'},
      {h:'Rate',cls:'num'},{h:'Value',cls:'num'},{h:'',cls:'act'}], rows,

    ['ti_qty','ti_rate'].forEach(function(id){ var e = $('#' + id); if (e) e.oninput = recalc; });
    var ts = $('#ti_tool');
    if (ts) ts.onchange = function(){ var t = S.byId(DB.tools, ts.value); if (t && !v('ti_rate')) setv('ti_rate', t.rate); recalc(); };

function tinSave(keepHeader){
  var d = v('ti_date'), ven = v('ti_vendor'), dno = v('ti_dno'), tool = v('ti_tool'), q = n('ti_qty');
  if (!d || !ven || !dno || !tool || q <= 0) { toast('Fill date, vendor, bill/challan no, item and quantity.', 'err'); return; }
  var rec = { id:S.uid('ti'), no:S.docNo('GRN', DB.toolIn), date:d, vendorId:ven, docType:v('ti_dtype'),
    docNo:dno, toolId:tool, qty:q, rate:n('ti_rate'), remarks:v('ti_rem'), by:operator() };
  DB.toolIn.push(rec); S.save();
  toast('Inward ' + rec.no + ' posted — ' + S.qty(q) + ' ' + S.nm(DB.tools, tool));
  var keep = { d:d, ven:ven, dt:v('ti_dtype'), dno:dno };
  render();
  if (keepHeader) {
    setv('ti_date', keep.d); setv('ti_vendor', keep.ven); setv('ti_dtype', keep.dt); setv('ti_dno', keep.dno);
    var e = $('#ti_tool'); if (e) e.focus();
  }
}

VIEWS.tiss = {

    var f =
      '<div class="form">' +
        fld('is_date','Date <span class="req">*</span>', inp('is_date','date',' value="' + S.today() + '"')) +
        fld('is_worker','Worker <span class="req">*</span>', sel('is_worker', opts(DB.workers, '', function(o){ return o.name + ' (' + o.code + ') — ' + o.dept; })), 'w2') +
        fld('is_tool','Tool <span class="req">*</span>', sel('is_tool', opts(DB.tools, '', function(o){ return o.code + ' · ' + o.name + '  [store: ' + S.qty(S.toolStock(o.id)) + ']'; })), 'w2') +

      '</div>' +
      '<div class="frow"><button class="btn pri" data-act="tiss.save">Issue tool</button>' +

      var p = S.issuePending(r), rr = S.retFor(r.id), t = S.byId(DB.tools, r.toolId);

        '<span class="pill ' + (days > 21 ? 'crit' : days > 10 ? 'warn' : 'mute') + '">' + days + ' d</span>',
        '<button class="btn sm pri" data-act="tret.open" data-id="' + r.id + '">Receive</button>'];
    });
    var openT = tbl([{h:'Issue No'},{h:'Issued on'},{h:'Worker'},{h:'Tool'},{h:'Pending',cls:'num'},{h:'Age',cls:'num'},{h:'',cls:'act'}],

  after:function(){

VIEWS.tstk = {

window.JA1 = {
  'tin.save': function(){ tinSave(false); },
  'tin.saveNext': function(){ tinSave(true); },
  'tin.del': function(el){
    var i = DB.toolIn.map(function(r){ return r.id; }).indexOf(el.dataset.id);
    if (i < 0) return;
    if (!confirm('Delete this inward entry? Stock will reduce accordingly.')) return;
    DB.toolIn.splice(i, 1); S.save(); toast('Inward entry deleted.', 'warn'); render();
  },
  'tiss.save': function(){
    var d = v('is_date'), w = v('is_worker'), t = v('is_tool'), q = n('is_qty');
    if (!d || !w || !t || q <= 0) { toast('Fill date, worker, tool and quantity.', 'err'); return; }
    var have = S.toolStock(t);
    if (q > have) { toast('Only ' + S.qty(have) + ' in store. Book an inward entry first.', 'err'); return; }
    var rec = { id:S.uid('is'), no:S.docNo('ISS', DB.toolIssue), date:d, workerId:w, toolId:t, qty:q,
      machine:v('is_mc'), job:v('is_job'), remarks:v('is_rem'), by:operator() };
    DB.toolIssue.push(rec); S.save();
    toast('Issued ' + S.qty(q) + ' ' + S.nm(DB.tools, t) + ' to ' + S.nm(DB.workers, w) + ' — ' + rec.no);
    render();
  },
  'tiss.del': function(el){
    var id = el.dataset.id;
    if (DB.toolRet.some(function(r){ return r.issueId === id; })) { toast('Delete the returns against this issue first.', 'err'); return; }
    if (!confirm('Delete this issue entry?')) return;
    DB.toolIssue = DB.toolIssue.filter(function(r){ return r.id !== id; }); S.save();
    toast('Issue deleted.', 'warn'); render();
  },

  'tret.open': function(el){ state.retIssue = el.dataset.id; cur = 'tret'; render(); window.scrollTo(0,0); },
  'tret.save': function(){
    var iss = S.byId(DB.toolIssue, v('rt_iss'));
    if (!iss) { toast('Select the issue you are receiving against.', 'err'); return; }
    var g = n('rt_good'), dm = n('rt_dmg');
    if (g + dm <= 0) { toast('Enter good and / or damaged quantity.', 'err'); return; }
    var pend = S.issuePending(iss);
    if (g + dm > pend + 1e-9) { toast('Only ' + S.qty(pend) + ' pending on ' + iss.no + '.', 'err'); return; }
    if (dm > 0 && !v('rt_rem')) { toast('Record a reason for the damaged quantity.', 'err'); return; }
    DB.toolRet.push({ id:S.uid('rt'), date:v('rt_date') || S.today(), issueId:iss.id, good:g, damaged:dm,
      remarks:v('rt_rem'), by:operator() });
    S.save();
    toast('Return posted — ' + S.qty(g) + ' good back to store' + (dm ? ', ' + S.qty(dm) + ' written off' : '') + '.');
    render();

  }

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'modal.close') { if (e.target.closest('[data-stop]') && e.target.tagName !== 'BUTTON') return; closeModal(); return; }
  if (act === 'go') { go(el.dataset.id); return; }
  var tables = [window.JA1, window.JA2 || {}];
  for (var i = 0; i < tables.length; i++) if (tables[i][act]) { tables[i][act](el, e); return; }
});

  var el = e.target;
  if (!el.dataset || !el.dataset.search) return;
  var t = document.getElementById(el.dataset.search); if (!t) return;
  var q = el.value.toLowerCase();
  $$('tbody tr', t).forEach(function(tr){
    tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
  });
});

};

  var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  var now = r.getAttribute('data-theme') || m;

};
if (DB.meta && DB.meta.theme) document.documentElement.setAttribute('data-theme', DB.meta.theme);

function bomPreview(pid, total){
  var p = S.byId(DB.products, pid);

  var rows = (p.bom || []).map(function(b){

    var need = S.num(b.q) * total, have = S.compStock(b.c), after = have - need;

  });
  var cost = S.bomCost(p) * total;
  return tbl([{h:'Component'},{h:'Type'},{h:'Per unit',cls:'num'},{h:'To deduct',cls:'num'},{h:'Stock now',cls:'num'},{h:'Stock after',cls:'num'}],
    rows, { empty:'This model has no BOM yet — add one under Products & BOM.',
      foot:['Material cost of this batch','','','','','₹ ' + S.inr(cost)] });
}

/* ---------- automatic codes, by group ---------- */
var CODEPFX = {
  tools:{ target:'code', group:'cat', map:{ Drill:'DRL', Tap:'TAP', Insert:'INS', Holder:'HLD', Milling:'MIL',
    Reamer:'RMR', Abrasive:'ABR', Gauge:'GAG', Consumable:'CON', Other:'TL' } },
  components:{ target:'code', group:'type', map:{ Casting:'CST', Hardware:'HW', Accessory:'AC' } },
  workers:{ target:'code', fixed:'EMP' }
};
function nextCode(kind, pfx){
  var arr = DB[MAST[kind].key], f = CODEPFX[kind].target, top = 0;
  var re = new RegExp('^' + pfx.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '[-\\s]?(\\d+)$', 'i');
  arr.forEach(function(o){ var mm = re.exec(String(o[f] || '').trim()); if (mm) top = Math.max(top, parseInt(mm[1], 10)); });
  var c, k = top;
  do { k++; c = pfx + '-' + S.pad(k, 3); }
  while (arr.some(function(o){ return String(o[f] || '').trim().toUpperCase() === c.toUpperCase(); }));
  return c;
}
function wireAutoCode(kind, id){
  var cfg = CODEPFX[kind]; if (!cfg || id) return;
  var codeEl = $('#m_' + cfg.target); if (!codeEl) return;
  var grpEl = cfg.group ? $('#m_' + cfg.group) : null;
  var apply = function(){
    if (codeEl.dataset.manual === '1') return;
    var pfx = cfg.fixed || (cfg.map[grpEl ? grpEl.value : ''] || 'GEN');
    codeEl.value = nextCode(kind, pfx);
  };
  codeEl.dataset.manual = '';
  codeEl.title = 'Filled automatically from the group — type over it if you use your own numbering';
  codeEl.oninput = function(){ codeEl.dataset.manual = '1'; };
  if (grpEl) grpEl.onchange = apply;
  apply();
  var lab = codeEl.parentNode.querySelector('label');
  if (lab && lab.querySelector('.auto') === null) {
    var b = document.createElement('span');
    b.className = 'auto'; b.textContent = 'AUTO';
    b.style.cssText = 'font-size:9.5px;letter-spacing:.1em;background:var(--info-soft);color:var(--info);padding:1px 5px;border-radius:3px;margin-left:4px';
    lab.appendChild(b);
  }
}

      }), { empty:'No dispatches in this range.' });

      cardFlush('Worker-wise Tool Consumption & Damage', 'Consumed value = issued − returned good, at purchase rate', wT,
        '<button class="btn sm" data-act="xl.worker">Export Excel</button>') +

        cardFlush('Dispatch by Party', 'Finished goods sent out', dT) +

var CRCT = null;
function crc32(u8){
  if (!CRCT) { CRCT = []; for (var i = 0; i < 256; i++) { var c = i; for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); CRCT[i] = c >>> 0; } }

function enc(str){ return new TextEncoder().encode(str); }
function zipStore(files){
  var parts = [], central = [], offset = 0;
  files.forEach(function(f){
    var data = enc(f.s), crc = crc32(data), nm = enc(f.n);
    var lh = new Uint8Array(30 + nm.length), d = new DataView(lh.buffer);
    d.setUint32(0, 0x04034b50, true); d.setUint16(4, 20, true); d.setUint32(14, crc, true);
    d.setUint32(18, data.length, true); d.setUint32(22, data.length, true); d.setUint16(26, nm.length, true);
    lh.set(nm, 30);
    parts.push(lh, data);
    var ch = new Uint8Array(46 + nm.length), c = new DataView(ch.buffer);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nm.length, true); c.setUint32(42, offset, true);
    ch.set(nm, 46);
    central.push(ch);
    offset += lh.length + data.length;
  });

  var eo = new Uint8Array(22), e = new DataView(eo.buffer);
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);

/* ---------- PIN hashing (obfuscation, not encryption) ---------- */
function hashPin(pin){
  var s = 'jayco-store::' + String(pin), h1 = 0x811c9dc5, h2 = 0x1000193;
  for (var i = 0; i < s.length; i++) {
    h1 ^= s.charCodeAt(i); h1 = (h1 * 0x01000193) >>> 0;
    h2 = ((h2 << 5) - h2 + s.charCodeAt(i) * (i + 7)) >>> 0;
  }
  return ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
}

function stamp(k){
  var o = {}, arr = S.DB[k] || [];

function diffOps(){
  var ops = [];
  COLS.forEach(function(k){
    var arr = S.DB[k] || [], cur = {}, prev = shadow[k] || {};
    arr.forEach(function(r){ cur[r.id] = JSON.stringify(r); });
    arr.forEach(function(r){ if (prev[r.id] !== cur[r.id]) ops.push({ t:'set', k:k, id:r.id, d:r }); });
    Object.keys(prev).forEach(function(id){ if (!(id in cur)) ops.push({ t:'del', k:k, id:id }); });
    shadow[k] = cur;
  });
  var mj = JSON.stringify(S.DB.meta || {});
  if (shadow.__meta !== mj) { ops.push({ t:'meta', d:S.DB.meta }); shadow.__meta = mj; }
  return ops;
}
function commit(ops, done){
  if (!ops.length) { if (done) done(); return; }
  chip('Saving…', 'busy');
  var chunks = [], i = 0;
  while (i < ops.length) { chunks.push(ops.slice(i, i + 400)); i += 400; }
  var run = function(n){
    if (n >= chunks.length) { chip('Firebase', 'on'); if (done) done(); return; }
    var b = fdb.batch();
    chunks[n].forEach(function(op){
      if (op.t === 'meta') b.set(fdb.collection(P + 'meta').doc('app'), op.d, { merge:true });
      else if (op.t === 'set') b.set(fdb.collection(P + op.k).doc(String(op.id)), op.d, { merge:false });
      else b.delete(fdb.collection(P + op.k).doc(String(op.id)));
    });
    b.commit().then(function(){ run(n + 1); }, function(e){
      chip('Not saved', 'off');
      U.toast('Firebase refused the write: ' + (e && e.message ? e.message : 'unknown error'), 'err');
    });
  };
  run(0);
}

var localSave = S.save;
window.JS.save = function(){
  try { localSave(); } catch (e) {}
  if (!ready || applying) return;
  commit(diffOps());
};

/* ---------- listeners ---------- */
function attach(){
  COLS.forEach(function(k){
    live[k] = fdb.collection(P + k).onSnapshot(function(snap){
      applying = true;
      var arr = [];
      snap.forEach(function(doc){ var d = doc.data() || {}; d.id = doc.id; arr.push(d); });
      S.DB[k] = arr;
      stamp(k);
      firstSnap[k] = true;
      applying = false;
      try { localSave(); } catch (e) {}
      if (!ready && COLS.every(function(x){ return firstSnap[x]; })) { ready = true; afterFirstLoad(); }
      scheduleRender();
    }, function(e){
      chip('Read blocked', 'off');
      U.toast('Firestore read blocked: ' + (e && e.message ? e.message : '') + ' — check the published rules.', 'err');
    });
  });
  live.meta = fdb.collection(P + 'meta').doc('app').onSnapshot(function(doc){
    if (!doc.exists) return;
    applying = true;
    var m = doc.data() || {};
    Object.keys(m).forEach(function(x){ S.DB.meta[x] = m[x]; });
    shadow.__meta = JSON.stringify(S.DB.meta);
    applying = false;
  });
}

var offered = false;
function afterFirstLoad(){
  chip('Firebase', 'on');
  closeGate();
  var empty = COLS.every(function(k){ return !(S.DB[k] || []).length; });
  if (empty && !offered) { offered = true; seedScreen(); }
  else scheduleRender();
}

function seedScreen(){
  var local = null;
  try { local = JSON.parse(localStorage.getItem('jayco_store_v1') || 'null'); } catch (e) {}
  var counts = local ? COLS.reduce(function(a, k){ return a + ((local[k] || []).length); }, 0) : 0;
  gate(
    '<h2>Firestore is empty</h2>' +
    '<p>Nothing has been written to <b>' + esc(activeCfg().projectId) + '</b> yet. Choose how to start.</p>' +
    (counts ? '<div class="note"><div>This browser holds <b>' + counts + ' records</b> — masters, registers and BOMs. Uploading copies all of them into Firestore.</div></div>' : '') +
    '<div class="frow" style="flex-direction:column;align-items:stretch;gap:9px;border-top:0">' +
      (counts ? '<button class="btn pri" id="sd_up">Upload this browser\'s ' + counts + ' records</button>' : '') +
      '<button class="btn" id="sd_fresh">Start with the standard masters, no transactions</button>' +
      '<button class="btn gh" id="sd_blank">Start completely blank</button>' +
    '</div>', true);

  var push = function(d){
    var keepPin = S.DB.meta && S.DB.meta.pinHash;
    applying = true;
    COLS.forEach(function(k){ S.DB[k] = d[k] || []; shadow[k] = {}; });
    if (d.meta) { Object.keys(S.DB.meta).forEach(function(x){ delete S.DB.meta[x]; });
      Object.keys(d.meta).forEach(function(x){ S.DB.meta[x] = d.meta[x]; }); }
    if (keepPin) S.DB.meta.pinHash = keepPin;
    shadow.__meta = '';
    applying = false;
    chip('Uploading…', 'busy');
    commit(diffOps(), function(){ closeGate(); U.toast('Uploaded to Firestore.'); R.render(); });
  };
  if ($('#sd_up')) $('#sd_up').onclick = function(){ push(local); };
  $('#sd_fresh').onclick = function(){
    var d = S.seed();
    ['toolIn','toolIssue','toolRet','compIn','prodEntry','dispatch'].forEach(function(k){ d[k] = []; });
    d.meta.sample = false; push(d);
  };
  $('#sd_blank').onclick = function(){
    var d = S.seed();
    COLS.forEach(function(k){ d[k] = []; });
    d.meta.sample = false; push(d);
  };
}

/* ---------- unlock ---------- */
function unlock(){
  unlocked = true;
  gate('<h2>Loading registers…</h2><p>Reading from ' + esc(activeCfg().projectId) + '.</p>');
  chip('Connecting…', 'busy');
  attach();
}

/* ---------- Firebase card inside Backup & Data ---------- */
var sysHtml = window.JV.sys.html;
window.JV.sys.html = function(){
  var cfg = activeCfg();
  var body =
    '<div class="kv"><span>Project</span><span>' + esc(cfg ? cfg.projectId : '—') + '</span></div>' +
    '<div class="kv"><span>Sign-in</span><span>Anonymous + store PIN</span></div>' +
    '<div class="kv"><span>Collections</span><span>' + P + '*</span></div>' +
    '<div class="kv"><span>Connection</span><span>' + (ready ? 'Live' : 'Connecting') + '</span></div>' +
    '<div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">' +
      '<button class="btn" data-act="fb.pin">Change store PIN</button>' +
      '<button class="btn" data-act="fb.push">Force re-upload everything</button>' +
      '<button class="btn dang" data-act="fb.lock">Lock this device</button>' +
    '</div>' +
    '<div class="note w" style="margin-top:12px"><div>The PIN keeps the screen shut on a shared PC. It is not a wall around the database — treat the page URL as the thing worth keeping private.</div></div>';
  return sysHtml() + '<div class="split">' + U.card('Firebase', 'Where this data actually lives', body) + '</div>';
};
window.JA2['fb.push'] = function(){
  COLS.forEach(function(k){ shadow[k] = {}; });
  shadow.__meta = '';
  commit(diffOps(), function(){ U.toast('Everything re-uploaded.'); });
};
window.JA2['fb.lock'] = function(){
  remember(false); location.reload();
};
window.JA2['fb.pin'] = function(){
  U.modal('Change store PIN',
    '<div class="form">' +
      U.fld('np1','Current PIN', '<input id="np1" type="password" inputmode="numeric">') +
      U.fld('np2','New PIN', '<input id="np2" type="password" inputmode="numeric">') +
      U.fld('np3','Repeat new PIN', '<input id="np3" type="password" inputmode="numeric">') +
    '</div><div class="err" id="np_err" style="color:var(--crit);font-size:12.5px;min-height:16px"></div>' +
    '<div class="frow"><button class="btn pri" data-act="fb.pinGo">Save PIN</button>' +
    '<button class="btn" data-act="modal.close">Cancel</button></div>');
};
window.JA2['fb.pinGo'] = function(){
  var cur = U.v('np1'), a = U.v('np2'), b = U.v('np3');
  if (hashPin(cur) !== S.DB.meta.pinHash) { $('#np_err').textContent = 'Current PIN is wrong.'; return; }
  if (a.length < 4) { $('#np_err').textContent = 'Use at least 4 characters.'; return; }
  if (a !== b) { $('#np_err').textContent = 'The two new entries do not match.'; return; }
  S.DB.meta.pinHash = hashPin(a);
  S.save();
  U.closeModal();
  U.toast('Store PIN changed on every device.');
};

/* ---------- boot ---------- */
function boot(){
  if (typeof firebase === 'undefined') {
    gate('<h2>Firebase did not load</h2><p>The Firebase library could not be fetched. Check the internet connection on this PC and reload the page.</p>');
    chip('Offline', 'off');
    return;
  }
  var cfg = activeCfg();
  if (!cfg) { chip('Not connected', 'off'); setupScreen(); return; }
  try { firebase.initializeApp(cfg); }
  catch (e) { setupScreen('Could not start Firebase with those settings: ' + e.message); return; }
  window.__fbFix = function(){ setupScreen('Paste the firebaseConfig block from your console.'); };
  auth = firebase.auth();
  fdb = firebase.firestore();
  fdb.enablePersistence({ synchronizeTabs:true }).catch(function(){});
  chip('Connecting…', 'busy');
  gate('<h2>Connecting…</h2><p>Reaching ' + esc(cfg.projectId) + '.</p>');

  auth.onAuthStateChanged(function(user){
    if (!user) {
      auth.signInAnonymously().catch(function(e){
        var c = e && e.code;
        gate('<h2>Cannot sign in</h2><p>' + esc(
          c === 'auth/operation-not-allowed'
            ? 'Anonymous sign-in is switched off in this Firebase project. Open Firebase Console → Build → Authentication → Sign-in method → enable Anonymous, then reload this page.'
            : c === 'auth/network-request-failed' ? 'No internet connection on this device.'
            : (e && e.message) || 'Sign-in failed.') + '</p>' +
          '<div class="frow"><button class="btn pri" onclick="location.reload()">Reload</button>' +
          '<button class="btn" id="fb_fix">Enter Firebase settings</button></div>');
        chip('Locked', 'off');
        $('#fb_fix').onclick = function(){ setupScreen('Paste the firebaseConfig block from your console.'); };
      });
      return;
    }
    fdb.collection(P + 'meta').doc('app').get().then(function(doc){
      var m = doc.exists ? (doc.data() || {}) : {};
      if (!m.pinHash) { setPinScreen(); return; }
      S.DB.meta.pinHash = m.pinHash;
      if (remembered()) unlock(); else pinScreen(m.pinHash);
    }, function(e){
      gate('<h2>Firestore refused the read</h2><p>' + esc(e.message || e.code) +
        '</p><p>Publish the security rules that came with this app, then reload.</p>' +
        '<div class="frow"><button class="btn pri" onclick="location.reload()">Reload</button>' +
        '<button class="btn" id="fb_fix">Enter Firebase settings</button></div>');
      chip('Read blocked', 'off');
      $('#fb_fix').onclick = function(){ setupScreen('Paste the firebaseConfig block from your console.'); };
    });
  });

  window.addEventListener('online', function(){ if (ready) chip('Firebase', 'on'); });
  window.addEventListener('offline', function(){ chip('Offline — cached', 'busy'); });
}
boot();
})();

</script>
